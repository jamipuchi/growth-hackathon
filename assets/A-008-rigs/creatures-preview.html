<header><div><small>SPACE PARTY / A-008</small><h1>The creature workshop.</h1><p>Five original rigs. Shared motion, different proportions.</p></div><div class="controls"><select id="type" aria-label="Creature"></select><select id="clip" aria-label="Animation"></select><select id="scale" aria-label="Proportions"><option value="all">0.7 / 1.0 / 1.4</option><option value="1">Reference</option><option value="0.7">Short segments</option><option value="1.4">Long segments</option></select><button id="play">Pause</button><input id="phase" type="range" min="0" max="1" step=".01" value="0" aria-label="Animation phase"><button id="sheet">All clips</button><button id="next">Next clips</button><button id="gallery">All creatures</button><button id="angle">Side view</button></div></header><div id="labels"></div><footer id="status">Loading original CC0 creature rigs…</footer><script type="module">
import * as THREE from 'three';import {CREATURE_TYPES,createCreature} from './creatures.js';
const ACTIVE_TYPES=CREATURE_TYPES.filter(t=>!new URLSearchParams(location.search).has('types')||new URLSearchParams(location.search).get('types').split(',').includes(t));
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(34,1,.02,200),scene=new THREE.Scene();scene.background=new THREE.Color('#17212c');scene.add(new THREE.HemisphereLight(0xe5f3ff,0x494252,2.5));
const key=new THREE.DirectionalLight(0xffe3bc,3.2);key.position.set(-4,7,-5);scene.add(key);const rim=new THREE.DirectionalLight(0x92cfff,2);rim.position.set(5,3,4);scene.add(rim);
const all={};for(const type of ACTIVE_TYPES){all[type]=await Promise.all([.7,1,1.4].map(limbScale=>createCreature({type,limbScale,animation:null})));all[type].forEach(a=>scene.add(a.object3d));}
const select=document.querySelector('#type'),clipSelect=document.querySelector('#clip'),scaleSelect=document.querySelector('#scale'),labels=document.querySelector('#labels');select.innerHTML=ACTIVE_TYPES.map(t=>`<option>${t}</option>`).join('');
let type=ACTIVE_TYPES[0],clip='idle',mode='motion',playing=true,phase=.25,side=false,last=0,sheetStart=0;const restBounds={};
function bounds(a){a.object3d.updateMatrixWorld(true);const box=new THREE.Box3(),v=new THREE.Vector3();a.object3d.traverse(o=>{if(!o.isMesh)return;if(o.isSkinnedMesh)o.skeleton.update();for(let i=0;i<o.geometry.attributes.position.count;i++){o.getVertexPosition(i,v).applyMatrix4(o.matrixWorld);box.expandByPoint(v);}});return box;}
function seek(a,name,p){a.play(name,{fade:0,loop:false,restart:true});a.mixer.setTime(a.clips.find(c=>c.name===name).duration*p);}
for(const t of ACTIVE_TYPES){const b=new THREE.Box3();all[t].forEach(a=>b.union(bounds(a)));restBounds[t]=b;}
function choices(){clipSelect.innerHTML=all[type][1].clips.map(c=>`<option>${c.name}</option>`).join('');clip=all[type][1].clips.some(c=>c.name===clip)?clip:all[type][1].clips[0].name;clipSelect.value=clip;}
function cells(){
 if(mode==='gallery')return ACTIVE_TYPES.map(t=>({a:all[t][1],type:t,clip:all[t][1].clips[0].name,phase:.25,label:t.toUpperCase()}));
 if(mode==='sheet')return all[type][1].clips.slice(sheetStart,sheetStart+5).flatMap(c=>all[type].map(a=>({a,type,clip:c.name,phase:c.name==='die'?.97:c.name==='land'?.45:.35,label:`${c.name} · ${a.limbScale}×`})));
 return all[type].filter(a=>scaleSelect.value==='all'||String(a.limbScale)===scaleSelect.value).map(a=>({a,type,clip,phase,label:`${clip} · ${a.limbScale}× segments`}));
}
function render(){
 document.querySelector('#play').textContent=playing?'Pause':'Play';
 const list=cells(),cols=mode==='gallery'?(innerWidth<700?2:3):mode==='sheet'?3:list.length,rows=Math.ceil(list.length/cols),top=innerWidth<700?185:136,bottom=45,w=(innerWidth-36)/cols,h=(innerHeight-top-bottom)/rows;
 renderer.setScissorTest(false);renderer.setViewport(0,0,innerWidth,innerHeight);renderer.clear();renderer.setScissorTest(true);
 for(let i=0;i<list.length;i++){
  const cell=list[i];Object.values(all).flat().forEach(a=>a.object3d.visible=false);cell.a.object3d.visible=true;seek(cell.a,cell.clip,cell.phase);
  const posed=bounds(cell.a),box=mode==='motion'&&list.length===1?posed:restBounds[cell.type].clone().union(posed),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
  const x=18+(i%cols)*w,y=innerHeight-top-(Math.floor(i/cols)+1)*h;
  renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  const direction=(side?new THREE.Vector3(1,.22,0):new THREE.Vector3(.8,.38,-1)).normalize(),right=new THREE.Vector3(0,1,0).cross(direction).normalize(),up=direction.clone().cross(right),tanV=Math.tan(THREE.MathUtils.degToRad(17));let distance=0;
  for(const bx of [box.min.x,box.max.x])for(const by of [box.min.y,box.max.y])for(const bz of [box.min.z,box.max.z]){const v=new THREE.Vector3(bx,by,bz).sub(center),depth=v.dot(direction);distance=Math.max(distance,depth+Math.abs(v.dot(right))/(tanV*camera.aspect),depth+Math.abs(v.dot(up))/tanV);}
  camera.position.copy(center).addScaledVector(direction,distance*1.18);camera.lookAt(center);renderer.render(scene,camera);
 }
 renderer.setScissorTest(false);labels.style.gridTemplateColumns=`repeat(${cols},1fr)`;labels.style.gridTemplateRows=`repeat(${rows},1fr)`;labels.innerHTML=list.map(c=>`<div class="label">${c.label}</div>`).join('');
 document.querySelector('#status').textContent=`CC0 · r160 · 1 mesh / 1 material / 0 image textures per creature · ${mode==='sheet'?'all clips, three proportions':mode==='gallery'?'five independent skeletons':type+' / '+clip} · physical-phone performance unmeasured`;
}
function resize(){renderer.setSize(innerWidth,innerHeight);render();}
select.onchange=e=>{type=e.target.value;mode='motion';choices();render();};clipSelect.onchange=e=>{clip=e.target.value;mode='motion';phase=0;render();};scaleSelect.onchange=()=>{mode='motion';render();};
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';};document.querySelector('#phase').oninput=e=>{playing=false;phase=Number(e.target.value);document.querySelector('#play').textContent='Play';render();};document.querySelector('#sheet').onclick=()=>{mode='sheet';sheetStart=0;render();};document.querySelector('#next').onclick=()=>{mode='sheet';sheetStart=(sheetStart+5)%all[type][1].clips.length;render();};document.querySelector('#gallery').onclick=()=>{mode='gallery';render();};document.querySelector('#angle').onclick=e=>{side=!side;e.target.textContent=side?'Three-quarter view':'Side view';render();};
if(innerWidth<700)scaleSelect.value='1';choices();addEventListener('resize',resize);resize();
function frame(now){if(playing&&mode==='motion'){phase=(phase+Math.min((now-last)/1000,.05)/all[type][1].metadata.clips[clip].duration)%1;document.querySelector('#phase').value=phase;render();}last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.reviewCreatures={renderer,all,scene,camera,bounds,show(t,c,p=.35,scale='all'){type=t;select.value=t;clip=c;choices();clipSelect.value=c;phase=p;playing=false;scaleSelect.value=scale;mode='motion';render();},sheet(t,start=0){type=t;select.value=t;choices();sheetStart=start;playing=false;mode='sheet';render();},gallery(){playing=false;mode='gallery';render();},side(value){side=value;render();},render};window.previewReady=true;
</script></html>
