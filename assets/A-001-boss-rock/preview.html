<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<header><div><div class="eyebrow">SPACE PARTY / ASSET A-001</div><h1>The red enemy.</h1><p id="subtitle">Armour seams · mechanical housings · a pulsing reactor</p></div><div class="controls"><select id="view" aria-label="Review view"><option value="gallery">Three armour states</option><option value="intact">Intact · 100 m</option><option value="cracked">Cracked · 100 m</option><option value="broken">Broken · 100 m</option><option value="close">Reactor · 48 m</option><option value="rear">Rear · 100 m</option><option value="decoy">Legacy decoy · 100 m</option></select><button id="spin">Rotate</button><button id="bloom">Bloom on</button></div></header>
<div id="labels"></div><footer id="status">Loading actual GLB exports…</footer>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createBossEncounter, setArmourState, updateBoss, disposeBossPulse, ARMOUR_STATES } from './boss.js';
const report={three:THREE.REVISION,checks:{},states:{},shaderErrors:[]};
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=false;
renderer.debug.onShaderError=(gl,program,vertex,fragment)=>{const error=[gl.getProgramInfoLog(program),gl.getShaderInfoLog(vertex),gl.getShaderInfoLog(fragment)].join('\n');report.shaderErrors.push(error);console.error(error);};
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#050810');
const key=new THREE.DirectionalLight(0xffe0c5,3);key.position.set(-50,60,65);scene.add(key);
const rim=new THREE.DirectionalLight(0x749bdc,3.7);rim.position.set(50,20,-20);scene.add(rim);scene.add(new THREE.HemisphereLight(0xa9bacf,0x131624,1.1));
const camera=new THREE.PerspectiveCamera(44,1,.1,1000);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(1,1),.52,.45,1));composer.addPass(new OutputPass());
function inventory(object){let triangles=0,drawCalls=0;const materials=new Set();object.traverseVisible(o=>{if(!o.isMesh)return;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;drawCalls+=Array.isArray(o.material)?o.geometry.groups.length:1;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m.name));});return{triangles,drawCalls,materials:[...materials]};}
const requested=[];const realLoader=new GLTFLoader();const encounter=await createBossEncounter({decoyCount:0,loader:{loadAsync(url){requested.push(url);return realLoader.loadAsync(url);}}});const boss=encounter.boss;
report.checks.bossOnlyLoad=requested.length===1&&requested[0].endsWith('/boss.glb')&&encounter.decoys.length===0;
report.checks.initialState=boss.getObjectByName('armour_intact').visible&&!boss.getObjectByName('armour_cracked').visible&&!boss.getObjectByName('core').visible;
report.checks.names=true;report.checks.pbr=true;boss.traverse(o=>{if(o!==boss&&o.name&&!/^[a-z0-9_]+$/.test(o.name))report.checks.names=false;if(o.isMesh&&!o.material.isMeshStandardMaterial)report.checks.pbr=false;});
report.checks.socket=boss.getObjectByName('socket_core')?.position.length()===0;
const objects=ARMOUR_STATES.map((state,i)=>{const object=setArmourState(boss.clone(true),state);object.position.x=(i-1)*38;object.rotation.y=Math.PI;scene.add(object);return object;});
renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
report.checks.redSeams=true;
for(let i=0;i<3;i++){objects.forEach((o,j)=>o.visible=i===j);const object=objects[i];camera.position.copy(object.position).add(new THREE.Vector3(0,0,100));camera.lookAt(object.position);renderer.render(scene,camera);const stats=inventory(object);report.states[ARMOUR_STATES[i]]={...stats,renderedTriangles:renderer.info.render.triangles,renderedCalls:renderer.info.render.calls};let red=false;object.traverseVisible(o=>{const m=o.material;if(m?.name==='hostile_seams'&&m.emissive.r>.9&&m.emissive.g<.02&&m.emissiveIntensity>3)red=true;});report.checks.redSeams&&=red;}
report.checks.budget=Object.values(report.states).every(s=>s.triangles<=15000&&s.drawCalls<=4&&s.triangles===s.renderedTriangles&&s.drawCalls===s.renderedCalls);
const coreMaterial=object=>{let found;object.getObjectByName('core').traverse(o=>{if(o.material?.name==='core_light')found=o.material;});return found;};
const pulseA=setArmourState(boss.clone(true),'armour_broken'),pulseB=setArmourState(boss.clone(true),'armour_broken');const source=coreMaterial(boss);
updateBoss(pulseA,0);updateBoss(pulseB,0);const owned=coreMaterial(pulseA);report.checks.independentPulse=owned!==coreMaterial(pulseB)&&owned!==source;
let minEmission=Infinity,maxEmission=-Infinity,minScale=Infinity,maxScale=-Infinity;
for(let frame=0;frame<150;frame++){updateBoss(pulseA,1/60);const e=owned.emissiveIntensity,s=pulseA.getObjectByName('core').scale.x;minEmission=Math.min(e,minEmission);maxEmission=Math.max(e,maxEmission);minScale=Math.min(s,minScale);maxScale=Math.max(s,maxScale);}
report.pulse={hz:.8,samples:150,minEmission,maxEmission,minScale,maxScale};
report.checks.pulseRange=maxEmission-minEmission>2&&maxScale-minScale>.06&&Math.abs(coreMaterial(pulseB).emissiveIntensity-5.5*.85)<1e-6&&source.emissiveIntensity===5.5;
let disposed=0;owned.addEventListener('dispose',()=>disposed++);disposeBossPulse(pulseA);disposeBossPulse(pulseA);disposeBossPulse(pulseB);report.checks.pulseDisposal=disposed===1&&coreMaterial(pulseA)===source&&pulseA.getObjectByName('core').scale.x===1;
const liveClone=setArmourState(boss.clone(true),'armour_broken');updateBoss(liveClone,.3);const cloneOfLive=liveClone.clone(true);updateBoss(cloneOfLive,0);disposeBossPulse(liveClone);disposeBossPulse(cloneOfLive);report.checks.liveCloneRestoresSource=coreMaterial(cloneOfLive)===source&&cloneOfLive.getObjectByName('core').scale.x===1;
const released=await createBossEncounter({decoyCount:0});released.update(.1);const releasedCore=coreMaterial(released.boss);let releasedCount=0;releasedCore.addEventListener('dispose',()=>releasedCount++);released.dispose();released.update(.1);released.dispose();report.checks.encounterDisposal=releasedCount===1&&coreMaterial(released.boss)!==releasedCore;
const legacy=await createBossEncounter();report.checks.legacyFourDecoys=legacy.decoys.length===4&&legacy.decoys.every(d=>!d.getObjectByName('core'));
setArmourState(legacy.decoys[0],'armour_broken');report.checks.independentDecoyStates=legacy.decoys.slice(1).every(d=>d.getObjectByName('armour_intact').visible);setArmourState(legacy.decoys[0]);const decoy=legacy.decoys[0];report.legacyDecoy=inventory(decoy);decoy.rotation.y=Math.PI;scene.add(decoy);decoy.visible=false;
report.checks.decoyNoRed=true;decoy.traverse(o=>{if(o.material?.emissiveIntensity>1)report.checks.decoyNoRed=false;});
report.checks.noShadows=!renderer.shadowMap.enabled;report.checks.shaders=report.shaderErrors.length===0;
const labels=objects.map((o,i)=>{const el=document.createElement('div');el.className='label';const s=report.states[ARMOUR_STATES[i]];el.innerHTML=`${ARMOUR_STATES[i].slice(7).toUpperCase()}<small>${s.triangles.toLocaleString()} triangles · ${s.drawCalls} calls</small>`;document.querySelector('#labels').append(el);return el;});
let rotating=false,useBloom=true,view='gallery';
function resize(){renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;
if(view==='gallery'){camera.position.set(0,5,Math.max(120,150/camera.aspect));camera.lookAt(0,0,0);}else{const object=view==='decoy'?decoy:objects[view==='cracked'?1:['broken','close'].includes(view)?2:0];camera.position.copy(object.position).add(new THREE.Vector3(0,view==='close'?6:0,view==='close'?48:100));camera.lookAt(object.position);}camera.updateProjectionMatrix();}
function arrange(){objects.forEach((o,i)=>{o.visible=view==='gallery'||i===(view==='cracked'?1:['broken','close'].includes(view)?2:0)&&view!=='decoy';o.rotation.y=view==='rear'?0:Math.PI;});decoy.visible=view==='decoy';document.body.classList.toggle('single',view!=='gallery');document.querySelector('#subtitle').textContent=view==='gallery'?'Armour seams · mechanical housings · a pulsing reactor':view==='decoy'?'Preserved legacy decoy · unused in the one-boss v1':`${view==='rear'?'Intact rear':view==='close'?'Exposed reactor':view[0].toUpperCase()+view.slice(1)} · ${view==='close'?'48':'100'} m camera distance`;resize();}
document.querySelector('#view').onchange=e=>{view=e.target.value;arrange();};document.querySelector('#spin').onclick=e=>{rotating=!rotating;e.target.textContent=rotating?'Stop':'Rotate';};document.querySelector('#bloom').onclick=e=>{useBloom=!useBloom;e.target.textContent=useBloom?'Bloom on':'Bloom off';};addEventListener('resize',resize);arrange();
window.assetReport=report;console.log('ASSET_REPORT',JSON.stringify(report));
const passed=Object.values(report.checks).every(Boolean);document.querySelector('#status').textContent=`${passed?'PASS':'FAIL'} · r${THREE.REVISION} · ${Object.keys(report.checks).length} browser checks · zero textures · original CC0\nViewport review only; physical-phone performance unmeasured.`;
let last=performance.now();function frame(now){const dt=Math.max(0,Math.min((now-last)/1000,.1));last=now;objects.forEach(o=>{updateBoss(o,dt);if(rotating)o.rotation.y+=dt*.23;});if(useBloom)composer.render();else renderer.render(scene,camera);objects.forEach((o,i)=>{const p=o.position.clone().add(new THREE.Vector3(0,-20,0)).project(camera);labels[i].style.left=`${(p.x*.5+.5)*innerWidth}px`;labels[i].style.top=`${(-p.y*.5+.5)*innerHeight}px`;});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
