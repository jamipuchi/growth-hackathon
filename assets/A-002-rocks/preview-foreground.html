<header><div><div class="eyebrow">SPACE PARTY / A-002 FOREGROUND</div><h1>SPACE HAS<br>SOME BIG ROCKS.</h1><p id="caption">Three huge silhouettes. Broad facets and deep cuts.</p></div><div class="controls"><select id="view" aria-label="Rock review view"><option value="hero">Flight approach</option><option value="gallery">60 / 90 / 120 m gallery</option><option value="one">Shape 1 / close</option><option value="two">Shape 2 / close</option><option value="three">Shape 3 / close</option><option value="flyby">Fly past</option></select><select id="background" aria-label="Review background"><option value="space">Bright space</option><option value="plain">Plain studio</option></select><button id="play">Pause</button></div></header>

<script type="module">
import * as THREE from 'three';
import * as foregroundModule from './foreground.js';
import {runForegroundChecks} from './validate-foreground-browser.js';
import {createSpaceEnvironment} from '../A-011-space-env/environment.js';
import {createPlanet} from '../A-004-planet/planet.js';
import {createDefaultShip} from '../A-009-defaults/defaults.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);
const errors=[];renderer.debug.onShaderError=(gl,p,v,f)=>{const e=[gl.getProgramInfoLog(p),gl.getShaderInfoLog(v),gl.getShaderInfoLog(f)].join('\n');errors.push(e);console.error(e);};
const raw=await runForegroundChecks(THREE,foregroundModule,renderer);window.assetReport={...raw,three:THREE.REVISION,browser:navigator.userAgent,webgl2:renderer.capabilities.isWebGL2,viewport:{width:innerWidth,height:innerHeight,devicePixelRatio,renderPixelRatio:renderer.getPixelRatio()}};
const scene=new THREE.Scene();scene.background=new THREE.Color('#111728');const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.2,6000);
const heroRecords=[{id:'left',variant:1,diameter:120,position:[-105,-50,105],quaternion:new THREE.Quaternion().setFromEuler(new THREE.Euler(.2,.3,.13)).toArray()},{id:'right',variant:2,diameter:90,position:[108,-40,100],quaternion:new THREE.Quaternion().setFromEuler(new THREE.Euler(-.2,-.4,-.3)).toArray()},{id:'far',variant:3,diameter:60,position:[-95,40,-230]}];
const galleryRecords=[{id:'small',variant:1,diameter:60,position:[-125,0,0]},{id:'medium',variant:2,diameter:90,position:[0,0,0]},{id:'large',variant:3,diameter:120,position:[145,0,0]}];
const [hero,gallery,...rest]=await Promise.all([foregroundModule.createForegroundRocks({rocks:heroRecords,seed:73}),foregroundModule.createForegroundRocks({rocks:galleryRecords,seed:73}),createSpaceEnvironment({variant:'space',intensity:.8,lightingIntensity:.4,rotation:.7}),createPlanet({radius:165,seed:73,unlocked:false,sunDirection:[-.7,.8,.5]}),createDefaultShip()]);const [sky,planet,ship]=rest;
scene.add(hero.object3d,gallery.object3d,sky.object3d,planet.object3d,ship.object3d);planet.object3d.position.set(175,45,-930);planet.object3d.quaternion.setFromUnitVectors(planet.landingDirection,new THREE.Vector3(0,0,1));planet.update(0);
const key=new THREE.DirectionalLight(0xffe3b5,3.1);key.position.set(-300,400,250);scene.add(key);const rim=new THREE.DirectionalLight(0x87b5ff,1.5);rim.position.set(230,110,-300);scene.add(rim);scene.add(new THREE.HemisphereLight(0xc2d5ff,0x32213f,.8));
let view='hero',playing=true,time=0,last=performance.now(),plain=false;const active=()=>view==='hero'||view==='flyby'?hero:gallery;
function setCamera(){camera.aspect=innerWidth/innerHeight;camera.fov=52;const portrait=Math.max(1,.95/camera.aspect);if(view==='hero'){camera.position.set(0,12,300*portrait);camera.lookAt(0,0,-30);ship.object3d.position.set(0,camera.position.y-6,camera.position.z-42);}else if(view==='gallery'){camera.position.set(10,70,455*portrait);camera.lookAt(10,0,0);ship.object3d.position.set(0,-70,20);}else if(view==='flyby'){const z=340-(time%22)*28;camera.position.set(0,20+Math.sin(time*.3)*12,z*portrait);camera.lookAt(0,0,z-350);ship.object3d.position.set(0,camera.position.y-8,camera.position.z-35);}else{const i=['one','two','three'].indexOf(view),record=galleryRecords[i];camera.position.set(record.position[0]+record.diameter*.65,record.diameter*.38,record.diameter*1.55*portrait);camera.lookAt(record.position[0],0,0);ship.object3d.position.set(record.position[0],-record.diameter*.6,record.diameter*.25);}camera.updateProjectionMatrix();}
function show(v){view=v;document.querySelector('#view').value=v;hero.object3d.visible=v==='hero'||v==='flyby';gallery.object3d.visible=!hero.object3d.visible;planet.object3d.visible=!plain&&(v==='hero'||v==='flyby');sky.object3d.visible=!plain;document.querySelector('#caption').textContent=v==='gallery'?'Left to right: 60 m, 90 m, 120 m. The small ship is 3 m long.':v==='flyby'?'A pass between giant rocks, with the planet far beyond.':v==='hero'?'Three huge silhouettes. Broad facets and deep cuts.':'Close inspection of the exported low-poly silhouette.';setCamera();}
function draw(){renderer.render(scene,camera);const s=active().getStats();window.previewStats=s;document.querySelector('#counts').innerHTML=`Foreground rocks: ${s.triangles.toLocaleString()} triangles · ${s.calls} draw · 0 textures<br>Review scene: ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles`;}
function advance(dt){time+=dt;planet.update(dt);setCamera();}
document.querySelector('#view').onchange=e=>{time=0;show(e.target.value);draw();};document.querySelector('#background').onchange=e=>{plain=e.target.value==='plain';show(view);draw();};document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';};addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);setCamera();draw();});
document.querySelector('#checks').textContent=`${raw.checks.every(c=>c.pass)?'PASS':'FAIL'} · ${raw.checks.length} browser checks · three.js r160`;
window.reviewForeground={scene,camera,renderer,hero,gallery,ship,planet,sky,errors,show(v){playing=false;document.querySelector('#play').textContent='Play';show(v);draw();},advance,render:draw,play(v){playing=v;document.querySelector('#play').textContent=v?'Pause':'Play';},plain(v){plain=v;document.querySelector('#background').value=v?'plain':'space';show(view);draw();},hideUI(v=true){document.body.classList.toggle('minimal',v);}};
show('hero');draw();window.previewReady=true;function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(playing)advance(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
