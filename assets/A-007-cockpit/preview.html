<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Party — A-007 cockpit</title><link rel="icon" href="data:,">

<header><div><div class="eyebrow">SPACE PARTY / A-007</div><h1>TAKE THE<br>FRONT SEAT.</h1><p>A chunky flight deck with room to see where you're going.<br>Three empty gauge sockets. Values below are preview samples.</p></div><div class="controls"><select id="view" aria-label="Review view"><option value="space">Pilot view</option><option value="exterior">Inspect model</option><option value="mask">Window mask</option></select><button id="labels">Hide sample values</button><button id="play">Pause flight</button><label class="slider">FOV<input aria-label="Field of view" id="fov" type="range" min="50" max="90" value="70"><output id="fovvalue">70°</output></label></div></header>
<footer><div id="checks">Loading the cockpit and checking screen coverage…</div><div id="counts"></div></footer>
<script type="module">
import * as THREE from 'three';
import * as cockpitModule from './cockpit.js';
import {runCockpitChecks} from './validate-browser.js';
import {createSpaceEnvironment} from '../A-011-space-env/environment.js';
import {createPlanet} from '../A-004-planet/planet.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);
const errors=[];renderer.debug.onShaderError=(gl,p,v,f)=>{const error=[gl.getProgramInfoLog(p),gl.getShaderInfoLog(v),gl.getShaderInfoLog(f)].join('\n');errors.push(error);console.error(error);};
const raw=await runCockpitChecks(THREE,cockpitModule,renderer);window.assetReport={...raw,three:THREE.REVISION,browser:navigator.userAgent,viewport:{width:innerWidth,height:innerHeight,devicePixelRatio,renderPixelRatio:renderer.getPixelRatio()},webgl2:renderer.capabilities.isWebGL2};
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,5000);scene.add(camera);scene.background=new THREE.Color('#0c1530');
const [cockpit,sky,planet,manifest]=await Promise.all([cockpitModule.createCockpit({camera}),createSpaceEnvironment({variant:'space',intensity:.8,lightingIntensity:.5,rotation:1.6}),createPlanet({seed:73,radius:155,unlocked:true,sunDirection:[-.4,.75,.5]}),fetch('./geometry-manifest.json').then(r=>r.json())]);
scene.add(sky.object3d,planet.object3d);planet.object3d.position.set(50,25,-700);planet.object3d.quaternion.setFromUnitVectors(planet.landingDirection,new THREE.Vector3(0,0,1));planet.update(0);camera.add(cockpit.object3d);
const key=new THREE.DirectionalLight(0xffefd7,3.5);key.position.set(-3,6,4);scene.add(key);const rim=new THREE.DirectionalLight(0x96baff,1.8);rim.position.set(4,2,-3);scene.add(rim);const ambient=new THREE.HemisphereLight(0xc5ebff,0x172748,1.6);scene.add(ambient);
const gaugeDisplays=[],gaugePaint=[];
for(const [i,[label,value,color]] of [['SPEED','42','#72edff'],['HULL','100','#bcff80'],['BOOST','75','#ffe183']].entries()){
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;const ctx=canvas.getContext('2d');
 const map=new THREE.CanvasTexture(canvas);map.colorSpace=THREE.SRGBColorSpace;const material=new THREE.MeshBasicMaterial({map,toneMapped:false,depthTest:true,depthWrite:true});
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(.47054,.11343),material);mesh.position.z=.002;mesh.renderOrder=0;mesh.name=`preview_gauge_${i+1}`;cockpit.sockets[`socket_gauge_${i+1}`].add(mesh);gaugeDisplays.push(mesh);gaugePaint.push({canvas,ctx,map,material,label,value,color});
}
function paintGauges(){const ratio=(.47054/.11343)*(innerWidth/innerHeight)/(16/9);for(const g of gaugePaint){const height=Math.round(512/ratio);if(g.canvas.height!==height){g.map.dispose();g.canvas.height=height;g.map=new THREE.CanvasTexture(g.canvas);g.map.colorSpace=THREE.SRGBColorSpace;g.material.map=g.map;}g.ctx.fillStyle='#071623';g.ctx.fillRect(0,0,512,height);g.ctx.textAlign='center';g.ctx.textBaseline='middle';if(ratio<2){g.ctx.fillStyle=g.color;g.ctx.font=`900 ${height*.46}px Arial`;g.ctx.fillText(g.value,256,height*.42);g.ctx.fillStyle='#dcf3ff';g.ctx.font=`800 ${height*.19}px Arial`;g.ctx.fillText(g.label,256,height*.8);}else{g.ctx.fillStyle=g.color;g.ctx.font=`900 ${Math.min(70,height*.54)}px Arial`;g.ctx.fillText(g.value,355,height*.51);g.ctx.fillStyle='#dcf3ff';g.ctx.font=`800 ${Math.min(32,height*.26)}px Arial`;g.ctx.fillText(g.label,130,height*.51);}g.map.needsUpdate=true;}}paintGauges();
let view='space',playing=true,time=0,last=performance.now(),labels=true;const white=new THREE.MeshBasicMaterial({color:0xffffff});
function fit(){camera.aspect=innerWidth/innerHeight;camera.fov=Number(document.querySelector('#fov').value);camera.updateProjectionMatrix();if(view==='exterior'){cockpit.object3d.scale.setScalar(1);camera.position.set(3.7,2.2,3.6);camera.lookAt(0,-.1,-1.5);}else{camera.position.set(0,0,0);camera.rotation.set(0,0,0);cockpit.fitToCamera(camera);const roll=playing?Math.sin(time*.25)*.025:0;camera.rotation.z=roll;camera.rotation.y=playing?Math.sin(time*.18)*.055:0;}camera.updateMatrixWorld(true);}
function show(next){view=next;document.querySelector('#view').value=next;scene.overrideMaterial=next==='mask'?white:null;scene.background.set(next==='mask'?'#000000':'#0c1530');sky.object3d.visible=planet.object3d.visible=next==='space';gaugeDisplays.forEach(mesh=>mesh.visible=labels&&next!=='mask');if(next==='exterior'){scene.add(cockpit.object3d);}else{camera.add(cockpit.object3d);cockpit.object3d.position.set(0,0,0);cockpit.object3d.rotation.set(0,0,0);}fit();}
function draw(){renderer.render(scene,camera);const stats=cockpit.getStats();document.querySelector('#counts').innerHTML=`Cockpit: ${stats.triangles.toLocaleString()} triangles · ${stats.calls} draws · 0 textures<br>Review scene: ${renderer.info.render.calls} draws · sample gauges add 3`;}
function advance(dt){time+=dt;planet.update(dt);fit();}
document.querySelector('#view').onchange=e=>{show(e.target.value);draw();};document.querySelector('#fov').oninput=e=>{document.querySelector('#fovvalue').textContent=`${e.target.value}°`;fit();draw();};document.querySelector('#labels').onclick=e=>{labels=!labels;e.target.textContent=labels?'Hide sample values':'Show sample values';gaugeDisplays.forEach(mesh=>mesh.visible=labels&&view!=='mask');draw();};document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause flight':'Resume flight';fit();draw();};addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);paintGauges();fit();draw();});
const passed=raw.checks.every(check=>check.pass);document.querySelector('#checks').innerHTML=`${passed?'PASS':'FAIL'} · ${raw.checks.length} browser checks<br>Physical-phone performance unmeasured`;
window.reviewCockpit={scene,camera,renderer,cockpit,manifest,gaugeDisplays,errors,show(v){playing=false;show(v);draw();},render:draw,advance,play(v){playing=v;document.querySelector('#play').textContent=v?'Pause flight':'Resume flight';fit();draw();},fov(v){document.querySelector('#fov').value=v;document.querySelector('#fovvalue').textContent=`${v}°`;fit();draw();},labels(v){labels=v;gaugeDisplays.forEach(mesh=>mesh.visible=v&&view!=='mask');draw();},hideUI(v=true){document.body.classList.toggle('minimal',v);}};
show('space');draw();window.previewReady=true;
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(playing)advance(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
