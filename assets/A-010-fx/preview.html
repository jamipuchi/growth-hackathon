<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-010 · Space Party effects</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#030811;color:#e9f3f7;font:14px/1.4 system-ui,sans-serif;overflow:hidden}canvas{display:block}header{position:absolute;top:24px;left:30px;right:30px;display:flex;justify-content:space-between;gap:24px;z-index:2;pointer-events:none}.eyebrow{font:10px monospace;letter-spacing:2.5px;color:#6ce3ed}h1{font-size:29px;font-weight:500;letter-spacing:-.9px;margin:7px 0}p{font-size:12px;color:#8496a9;margin:0}.controls{display:flex;align-items:start;gap:7px;flex-wrap:wrap;max-width:620px;pointer-events:auto}button,select{background:#101b2a;border:1px solid #2a3c52;border-radius:5px;color:inherit;padding:8px 10px;font:12px system-ui;cursor:pointer}button:hover,select:hover{border-color:#65bfd1}.label{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none;white-space:nowrap;font:11px monospace;letter-spacing:1px;color:#dbeef5}.label small{display:block;font-size:9px;letter-spacing:0;color:#758a9f;margin-top:5px}.single .label{display:none}footer{position:absolute;bottom:17px;left:30px;right:30px;display:flex;justify-content:space-between;gap:24px;font:10px/1.6 monospace;color:#8294a7}#scrub{position:absolute;bottom:67px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font:10px monospace;color:#92b7c4;background:#07101ddd;padding:8px 14px;border-radius:30px}input{accent-color:#6be3ed;width:180px}@media(max-width:650px){header{top:15px;left:17px;right:17px;display:block}h1{font-size:24px}.controls{margin-top:14px;gap:5px}button,select{font-size:11px;padding:7px 8px}footer{left:17px;right:17px;font-size:9px;display:block}#counts{display:none}#scrub{bottom:91px}input{width:140px}.label{font-size:9px}.label small{font-size:8px}}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<header><div><div class="eyebrow">SPACE PARTY / ASSET A-010</div><h1>Make every hit count.</h1><p id="subtitle">Twelve moments · bounded pools · bloom-ready light</p></div><div class="controls"><select id="view" aria-label="Effect view"><option value="gallery">All effects</option></select><button id="play">Pause</button><button id="replay">Replay</button><button id="bloom">Bloom on</button></div></header>
<div id="labels"></div><div id="scrub"><span>AGE</span><input aria-label="Effect age" id="age" type="range" min="0" max="2.5" step=".01" value=".28"><output id="age-value">0.28 s</output></div><footer><div id="status">Compiling effects and checking pools…</div><div id="counts"></div></footer>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as fx from './fx.js';
import { runFxChecks } from './validate-browser.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=false;renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const shaderErrors=[];renderer.debug.onShaderError=(gl,p,v,f)=>{const error=[gl.getProgramInfoLog(p),gl.getShaderInfoLog(v),gl.getShaderInfoLog(f)].join('\n');shaderErrors.push(error);console.error(error);};
const rawReport=await runFxChecks(THREE,fx,renderer);const report={...rawReport,checkDetails:rawReport.checks,checks:Object.fromEntries(rawReport.checks.map(c=>[c.name,c.pass]))};report.shaderErrors=[...(rawReport.measurements?.shaderErrors??[]),...shaderErrors];report.checks.shaders=report.shaderErrors.length===0;report.three=THREE.REVISION;report.browser=navigator.userAgent;window.assetReport=report;console.log('FX_REPORT',JSON.stringify(report));
const scene=new THREE.Scene();scene.background=new THREE.Color('#030811');const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,1500);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(1,1),.65,.55,.82));composer.addPass(new OutputPass());
const items=[['laser','LASER BOLT','Forward streak',1,14],['explosion','EXPLOSION / S','Impact flash',1,7],['explosion','EXPLOSION / M','Hull break',2,13],['explosion','EXPLOSION / L','Boss finish',4,25],['drill','DRILL SPARKS','Directional spray',1,5],['flare','FLARE','Burst + real light',1,9],['scan','SCAN PING','Expanding signal',1,9],['shield','SHIELD BUBBLE','Cyan hex field',1,4],['boost','BOOST TRAIL','Following an emitter',1,8],['landing','LANDING DUST','Low ground plume',1,5],['dig','DIG DIRT','Ballistic fragments',1,5],['gold','CHEST GOLD','Upward glitter',1,5]].map((d,i)=>({kind:d[0],title:d[1],caption:d[2],size:d[3],extent:d[4],id:String(i),position:new THREE.Vector3(),handle:null}));
const select=document.querySelector('#view');for(const item of items){const option=document.createElement('option');option.value=item.id;option.textContent=item.title;select.append(option);const label=document.createElement('div');label.className='label';label.innerHTML=`${item.title}<small>${item.caption}</small>`;document.querySelector('#labels').append(label);item.label=label;}
let system,view='gallery',playing=true,bloom=true,elapsed=0,last=performance.now();
const ground=new THREE.Mesh(new THREE.CircleGeometry(6,64),new THREE.MeshStandardMaterial({color:0x253747,roughness:1,metalness:.1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.visible=false;scene.add(ground);
scene.add(new THREE.HemisphereLight(0xa7c9ea,0x192328,1.3));const light=new THREE.DirectionalLight(0xdbefff,2);light.position.set(-6,9,10);scene.add(light);
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,0),new THREE.MeshStandardMaterial({color:0x364860,roughness:.65,metalness:.5}));core.visible=false;scene.add(core);
function arrangement(){const cols=innerWidth<650?2:4,rows=Math.ceil(items.length/cols);items.forEach((item,i)=>{item.position.set((i%cols-(cols-1)/2)*33,((rows-1)/2-Math.floor(i/cols))*28,0);});if(view!=='gallery')items[Number(view)].position.set(0,0,0);}
function reset(age=0){if(system)system.clear();else system=fx.createFxSystem({scene,seed:410, maxParticles:1536,maxRings:32,maxShields:8,maxEmitters:16,maxLights:1});arrangement();elapsed=0;for(const item of items){item.handle=null;if(view!=='gallery'&&item.id!==view)continue;const direction=item.kind==='laser'?new THREE.Vector3(.9,.15,-.6):item.kind==='boost'?new THREE.Vector3(1,0,0):new THREE.Vector3(.1,1,0);const options={size:item.size,seed:410+Number(item.id),direction};if(item.kind==='shield'||item.kind==='boost')options.duration=2.5;if(item.kind==='scan')options.normal=new THREE.Vector3(0,0,1);const p=item.position.clone();if(item.kind==='laser')p.x-=4;if(item.kind==='shield')p.y+=.7;item.handle=system.spawn(item.kind,p,options);}while(elapsed<age){advance(Math.min(1/60,age-elapsed));}setCamera();updateCounters();}
function advance(dt){elapsed+=dt;const boost=items[8];if(boost.handle){const p=boost.position.clone();p.x+=Math.sin(elapsed*1.35)*3;p.y+=Math.sin(elapsed*2)*.6;boost.handle.setPosition(p);boost.handle.setDirection(new THREE.Vector3(4.05*Math.cos(elapsed*1.35),1.2*Math.cos(elapsed*2),0));}system.update(dt);document.querySelector('#age').value=String(Math.min(elapsed,2.5));document.querySelector('#age-value').textContent=`${elapsed.toFixed(2)} s`;}
function setCamera(){camera.aspect=innerWidth/innerHeight;if(view==='gallery'){const cols=innerWidth<650?2:4,rows=Math.ceil(items.length/cols),halfW=cols*33*.5,halfH=rows*28*.5+6;const distance=Math.max(halfH,halfW/camera.aspect)/Math.tan(THREE.MathUtils.degToRad(22));camera.position.set(0,0,distance);camera.lookAt(0,0,0);}else{const item=items[Number(view)],r=item.extent;const distance=Math.max(r,r/camera.aspect)*1.45/Math.tan(THREE.MathUtils.degToRad(22));camera.position.set(distance*.22,distance*.22,distance);camera.lookAt(0,r*.06,0);}camera.updateProjectionMatrix();ground.visible=view!=='gallery'&&['landing','dig','gold','flare'].includes(items[Number(view)]?.kind);core.visible=view!=='gallery'&&items[Number(view)]?.kind==='shield';core.position.set(0,.7,0);document.body.classList.toggle('single',view!=='gallery');}
function updateCounters(){const stats=system.getStats();document.querySelector('#counts').textContent=`${stats.activeParticles} particles · ${stats.activeRings} rings · ${stats.activeShields} shields · ${stats.activeLights} light\n${stats.meshDrawCalls} effect mesh calls · ${stats.submittedTriangles} submitted triangles`;window.previewStats=stats;}
function choose(value,age=.3){view=value;select.value=value;document.querySelector('#subtitle').textContent=value==='gallery'?'Twelve moments · bounded pools · bloom-ready light':items[Number(value)].caption;reset(age);}
select.onchange=e=>choose(e.target.value);document.querySelector('#replay').onclick=()=>reset();document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';last=performance.now();};document.querySelector('#bloom').onclick=e=>{bloom=!bloom;e.target.textContent=bloom?'Bloom on':'Bloom off';};document.querySelector('#age').oninput=e=>{playing=false;document.querySelector('#play').textContent='Play';reset(Number(e.target.value));};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);choose(view,Math.min(elapsed,2.5));});
const pass=Object.values(report.checks).every(Boolean);document.querySelector('#status').textContent=`${pass?'PASS':'FAIL'} · r160 · ${Object.keys(report.checks).length} browser checks · no textures\nDesktop / emulated browser evidence; physical-phone cost unmeasured.`;
window.reviewFx={show(value,age=.3){playing=false;document.querySelector('#play').textContent='Play';choose(String(value),age);},get system(){return system;},get scene(){return scene;},get renderer(){return renderer;}};
reset(.3);let frameNo=0;function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(playing){if(elapsed>2.75)reset();else advance(dt);}if(bloom)composer.render();else renderer.render(scene,camera);for(const item of items){const p=item.position.clone().add(new THREE.Vector3(0,-10,0)).project(camera);item.label.style.left=`${(p.x*.5+.5)*innerWidth}px`;item.label.style.top=`${(-p.y*.5+.5)*innerHeight}px`;}if(frameNo++%15===0)updateCounters();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
