<header><div><div class="eyebrow">SPACE PARTY / A-003</div><h1>A LITTLE<br>COSMIC CHAOS.</h1><p id="caption">Violet clouds frame the fight. The centre stays clear.</p></div><div class="controls"><select id="view" aria-label="Camera view"><option value="overview">Full volume</option><option value="approach">Boss / 100 m</option><option value="inside">Inside the cloud</option><option value="crossing">Fly through</option><option value="isolated">Isolated volume</option></select><select id="quality" aria-label="Cloud quality"><option value="low">LOW / 24 PUFFS</option><option value="medium" selected>MEDIUM / 48 PUFFS</option><option value="high">HIGH / 80 PUFFS</option></select><button id="flare">Fire flare</button><button id="play">Pause</button><select id="background" aria-label="Space background"><option value="dim">Dim space</option><option value="bright">Bright space</option><option value="none">Plain background</option></select><label class="slider">OPACITY<input id="opacity" aria-label="Cloud opacity" type="range" min="0" max=".65" step=".01" value=".22"><output id="opacity-value">.22</output></label><label class="slider">FLARE AGE<input id="age" aria-label="Flare age" type="range" min="0" max="16" step=".1" value="0"><output id="age-value">—</output></label></div></header>

<script type="module">

import * as nebulaModule from './nebula.js';
import {runNebulaChecks} from './validate-browser.js';
import {createSpaceEnvironment} from '../A-011-space-env/environment.js';

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);
const errors=[];renderer.debug.onShaderError=(gl,p,v,f)=>{const error=[gl.getProgramInfoLog(p),gl.getShaderInfoLog(v),gl.getShaderInfoLog(f)].join('\n');errors.push(error);console.error(error);};

const scene=new THREE.Scene();scene.background=new THREE.Color('#05081d');const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,5000);

function rebuild(){cloud?.dispose();cloud=nebulaModule.createNebula({seed:303,radius:250,quality,opacity});scene.add(cloud.object3d);time=0;flareAge=Infinity;}
function setCamera(){camera.up.set(0,1,0);camera.fov=52;camera.aspect=innerWidth/innerHeight;const aspectScale=Math.max(1,.95/camera.aspect);if(view==='overview'||view==='isolated')camera.position.set(420*aspectScale,140*aspectScale,550*aspectScale);else if(view==='approach')camera.position.set(0,10,100);else if(view==='inside')camera.position.set(165,28,15);else camera.position.set(130,28,350*Math.cos(time*.12));camera.lookAt(0,0,0);camera.updateProjectionMatrix();}
function show(next){view=next;document.querySelector('#view').value=next;props.visible=next!=='isolated';sky.sky.visible=next!=='isolated'&&background!=='none';document.querySelector('#caption').textContent=next==='approach'?'Boss at 100 m. No darkness or visibility restriction.':next==='inside'?'Soft nearby puffs fade as the camera passes.':next==='crossing'?'A continuous pass through the cloud; no gameplay gates.':next==='isolated'?'Cloud geometry and colour against a plain background.':'Violet clouds frame the fight. The centre stays clear.';setCamera();}

function advance(dt){time+=dt;flareAge+=dt;setCamera();cloud.update(dt,camera);encounter.update(dt);document.querySelector('#age').value=String(Math.min(flareAge,16));document.querySelector('#age-value').textContent=flareAge<=14?`${flareAge.toFixed(1)} s`:'—';}

document.querySelector('#view').onchange=e=>show(e.target.value);document.querySelector('#quality').onchange=e=>{quality=e.target.value;rebuild();advance(0);};document.querySelector('#opacity').oninput=e=>{opacity=Number(e.target.value);cloud.setOpacity(opacity);document.querySelector('#opacity-value').textContent=opacity.toFixed(2);};document.querySelector('#flare').onclick=()=>flare();document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';};document.querySelector('#age').oninput=e=>{playing=false;document.querySelector('#play').textContent='Play';flare(Number(e.target.value));};document.querySelector('#background').onchange=async e=>{background=e.target.value;await sky.setVariant(background==='bright'?'space':'nebula');sky.setIntensity(background==='bright'?.7:.45);show(view);};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);setCamera();});rebuild();show('overview');advance(0);
document.querySelector('#checkstate').textContent=`${Object.values(report.checks).every(Boolean)?'PASS':'FAIL'} · ${raw.checks.length} browser checks · three.js r160`;document.querySelector('#note').textContent='Decorative only · no fog or gameplay gate · physical-phone performance unmeasured';
window.reviewNebula={show(v){playing=false;document.querySelector('#play').textContent='Play';show(v);advance(0);draw();},flare,quality(v){quality=v;document.querySelector('#quality').value=v;rebuild();advance(0);draw();},advance,render:draw,get cloud(){return cloud;},scene,camera,renderer,errors,sky,hideUI(v=true){document.body.classList.toggle('minimal',v);}};window.previewReady=true;
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(playing)advance(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
