<header><div><small>SPACE PARTY / ASSET A-006</small><h1>A little X-marks-the-spot.</h1><p>Teak, worn brass, and a warm gold reveal.</p></div><div class="controls"><select id="view" aria-label="Review view"><option value="gallery">All states</option><option value="closed">Closed chest</option><option value="open">Open chest</option><option value="buried">Buried glint</option><option value="decal">Dig hole</option></select><button id="replay">Open · 1 sec</button><button id="rear">Rear view</button><button id="bloom">Bloom: on</button></div></header>
<div id="labels"><span>CLOSED</span><span>GOLD REVEAL</span><span>BURIED</span></div><footer id="status">Loading exported GLBs…</footer>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {createChest,createDigHole} from './chest.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#193c42');scene.fog=new THREE.Fog('#193c42',17,45);
const camera=new THREE.PerspectiveCamera(37,1,.05,100);
scene.add(new THREE.HemisphereLight(0xc9e3df,0x755439,2.4));
const sun=new THREE.DirectionalLight(0xffd098,4);sun.position.set(-5,8,-4);scene.add(sun);
const rim=new THREE.DirectionalLight(0x9adddc,2);rim.position.set(5,4,5);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0xbda573,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.018;scene.add(ground);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),.45,.35,1.08);composer.addPass(bloom);composer.addPass(new OutputPass());
const [closed,opened,buried,hole]=await Promise.all([createChest(),createChest({state:'open'}),createChest({state:'buried'}),createDigHole()]);
const assets=[closed,opened,buried];assets.forEach(a=>scene.add(a.object3d));scene.add(hole.object3d);
const report={three:THREE.REVISION,checks:{},costs:{},samples:[]};
function cost(root){let calls=0,triangles=0;root.traverseVisible(o=>{if(o.isMesh){calls++;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});return {calls,triangles};}
report.costs.chest=cost(closed.object3d);report.costs.buried=cost(buried.object3d);report.costs.decal=cost(hole.object3d);
report.checks.budgets=report.costs.chest.calls===2&&report.costs.chest.triangles<=3000&&report.costs.buried.calls===1;
report.checks.duration=closed.clips.length===1&&closed.clips[0].name==='open'&&Math.abs(closed.clips[0].duration-1)<1e-5;
report.checks.rotationOnly=closed.clips[0].tracks.length===1&&closed.clips[0].tracks[0].name==='chest_lid.quaternion';
report.checks.sockets=Object.values(closed.sockets).every(Boolean);
report.checks.initialState=closed.state==='closed'&&opened.state==='open'&&buried.state==='buried'&&closed.chest.visible&&!closed.buried.visible&&!buried.chest.visible&&buried.buried.visible;
const test=await createChest();const lid=test.chest.getObjectByName('chest_lid');
test.open();test.update(.35);const t=test.mixer.existingAction(test.clips[0]).time;test.open();report.checks.repeatDoesNotRestart=test.mixer.existingAction(test.clips[0]).time===t;
test.setState('closed');test.open();
for(let i=0;i<=30;i++){if(i)test.update(1/30);test.object3d.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(test.chest);report.samples.push({time:i/30,quaternion:lid.quaternion.toArray(),bounds:box.getSize(new THREE.Vector3()).toArray()});}
test.update(.001);report.checks.finishesOpen=test.state==='open';
report.checks.finalAngle=Math.abs(THREE.MathUtils.radToDeg(lid.rotation.x)-100)<.01;
report.checks.finiteSamples=report.samples.every(s=>s.quaternion.every(Number.isFinite)&&s.bounds.every(v=>Number.isFinite(v)&&v>0&&v<2.5));
test.open({restart:true});test.update(.2);report.checks.replay=test.state==='opening'&&test.mixer.existingAction(test.clips[0]).time<.21;
const mats=a=>{const s=new Set();a.object3d.traverse(o=>{if(o.isMesh)s.add(o.material)});return [...s];};
test.setGlow(.4);report.checks.independentMaterials=mats(closed).every(m=>m.emissiveIntensity>2)&&mats(test).every(m=>m.emissiveIntensity===.4);
report.checks.standardAndEmbeddedMaps=mats(closed).every(m=>m.isMeshStandardMaterial&&m.emissiveMap.image.width===128&&m.roughnessMap.image.width===128&&m.metalnessMap===m.roughnessMap);
report.checks.decal=hole.object3d.material.transparent&&!hole.object3d.material.depthWrite&&hole.object3d.material.map.image.width===512;
test.setState('buried');report.checks.buriedReset=test.state==='buried'&&test.buried.visible&&!test.chest.visible&&lid.quaternion.angleTo(new THREE.Quaternion())<1e-5;
const probe=new THREE.Scene(),probeCamera=new THREE.PerspectiveCamera(40,1,.05,20);probeCamera.position.set(2,2,-5);probeCamera.lookAt(0,.7,0);probe.add(test.object3d);report.rendererCosts={};
for(const state of ['closed','open','buried']){test.setState(state);renderer.render(probe,probeCamera);report.rendererCosts[state]={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};}
report.checks.rendererBudgets=report.rendererCosts.closed.calls===2&&report.rendererCosts.closed.triangles===2964&&report.rendererCosts.open.calls===2&&report.rendererCosts.open.triangles===2964&&report.rendererCosts.buried.calls===1&&report.rendererCosts.buried.triangles===252;
test.dispose();test.dispose();probe.remove(test.object3d);probe.add(closed.object3d);renderer.render(probe,probeCamera);report.checks.sharedResourcesSurviveDispose=renderer.info.render.calls===2;scene.add(closed.object3d);
let mode='gallery',rear=false,last=null;
function arrange(){
 assets.forEach((a,i)=>{a.object3d.visible=mode==='gallery'||mode===['closed','open','buried'][i];a.object3d.position.set(mode==='gallery'?(1-i)*2.7:0,0,0);});
 hole.object3d.visible=mode==='decal'||mode==='open';document.querySelector('#labels').style.visibility=mode==='gallery'?'visible':'hidden';resize();
}
function resize(){renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;
 const distance=mode==='gallery'?Math.max(8.5,11/camera.aspect):Math.max(3.7,(mode==='buried'||mode==='decal'?4.5:3.0)/camera.aspect);
 camera.position.set(mode==='gallery'?1.5:2.1,mode==='gallery'?4.2:2.65,(rear?1:-1)*distance);camera.lookAt(0,mode==='gallery'?.45:.62,0);camera.updateProjectionMatrix();}
document.querySelector('#view').onchange=e=>{mode=e.target.value;arrange();};
document.querySelector('#replay').onclick=()=>{if(mode==='closed'){closed.open({restart:true});}else {mode='open';document.querySelector('#view').value=mode;opened.open({restart:true});arrange();}};
document.querySelector('#rear').onclick=()=>{rear=!rear;resize();};
document.querySelector('#bloom').onclick=e=>{bloom.enabled=!bloom.enabled;e.target.textContent='Bloom: '+(bloom.enabled?'on':'off');};
window.assetReport=report;addEventListener('resize',resize);arrange();
function frame(now){const dt=last===null?0:Math.max(0,Math.min(.1,(now-last)/1000));last=now;assets.forEach(a=>a.update(dt));composer.render();document.querySelector('#status').textContent=`${Object.values(report.checks).every(Boolean)?'PASS':'FAIL'} · r160 · chest ${report.costs.chest.triangles} tris / 2 calls · mound 252 / 1 · decal 2 / 1 · CC0`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
