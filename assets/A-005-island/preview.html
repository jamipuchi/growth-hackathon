<header><div><small>SPACE PARTY / ASSET A-005</small><h1>Your landing spot in the sun.</h1><p>840 metres across · full-size palms · turquoise shallows</p></div><div class="controls"><select id="view" aria-label="Review view"><option value="approach">Landing approach</option><option value="beach">On the beach</option><option value="interior">Island interior</option><option value="palms">Palm variants + LOD</option><option value="props">Bushes, rocks + cliffs</option></select><select id="lod" aria-label="Palm detail"><option value="auto">Automatic LOD</option><option value="low">Low detail</option><option value="high">High detail / budget cap</option></select><button id="orbit">Orbit: off</button></div></header>

<script type="module">
import * as THREE from 'three';

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);

const shaderErrors=[];renderer.debug.onShaderError=(gl,program,vertex,fragment)=>{const message=gl.getProgramInfoLog(program)+' '+gl.getShaderInfoLog(fragment)+' '+gl.getShaderInfoLog(vertex);shaderErrors.push(message);console.error(message);};
const seed=73,islandSize=840,horizontalScale=2,heightAt=createScaledHeightAt((x,z)=>Terrain.height(x,z,seed),horizontalScale),start=performance.now();

const report={three:THREE.REVISION,checks:{},creationMs:performance.now()-start,seed,islandSize,horizontalScale};report.checks.scale=heightAt(200,-120)===Terrain.height(100,-60,seed)&&island.terrain.geometry.boundingBox.max.x===420;
report.initial=island.getStats();report.checks.budget=report.initial.triangles<=150000&&report.initial.calls<=60;
report.checks.noShadows=!renderer.shadowMap.enabled&&!island.sunlight.castShadow;report.checks.waterSky=island.water.isWater&&island.sky.isSky;
const pos=island.terrain.geometry.attributes.position;let maxVertexError=0;
for(let i=0;i<pos.count;i++)maxVertexError=Math.max(maxVertexError,Math.abs(pos.getY(i)-heightAt(pos.getX(i),pos.getZ(i))));report.maxVertexHeightError=maxVertexError;report.checks.heightSamplesMatch=maxVertexError<1e-5;
report.checks.clearings=island.placements.every(p=>Math.hypot(p.position[0],p.position[2])>=14+(p.kind==='palm'?3.6:p.kind==='bush'?1.68:p.kind==='beach_rock'?1.92:5.4)-1e-5);
report.checks.placementHeight=island.placements.every(p=>Math.abs(p.position[1]-heightAt(p.position[0],p.position[2])+(p.kind==='cliff'?p.scale*.9:.045))<1e-5);
const duplicate=await createIsland({seed,heightAt,size:islandSize,clearings:[{x:0,z:0,radius:14}]});report.checks.deterministic=JSON.stringify(island.placements)===JSON.stringify(duplicate.placements);let disposedInstances=0,disposedSharedGeometry=0;const ownedInstanceCount=[...duplicate.batches.values()].length+1;duplicate.object3d.traverse(o=>{if(o.isInstancedMesh)o.addEventListener('dispose',()=>disposedInstances++);});const firstShared=duplicate.batches.get('palm_1').geometry;const sharedListener=()=>disposedSharedGeometry++;firstShared.addEventListener('dispose',sharedListener);duplicate.dispose();duplicate.dispose();firstShared.removeEventListener('dispose',sharedListener);report.checks.disposal=disposedInstances===ownedInstanceCount&&disposedSharedGeometry===0;
const props=await loadIslandProps();report.props={};props.scene.traverse(o=>{if(o.isMesh)report.props[o.name]={triangles:o.geometry.index.count/3,calls:1};});
report.checks.palmBudgets=[1,2,3].every(i=>report.props['palm_'+i].triangles<=1500&&report.props['palm_'+i+'_lod'].triangles<report.props['palm_'+i].triangles);
camera.position.set(580,300,-640);camera.lookAt(0,5,0);camera.updateMatrixWorld(true);island.update(0,camera);
const originalRender=renderer.render.bind(renderer);let renderInvocations=0;renderer.render=(...args)=>{renderInvocations++;return originalRender(...args);};
renderer.render(scene,camera);report.renderInvocations=renderInvocations;report.actualRenderer={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};renderer.render=originalRender;report.checks.noReflectionRender=renderInvocations===1;report.checks.actualBudget=report.actualRenderer.triangles<=150000&&report.actualRenderer.calls<=60;report.shaderErrors=shaderErrors;report.checks.shaders=shaderErrors.length===0&&renderer.getContext().getError()===0;
island.setLodMode('high',camera);report.high=island.getStats();renderer.render(scene,camera);report.highRenderer={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};report.checks.highBudgetCap=report.high.triangles<=150000&&report.highRenderer.triangles===report.high.triangles&&report.highRenderer.calls===report.high.calls;island.setLodMode('low',camera);report.low=island.getStats();report.checks.lodSwitch=report.high.triangles>report.low.triangles;island.setLodMode('auto',camera);
// Quantify visual interpolation differences against the authoritative height function.
const ray=new THREE.Raycaster(),origin=new THREE.Vector3(),down=new THREE.Vector3(0,-1,0);let maxInterpolationError=0,sumError=0,samples=0;
island.object3d.updateMatrixWorld(true);
for(let x=-195;x<200;x+=13)for(let z=-195;z<200;z+=13){origin.set((x+.37)*horizontalScale,90,(z+.19)*horizontalScale);ray.set(origin,down);const hit=ray.intersectObject(island.terrain)[0];if(hit){const error=Math.abs(hit.point.y-heightAt(origin.x,origin.z));maxInterpolationError=Math.max(maxInterpolationError,error);sumError+=error;samples++;}}
report.heightInterpolation={samples,maxError:maxInterpolationError,meanError:sumError/samples};report.checks.finiteTerrain=Number.isFinite(maxInterpolationError)&&maxInterpolationError<2;
// Choose a real beach palm for the eye-level view, using the supplied heightmap.
const beach=island.placements.filter(p=>p.kind==='palm'&&p.position[1]<4).sort((a,b)=>a.position[2]-b.position[2])[0]??island.placements[0];
let inland={x:0,z:0,y:-Infinity,angle:0};
for(let x=-200;x<=200;x+=10)for(let z=-200;z<=200;z+=10){const y=heightAt(x,z);if(y>inland.y&&island.placements.every(p=>Math.hypot(x-p.position[0],z-p.position[2])>4*p.scale))inland={x,y,z,angle:0};}
let bestDownhill=Infinity;for(let i=0;i<24;i++){const a=i*Math.PI/12,y=heightAt(inland.x+Math.sin(a)*35,inland.z+Math.cos(a)*35);if(y<bestDownhill){bestDownhill=y;inland.angle=a;}}
const catalog=new THREE.Group();scene.add(catalog);const catalogItems=[];
const catalogFloor=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0xe2d7ab,roughness:1}));catalogFloor.rotation.x=-Math.PI/2;catalogFloor.position.y=-.05;catalog.add(catalogFloor);
const catalogSun=new THREE.DirectionalLight(0xffe4bf,3);catalogSun.position.set(-10,30,-10);catalog.add(catalogSun,new THREE.HemisphereLight(0xcce5ee,0x82704e,2));
let mode='approach',orbit=false,last=null,angle=0;
function showCatalog(names){catalogItems.forEach(o=>catalog.remove(o));catalogItems.length=0;names.forEach((name,i)=>{const o=props.scene.getObjectByName(name).clone();o.position.set((i%3-1)*14,0,(Math.floor(i/3)-(names.length>6?1:.5))*16);catalog.add(o);catalogItems.push(o);});document.querySelector('#labels').innerHTML=names.map(n=>`<div>${n.replaceAll('_',' ').toUpperCase()}</div>`).join('');}
function arrange(){const isCatalog=mode==='palms'||mode==='props';island.object3d.visible=!isCatalog;catalog.visible=isCatalog;document.querySelector('#labels').style.display=isCatalog?'block':'none';scene.background=isCatalog?new THREE.Color(0xb2d3d1):null;if(mode==='palms')showCatalog(['palm_1','palm_2','palm_3','palm_1_lod','palm_2_lod','palm_3_lod']);if(mode==='props')showCatalog(['bush_1','bush_2','beach_rock_1','beach_rock_2','beach_rock_3','cliff_1','cliff_2']);resize();}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;
 if(mode==='approach'){const d=Math.max(1,.85/camera.aspect);camera.position.set(500*d,360*d,-560*d);camera.lookAt(0,7,0);}
 else if(mode==='interior'){camera.position.set(inland.x,inland.y+1.8,inland.z);camera.lookAt(inland.x+Math.sin(inland.angle)*60,inland.y-5,inland.z+Math.cos(inland.angle)*60);}
 else if(mode==='beach'){const p=beach.position;let x=p[0]+9,z=p[2]-14;camera.position.set(x,Math.max(1.8,heightAt(x,z)+1.8),z);camera.lookAt(p[0]-10,p[1]+3.2,p[2]+22);}
 else{camera.position.set(0,mode==='props'?42:24,Math.max(mode==='props'?60:52,52/camera.aspect));camera.lookAt(0,3,0);}
 camera.near=mode==='approach'?2:.1;camera.updateProjectionMatrix();island.update(.3,camera);}
document.querySelector('#view').onchange=e=>{mode=e.target.value;arrange();};document.querySelector('#lod').onchange=e=>island.setLodMode(e.target.value,camera);document.querySelector('#orbit').onclick=e=>{orbit=!orbit;e.target.textContent='Orbit: '+(orbit?'on':'off');};
window.assetReport=report;addEventListener('resize',resize);arrange();
function frame(now){const dt=last===null?0:Math.min(.1,Math.max(0,(now-last)/1000));last=now;if(orbit&&mode==='approach'){angle+=dt*.07;const d=860*Math.max(1,1/camera.aspect);camera.position.set(Math.sin(angle)*d,300*Math.max(1,1/camera.aspect),-Math.cos(angle)*d);camera.lookAt(0,8,0);}island.update(dt,camera);renderer.render(scene,camera);if(catalog.visible){catalogItems.forEach((o,i)=>{const p=o.position.clone().project(camera),label=document.querySelector('#labels').children[i];label.style.left=((p.x*.5+.5)*innerWidth)+'px';label.style.top=((-p.y*.5+.5)*innerHeight)+'px';});}const stats=catalog.visible?{triangles:renderer.info.render.triangles,calls:renderer.info.render.calls}:island.getStats();document.querySelector('#status').textContent=`${Object.values(report.checks).every(Boolean)?'PASS':'FAIL'} · r160 · ${stats.triangles.toLocaleString()} ${catalog.visible?'catalogue':'island'} triangles / ${stats.calls} calls · no reflection pass · ${islandSize} m across · seed ${seed} · CC0`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
