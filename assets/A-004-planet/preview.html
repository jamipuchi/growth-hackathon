<header><div><small>SPACE PARTY / ASSET A-004</small><h1>One world. A place to land.</h1><p>Oceans · shifting clouds · warm lights after sunset</p></div><div class="controls"><select id="view" aria-label="Review view"><option value="hero">Approach</option><option value="day">Day side</option><option value="night">Night side</option><option value="landing">Landing region</option><option value="locked">Locked planet</option><option value="horizon">Cinematic horizon</option></select><button id="orbit">Orbit: off</button></div></header><div id="label">LANDING REGION</div><footer id="status">Loading planet…</footer>
<script type="module">
import * as THREE from 'three';
import {createPlanet,loadPlanetMaps,PLANET_SUN_DIRECTION} from './planet.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();scene.background=new THREE.Color(0x020611);const camera=new THREE.PerspectiveCamera(45,1,1,20000);
const key=new THREE.DirectionalLight(0xfff2dc,3.4);scene.add(key,new THREE.AmbientLight(0x354967,.32));
const start=performance.now(),planet=await createPlanet({seed:73});scene.add(planet.object3d);

const maps=await loadPlanetMaps();report.maps=Object.fromEntries(Object.entries(maps).map(([k,t])=>[k,{width:t.image.width,height:t.image.height,colorSpace:t.colorSpace}]));
report.checks.maps=maps.color.image.width===2048&&maps.color.image.height===1024&&maps.color.colorSpace===THREE.SRGBColorSpace&&maps.data.colorSpace===THREE.NoColorSpace;
report.checks.pbr=planet.surface.material.isMeshStandardMaterial;report.checks.radius=planet.surface.geometry.parameters.radius===200;report.checks.names=true;
planet.object3d.traverse(o=>{if(!/^[a-z][a-z0-9_]*$/.test(o.name))report.checks.names=false;});
report.checks.noShadows=!renderer.shadowMap.enabled&&!planet.surface.castShadow;
planet.setSunDirection(PLANET_SUN_DIRECTION);key.position.fromArray(PLANET_SUN_DIRECTION).multiplyScalar(1000);camera.position.set(260,110,-950);camera.lookAt(0,0,0);camera.updateMatrixWorld(true);planet.update(0);
const rawRender=renderer.render.bind(renderer);let invocations=0;renderer.render=(...args)=>{invocations++;return rawRender(...args);};renderer.render(scene,camera);renderer.render=rawRender;
report.renderInvocations=invocations;report.checks.noReflection=invocations===1;
report.unlocked={stats:planet.getStats(),actual:{triangles:renderer.info.render.triangles,calls:renderer.info.render.calls}};report.checks.budget=report.unlocked.actual.triangles<=20000&&report.unlocked.actual.calls===3&&report.unlocked.actual.triangles===report.unlocked.stats.triangles;
planet.setUnlocked(false);renderer.render(scene,camera);report.locked={stats:planet.getStats(),actual:{triangles:renderer.info.render.triangles,calls:renderer.info.render.calls}};report.checks.locked=report.locked.actual.calls===2&&!planet.landingRing.visible;planet.setUnlocked(true);
report.checks.shaders=shaderErrors.length===0&&renderer.getContext().getError()===0;
const duplicate=await createPlanet({seed:73}),different=await createPlanet({seed:74});
// Generated seed-dependent island data survives independent disposal.
const getIsland=p=>{const shader={uniforms:{},vertexShader:'',fragmentShader:''};p.surface.material.onBeforeCompile(shader);return shader.uniforms.planetIsland.value;};
const data=getIsland(planet).image.data,same=getIsland(duplicate).image.data,other=getIsland(different).image.data;
report.checks.deterministic=data.every((x,i)=>x===same[i])&&data.some((x,i)=>x!==other[i]);
let ownDisposed=0,sharedDisposed=0;duplicate.surface.geometry.addEventListener('dispose',()=>ownDisposed++);const listener=()=>sharedDisposed++;maps.color.addEventListener('dispose',listener);duplicate.dispose();duplicate.dispose();different.dispose();maps.color.removeEventListener('dispose',listener);report.checks.disposal=ownDisposed===1&&sharedDisposed===0;
const point=planet.getLandingPoint(),normal=planet.landingDirection;report.landing={position:point.toArray(),direction:normal.toArray(),distance:point.length()};report.checks.landingSocket=Math.abs(point.length()-203.4)<1e-5&&point.clone().normalize().distanceTo(normal)<1e-6;
planet.object3d.position.set(90,10,-20);planet.object3d.rotation.y=.4;planet.object3d.scale.setScalar(1.4);planet.object3d.updateMatrixWorld(true);const expected=planet.sockets.landing.position.clone().applyMatrix4(planet.object3d.matrixWorld);report.checks.socketTransforms=expected.distanceTo(planet.getLandingPoint())<1e-5;planet.object3d.position.set(0,0,0);planet.object3d.rotation.set(0,0,0);planet.object3d.scale.setScalar(1);
planet.setProximity(5);planet.update(1/30);report.checks.finiteGeometry=true;planet.object3d.traverse(o=>{if(o.isMesh)for(const x of o.geometry.attributes.position.array)if(!Number.isFinite(x))report.checks.finiteGeometry=false;});planet.setProximity(0);
// Isolate emissive city pixels with scene lights disabled, then restore lighting.
const gl=renderer.getContext(),readPixels=()=>{const a=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,a);return a;};
const countWarm=a=>{let n=0;for(let i=0;i<a.length;i+=4)if(a[i]>70&&a[i]>a[i+1]*1.3&&a[i+1]>a[i+2]*1.3)n++;return n;};
const lights=[];scene.traverse(o=>{if(o.isLight){lights.push([o,o.intensity]);o.intensity=0;}});planet.landingRing.visible=false;planet.atmosphere.visible=false;camera.position.set(0,0,-600);camera.lookAt(0,0,0);
planet.setSunDirection([0,0,-1]);renderer.render(scene,camera);const dayWarm=countWarm(readPixels());planet.setSunDirection([0,0,1]);renderer.render(scene,camera);const nightWarm=countWarm(readPixels());report.cityMask={dayWarmPixels:dayWarm,nightWarmPixels:nightWarm};report.checks.nightMask=nightWarm>20&&nightWarm>dayWarm*3;
lights.forEach(([o,intensity])=>o.intensity=intensity);planet.setSunDirection(PLANET_SUN_DIRECTION);renderer.render(scene,camera);const before=readPixels();planet.update(120);renderer.render(scene,camera);const after=readPixels();let changed=0;for(let i=0;i<before.length;i+=4)if(Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2])>8)changed++;report.cloudMotion={elapsedSeconds:120,changedPixels:changed};report.checks.cloudMotion=changed>200;planet.landingRing.visible=true;planet.atmosphere.visible=true;
report.checks.landAtSocket=data[(Math.floor(getIsland(planet).image.height/2)*getIsland(planet).image.width+Math.floor(getIsland(planet).image.width/2))*4]>250;
let mode='hero',orbit=false,angle=0,last=null;
function arrange(){const directions={hero:PLANET_SUN_DIRECTION,day:[.35,.4,-1],night:[.85,.3,.8],landing:[-.2,.5,-1],locked:PLANET_SUN_DIRECTION,horizon:[-.8,.4,-.7]};planet.setSunDirection(directions[mode]);key.position.fromArray(directions[mode]).normalize().multiplyScalar(1000);planet.setUnlocked(mode!=='locked');planet.setProximity(mode==='landing'?1:0);resize();}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;const d=Math.max(1,.85/camera.aspect);if(mode==='landing'){camera.position.copy(planet.landingDirection).multiplyScalar(400*d);camera.position.y+=40;camera.lookAt(planet.landingDirection.clone().multiplyScalar(175));}else if(mode==='horizon'){camera.position.set(0,200,-500);camera.lookAt(0,180,0);}else{camera.position.set(mode==='night'?100:160,70,-670).multiplyScalar(d);camera.lookAt(0,0,0);}camera.updateProjectionMatrix();planet.update(0);}
document.querySelector('#view').onchange=e=>{mode=e.target.value;arrange();};document.querySelector('#orbit').onclick=e=>{orbit=!orbit;e.target.textContent='Orbit: '+(orbit?'on':'off');};addEventListener('resize',resize);window.assetReport=report;arrange();
function frame(now){const dt=last===null?0:Math.min(.1,(now-last)/1000);last=now;if(orbit){angle+=dt*.12;const d=980*Math.max(1,.85/camera.aspect);camera.position.set(Math.sin(angle)*d,140,-Math.cos(angle)*d);camera.lookAt(0,0,0);}planet.update(dt);renderer.render(scene,camera);const p=planet.getLandingPoint(),facing=p.clone().normalize().dot(camera.position.clone().sub(p).normalize());p.project(camera);const label=document.querySelector('#label');label.style.display=mode==='locked'||facing<0?'none':'block';label.style.left=((p.x*.5+.5)*innerWidth)+'px';label.style.top=((-p.y*.5+.5)*innerHeight)+'px';const stats=planet.getStats();document.querySelector('#status').textContent=`${Object.values(report.checks).every(Boolean)?'PASS':'FAIL'} · ${stats.triangles.toLocaleString()} triangles / ${stats.calls} calls · radius 200 m · CC0`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
