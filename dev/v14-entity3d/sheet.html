<!doctype html>
<!-- v14 planet-entity body-spec test: one model's renders on one page (compare.mjs sheet → compare/<model>/contact.png).
     sheet.html?model=gpt-6.1-sol  Each tile: drawing + 3 poses × 3 angles (view.html), the spec's latency and parts. -->
<html><head><meta charset="utf-8"><title>planet entity spec contact sheet</title>
<style>
  body { margin: 0; background: #0d0b1f; color: #fff; font: 13px/1.3 "Barlow", system-ui, sans-serif; }
  h1 { margin: 0; padding: 14px 18px 6px; font: 800 italic 26px "Barlow Condensed", system-ui, sans-serif; letter-spacing: .5px; }
  .sub { padding: 0 18px 10px; color: #b9b3e6; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 14px; }
  .tile { background: #1b1740; border-radius: 10px; overflow: hidden; }
  .tile img { display: block; width: 100%; }
  .cap { padding: 6px 10px 8px; }
  .id { font-weight: 800; font-size: 14px; }
  .ok { color: #7ef0a8; } .bad { color: #ff7b7b; }
  .parts { color: #cfc9ff; font-size: 12px; }
</style></head><body>
<h1 id="title">PLANET ENTITY SPEC</h1><div class="sub" id="sub"></div>
<div class="grid" id="grid"></div>
<script type="module">
const model = new URLSearchParams(location.search).get("model") || "gpt-6.1-sol";
const base = `/dev/v14-entity3d/compare/${model}/`;
const sum = await (await fetch(base + "summary.json", { cache: "no-store" })).json();
document.getElementById("title").textContent = `PLANET ENTITY SPEC · ${model}`;
const ot = sum.outTokens || {};
document.getElementById("sub").textContent = `${sum.n} drawings · schema failures ${sum.schemaFailures} · latency p50 ${sum.p50} ms · p90 ${sum.p90} ms · max ${sum.max} ms · out tokens p50 ${ot.p50 ?? "-"} max ${ot.max ?? "-"}`;
const grid = document.getElementById("grid");
const loads = [];
for (const c of sum.calls) {
  const rec = await (await fetch(base + `${c.id}.spec.json`, { cache: "no-store" })).json();
  const s = rec.spec || {};
  const h = s.head || {}, t = s.torso || {}, v = s.vehicle || {};
  const parts = s.type ? [
    `${s.type}${s.typeFixed ? ` (model said ${s.typeFixed})` : ""} · ${s.view} view · head ${h.shape}/${h.gear}/${h.face} · torso ${t.shape} · arms ${s.arms && s.arms.count} · legs ${s.legs && s.legs.count} · tail ${s.tail && s.tail.kind} · vehicle ${v.body} ${v.wheels} wheels`,
    `items: ${(s.items || []).map((x) => `${x.kind}@${x.where}${x.added ? "*" : ""}`).join(", ") || "none"}`,
    s.palette && s.palette.colored ? "coloured" : null,
  ].filter(Boolean).join(" · ") : "";
  const r = rec.render || {};
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.innerHTML = `<img src="${base}${c.id}.png?${Date.now()}"><div class="cap"><span class="id">${c.id}</span> — ${rec.desc || ""}<br>
    <span class="${c.schemaOk ? "ok" : "bad"}">${c.schemaOk ? "spec ok" : "SPEC FAILED: " + (c.error || "")}</span> · ${c.ms ?? "-"} ms · ${c.usage ? c.usage.output + " out tok" : ""}
    ${r.ok ? ` · ${r.triangles} tris · ${r.drawCalls} calls · build ${r.ms} ms` : r.error ? ` · <span class="bad">RENDER FAILED</span>` : ""}<br><span class="parts">${parts}</span></div>`;
  grid.appendChild(tile);
  const img = tile.querySelector("img");
  loads.push(new Promise((ok) => { img.onload = img.onerror = ok; }));
}
await Promise.all(loads);
window.__ready = true;
</script></body></html>
