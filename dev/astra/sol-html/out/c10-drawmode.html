<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none}
.control{position:absolute;opacity:.92;touch-action:none;animation:pop .45s cubic-bezier(.2,.8,.3,1) both;transition:scale .18s cubic-bezier(.2,1.6,.4,1),translate .18s,filter .18s,box-shadow .18s}
.stick{--size:max(110px,min(30vw,64vh));width:var(--size);height:var(--size);left:clamp(calc(var(--size)/2 + 5px),21vw,calc(100vw - var(--size)/2 - 5px));top:clamp(calc(var(--size)/2 + 5px),60vh,calc(100vh - var(--size)/2 - 10px));margin-left:calc(var(--size)/-2);margin-top:calc(var(--size)/-2);border:4px solid white;border-radius:50%;background:radial-gradient(circle at 40% 20%,#446383db,#152342dc 70%);box-shadow:inset 0 3px 0 #ffffff80,0 5px 0 #0b1033}
.chevrons{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:white;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.knob{position:absolute;left:29%;top:29%;width:42%;height:42%;border:3px solid white;border-radius:50%;background:linear-gradient(#86dcff,#2f8bff 52%,#1647c8);box-shadow:inset 0 3px 0 #ffffff80,0 5px 0 #0b1033}
.shoot{--size:max(64px,min(22vw,46vh));width:var(--size);height:var(--size);left:clamp(calc(var(--size)/2 + 5px),81vw,calc(100vw - var(--size)/2 - 5px));top:clamp(calc(var(--size)/2 + 5px),63vh,calc(100vh - var(--size)/2 - 10px));margin-left:calc(var(--size)/-2);margin-top:calc(var(--size)/-2);border:4px solid white;border-radius:50%;background:linear-gradient(#ffe36e,#ffb21f 52%,#d26a06);box-shadow:inset 0 3px 0 #ffffff80,0 5px 0 #0b1033;animation-delay:.05s}
.content{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;padding:10%}
.icon{width:40%;height:40%;flex-shrink:0;fill:none;stroke:white;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 2px 0 #0b1033)}
.label{font-family:"Futura-CondensedExtraBold","Futura Condensed ExtraBold","AvenirNextCondensed-Heavy","Avenir Next Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:900;font-size:clamp(16px,5vh,26px);line-height:1;text-transform:uppercase;letter-spacing:.04em;color:white;text-shadow:-2px 0 #0b1033,2px 0 #0b1033,0 -2px #0b1033,0 2px #0b1033,0 3px 3px #0b1033}
.control.is-down{translate:0 4px;scale:.95;filter:brightness(1.15);box-shadow:inset 0 3px 0 #ffffff80,0 1px 0 #0b1033}
.control.is-on,.is-on .knob{background:linear-gradient(#ffe36e,#ffb21f 52%,#d26a06)}
.control.is-disabled{opacity:.35;filter:grayscale(.8)}
@keyframes pop{0%{opacity:0;scale:.35}75%{opacity:.92;scale:1.07}100%{opacity:.92;scale:1}}
@media(prefers-reduced-motion:reduce){.control{animation:none}}
</style>
</head>
<body>
<div class="control stick" data-stick="steer" aria-label="Steer">
<svg class="chevrons" viewBox="0 0 200 200" aria-hidden="true"><path d="M89 30 100 16 111 30M170 89 184 100 170 111M89 170 100 184 111 170M30 89 16 100 30 111"/></svg>
<div class="knob" data-knob></div>
</div>
<div class="control shoot" data-action="shoot" data-label="X" aria-label="X">
<div class="content">
<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="13"/><path d="M24 3v12m0 18v12M3 24h12m18 0h12"/><circle cx="24" cy="24" r="3" fill="white" stroke="none"/></svg>
<span class="label">X</span>
</div>
</div>
</body>
</html>
