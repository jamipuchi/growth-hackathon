<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Space Party Controller</title>
<style>
:root{font-family:"Futura-CondensedExtraBold","Futura Condensed ExtraBold","AvenirNextCondensed-Heavy","Avenir Next Condensed","Arial Narrow",Impact,sans-serif;color:white}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.control{position:absolute;left:clamp(calc(var(--w)/2 + 6px),var(--cx),calc(100vw - var(--w)/2 - 6px));top:clamp(calc(var(--h)/2 + 6px),var(--cy),calc(100vh - var(--h)/2 - 10px));width:var(--w);height:var(--h);margin-left:calc(var(--w)/-2);margin-top:calc(var(--h)/-2);opacity:.93;animation:arrive .45s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:var(--delay);transition:scale .2s cubic-bezier(.2,.8,.3,1.5),filter .15s,box-shadow .15s,transform .15s}
.tile{border:3px solid white;border-radius:12px;background:linear-gradient(#86dcff,#2f8bff 48%,#1647c8);box-shadow:inset 0 4px 0 #ffffff65,0 5px 0 #0b1033;display:flex;align-items:center;justify-content:center;gap:6px;transform:skewX(-9deg)}
.content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transform:skewX(9deg)}
.label{font-size:clamp(14px,2.8vw,24px);font-weight:900;letter-spacing:.04em;line-height:1;text-shadow:-1px -1px 0 #0b1033,1px -1px 0 #0b1033,-1px 1px 0 #0b1033,1px 1px 0 #0b1033,0 3px 2px #0b1033}
.icon{width:clamp(25px,5vw,48px);height:clamp(25px,9vh,40px);fill:none;stroke:white;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.fire{--w:max(56px,22vw);--h:max(56px,40vh);--cx:83vw;--cy:70vh;--delay:150ms;background:linear-gradient(#ffe36e,#ffb21f 50%,#d26a06);border-radius:7px}
.shield{--w:max(56px,min(20vw,36vh));--h:max(56px,min(20vw,36vh));--cx:54vw;--cy:74vh;--delay:100ms;border-radius:50%;transform:none;background:linear-gradient(#d49bff,#9d4dff 50%,#5a1bc4)}
.shield .content{transform:none}
.cam{--w:max(100px,20vw);--h:max(56px,20vh);--cx:50vw;--cy:20vh;--delay:50ms;border-radius:999px;transform:none;padding:0 10%;gap:12px}
.cam .label{font-size:clamp(14px,2.5vw,22px)}
.switch-light{flex-shrink:0;width:clamp(20px,4vw,36px);height:clamp(20px,4vw,36px);border:3px solid white;border-radius:50%;background:linear-gradient(#c5efff,#2f8bff);box-shadow:0 3px 0 #0b1033,inset 0 3px 0 #ffffff88}
.cam{padding:0 12px}
.tile.is-down{transform:skewX(-9deg) translateY(4px);scale:.95;filter:brightness(1.18);box-shadow:inset 0 3px 0 #ffffff65,0 1px 0 #0b1033}
.shield.is-down,.cam.is-down{transform:translateY(4px)}
.is-on{background:linear-gradient(#ffe36e,#ffb21f 50%,#d26a06)}
.is-on .switch-light{background:linear-gradient(#fff8d0,#ffe36e 55%,#ffb21f)}
.control.is-disabled{opacity:.35;filter:saturate(.25)}
.stick{--w:max(110px,min(27vw,60vh));--h:max(110px,min(27vw,60vh));--cx:18.5vw;--cy:64vh;--delay:0ms;border:4px solid white;border-radius:50%;background:radial-gradient(circle,#2739568c 25%,#142447af 70%,#0b1033ce);box-shadow:inset 0 3px 0 #ffffff35,0 5px 0 #0b1033}
.directions{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:white;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.knob{position:absolute;width:40%;height:40%;left:30%;top:30%;border:3px solid white;border-radius:50%;background:linear-gradient(#b0eaff,#2f8bff 55%,#1647c8);box-shadow:inset 0 4px 0 #ffffff80,0 5px 0 #0b1033;transition:filter .15s}
.stick.is-down .knob{filter:brightness(1.2)}
.stick.is-on{border-color:#ffe36e}
@keyframes arrive{0%{opacity:0;scale:.35}75%{opacity:.93;scale:1.07}100%{opacity:.93;scale:1}}
@media(prefers-reduced-motion:reduce){.control{animation:none;transition:none}}
</style>
</head>
<body>
<div class="control stick" data-stick="steer" aria-label="Steer">
<svg class="directions" viewBox="0 0 200 200" aria-hidden="true"><path d="M90 29 100 15 110 29M171 90 185 100 171 110M90 171 100 185 110 171M29 90 15 100 29 110"/></svg>
<div class="knob" data-knob></div>
</div>
<div class="control tile cam" data-action="view" data-label="CAM" data-toggle aria-label="Camera">
<span class="label">CAM</span><span class="switch-light" aria-hidden="true"></span>
</div>
<div class="control tile fire" data-action="shoot" data-label="FIRE">
<div class="content">
<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="14"/><path d="M24 3v12m0 18v12M3 24h12m18 0h12"/><circle cx="24" cy="24" r="3" fill="white" stroke="none"/></svg>
<span class="label">FIRE</span>
</div>
</div>
<div class="control tile shield" data-action="shield" data-label="SHIELD">
<div class="content">
<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 40 11v12c0 10-9 17-16 21C17 40 8 33 8 23V11Z"/><path d="m16 23 6 6 11-12"/></svg>
<span class="label">SHIELD</span>
</div>
</div>
</body>
</html>
