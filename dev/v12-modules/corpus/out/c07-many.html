<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Space Party Controller</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Futura-CondensedExtraBold","Futura Condensed ExtraBold","AvenirNextCondensed-Heavy","Avenir Next Condensed","Arial Narrow",Impact,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
.control{position:absolute;left:clamp(calc(var(--w)/2 + 7px),var(--cx),calc(100vw - var(--w)/2 - 7px));top:clamp(calc(var(--h)/2 + 7px),var(--cy),calc(100vh - var(--h)/2 - 9px));width:var(--w);height:var(--h);margin-left:calc(var(--w)/-2);margin-top:calc(var(--h)/-2);opacity:.93;animation:arrive .42s both;animation-delay:var(--delay);transition:scale .22s cubic-bezier(.2,1.65,.4,1),transform .12s,box-shadow .12s,filter .12s}
.btn{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;border:3px solid white;border-radius:9px;background:linear-gradient(180deg,#d49bff 0%,#9d4dff 49%,#5a1bc4 100%);box-shadow:inset 0 3px 0 #ffffff75,0 5px 0 #0b1033;transform:skewX(-9deg)}
.btn>*{transform:skewX(9deg)}
.round{border-radius:50%;transform:none}
.round>*{transform:none}
.gold{background:linear-gradient(180deg,#ffe36e,#ffb21f 49%,#d26a06)}
.blue{background:linear-gradient(180deg,#86dcff,#2f8bff 49%,#1647c8)}
.label{font-size:clamp(14px,2.7vw,24px);line-height:1;letter-spacing:.04em;font-weight:900;color:#fff;text-shadow:-1px -1px 0 #0b1033,1px -1px 0 #0b1033,-1px 1px 0 #0b1033,1px 1px 0 #0b1033,0 3px 2px #0b1033}
.icon{width:min(5vw,9vh);height:min(5vw,9vh);min-height:20px;min-width:20px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.btn.is-down{transform:skewX(-9deg) translateY(4px);scale:.95;box-shadow:inset 0 3px 0 #ffffff90,0 1px 0 #0b1033;filter:brightness(1.2)}
.btn.round.is-down{transform:translateY(4px)}
.btn.is-on{background:linear-gradient(180deg,#ffe36e,#ffb21f 49%,#d26a06)}
.control.is-disabled{opacity:.35;filter:grayscale(.7)}
.stick{border-radius:50%;border:4px solid #fff;background:radial-gradient(circle,#344d8170,#111b44b8);box-shadow:inset 0 3px 0 #ffffff30,0 5px 0 #0b1033}
.directions{position:absolute;inset:0;width:100%;height:100%;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(0 2px 0 #0b1033)}
.knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;border:3px solid white;background:linear-gradient(160deg,#b2ebff 0%,#2f8bff 48%,#1647c8 100%);box-shadow:inset 0 3px 0 #ffffff80,0 5px 0 #0b1033;transition:filter .15s}
.stick.is-down .knob{filter:brightness(1.2)}
.stick.is-on{border-color:#ffe36e}
@keyframes arrive{0%{opacity:0;scale:.35}75%{opacity:.93;scale:1.07}100%{opacity:.93;scale:1}}
@media(prefers-reduced-motion:reduce){.control{animation:none}}
</style>
</head>
<body>
<div class="control stick" data-stick="steer" aria-label="Steer" style="--w:max(110px,min(25vw,58vh));--h:max(110px,min(25vw,58vh));--cx:15.5vw;--cy:65vh;--delay:0ms">
<svg class="directions" viewBox="0 0 200 200" aria-hidden="true"><path d="M90 31l10-15 10 15M90 169l10 15 10-15M31 90l-15 10 15 10M169 90l15 10-15 10"/></svg>
<div class="knob" data-knob></div>
</div>
<div class="control btn" data-action="heal" data-label="HEAL" style="--w:max(56px,14vw);--h:max(56px,27vh);--cx:43vw;--cy:23.5vh;--delay:50ms">
<svg class="icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M15 5h10v10h10v10H25v10H15V25H5V15h10z"/></svg>
<span class="label">HEAL</span>
</div>
<div class="control btn round" data-action="flare" data-label="FLARE" style="--w:max(56px,14vw);--h:max(56px,27vh);--cx:61vw;--cy:23.5vh;--delay:100ms">
<svg class="icon" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8"/><path d="M20 2v5m0 26v5M2 20h5m26 0h5M7 7l4 4m18 18 4 4M7 33l4-4M29 11l4-4"/></svg>
<span class="label">FLARE</span>
</div>
<div class="control btn gold" data-action="blast" data-label="NUKE" style="--w:max(56px,14vw);--h:max(56px,27vh);--cx:79vw;--cy:23.5vh;--delay:150ms">
<svg class="icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M16 31v-9C7 22 4 18 7 13c-2-7 8-11 13-7 6-4 16 0 13 7 4 5 0 9-9 9v9m-12 4h16M12 16l5 2m11-2-5 2"/></svg>
<span class="label">NUKE</span>
</div>
<div class="control btn" data-action="invisible" data-label="CLOAK" style="--w:max(56px,16vw);--h:max(56px,27vh);--cx:44vw;--cy:73.5vh;--delay:200ms">
<svg class="icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M13 9q7-9 14 0l6 25-9-3-4 4-4-4-9 3zM15 13q5 5 10 0"/></svg>
<span class="label">CLOAK</span>
</div>
<div class="control btn blue" data-action="boost" data-label="BOOST" style="--w:max(56px,16vw);--h:max(56px,27vh);--cx:64vw;--cy:73.5vh;--delay:250ms">
<svg class="icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 8l12 12L6 32m16-24 12 12-12 12"/></svg>
<span class="label">BOOST</span>
</div>
<div class="control btn round gold" data-action="shoot" data-label="FIRE" style="--w:max(56px,19vw);--h:max(56px,40vh);--cx:86.5vw;--cy:72vh;--delay:300ms">
<svg class="icon" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="12"/><path d="M20 2v10m0 16v10M2 20h10m16 0h10"/><circle cx="20" cy="20" r="2" fill="white" stroke="none"/></svg>
<span class="label">FIRE</span>
</div>
</body>
</html>
