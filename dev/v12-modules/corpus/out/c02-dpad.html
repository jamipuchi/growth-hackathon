<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPACE PARTY Controller</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;touch-action:none;user-select:none}
body{font-family:"Futura-CondensedExtraBold","Futura Condensed ExtraBold","AvenirNextCondensed-Heavy","Avenir Next Condensed","Arial Narrow",Impact,sans-serif}
.control{position:absolute;opacity:.93;animation:arrive .42s cubic-bezier(.2,.9,.3,1.2) both;transition:scale .18s cubic-bezier(.2,1.6,.4,1),filter .14s,box-shadow .14s}
.btn{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5vh;border:3px solid white;border-radius:12px;background:linear-gradient(#86dcff,#2f8bff 48%,#1647c8);box-shadow:inset 0 3px 0 #ffffff70,inset 0 -3px 0 #0b103344,0 5px 0 #0b1033;transform:skewX(-9deg)}
.face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;transform:skewX(9deg)}
.label{font-size:clamp(14px,2.8vw,24px);font-weight:900;letter-spacing:.04em;color:white;line-height:1.05;text-shadow:-1px -1px 0 #0b1033,1px -1px 0 #0b1033,-1px 1px 0 #0b1033,1px 1px 0 #0b1033,0 3px 2px #0b1033}
.icon{width:clamp(25px,5vw,44px);height:clamp(25px,8vh,44px);fill:none;stroke:white;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.shoot{--w:max(56px,min(22vw,42vh));width:var(--w);height:var(--w);left:clamp(calc(var(--w)/2 + 8px),83vw,calc(100vw - var(--w)/2 - 8px));top:clamp(calc(var(--w)/2 + 8px),71vh,calc(100vh - var(--w)/2 - 9px));margin-left:calc(var(--w)/-2);margin-top:calc(var(--w)/-2);border-radius:50%;transform:none;background:linear-gradient(#ffe36e,#ffb21f 50%,#d26a06);animation-delay:.05s}
.shoot .face{transform:none}
.shoot .icon{width:clamp(32px,6vw,54px);height:clamp(32px,11vh,54px)}
.shield{--w:max(56px,20vw);--h:max(56px,26vh);width:var(--w);height:var(--h);left:clamp(calc(var(--w)/2 + 14px),55vw,calc(100vw - var(--w)/2 - 14px));top:clamp(calc(var(--h)/2 + 8px),75vh,calc(100vh - var(--h)/2 - 9px));margin-left:calc(var(--w)/-2);margin-top:calc(var(--h)/-2);background:linear-gradient(#d49bff,#9d4dff 48%,#5a1bc4);animation-delay:.1s}
.land{--w:max(56px,18vw);--h:max(56px,26vh);width:var(--w);height:var(--h);left:clamp(calc(var(--w)/2 + 14px),85vw,calc(100vw - var(--w)/2 - 14px));top:clamp(calc(var(--h)/2 + 8px),20vh,calc(100vh - var(--h)/2 - 9px));margin-left:calc(var(--w)/-2);margin-top:calc(var(--h)/-2);animation-delay:.15s}
.stick{--d:max(110px,min(28vw,62vh));width:var(--d);height:var(--d);left:clamp(calc(var(--d)/2 + 7px),18vw,calc(100vw - var(--d)/2 - 7px));top:clamp(calc(var(--d)/2 + 7px),61vh,calc(100vh - var(--d)/2 - 9px));margin-left:calc(var(--d)/-2);margin-top:calc(var(--d)/-2);border:4px solid white;border-radius:50%;background:radial-gradient(circle,#20477888,#0b1033b8);box-shadow:inset 0 2px 0 #ffffff55,0 5px 0 #0b1033}
.rim{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:white;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.knob{position:absolute;width:40%;height:40%;left:30%;top:30%;border:3px solid white;border-radius:50%;background:linear-gradient(155deg,#b7ecff 0%,#2f8bff 48%,#1647c8 100%);box-shadow:inset 0 3px 0 #ffffff80,0 5px 0 #0b1033;transition:filter .14s}
.btn.is-down{transform:skewX(-9deg) translateY(4px);scale:.95;filter:brightness(1.18);box-shadow:inset 0 2px 0 #ffffff70,0 1px 0 #0b1033}
.shoot.is-down{transform:translateY(4px)}
.stick.is-down .knob{filter:brightness(1.2)}
.control.is-on{background:linear-gradient(#ffe36e,#ffb21f 50%,#d26a06)}
.control.is-disabled{opacity:.35;filter:grayscale(.65)}
@keyframes arrive{0%{opacity:0;scale:.35}75%{opacity:.93;scale:1.07}100%{opacity:.93;scale:1}}
@media(prefers-reduced-motion:reduce){.control{animation:none}}
</style>
</head>
<body>
<div class="control stick" data-stick="steer" aria-label="Steer">
<svg class="rim" viewBox="0 0 200 200" aria-hidden="true"><path d="M88 29 100 17 112 29M171 88 183 100 171 112M88 171 100 183 112 171M29 88 17 100 29 112"/></svg>
<div class="knob" data-knob></div>
</div>
<div class="control btn shoot" data-action="shoot" data-label="SHOOT">
<div class="face"><svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="13"/><path d="M24 4v12m0 16v12M4 24h12m16 0h12"/><circle cx="24" cy="24" r="2" fill="white" stroke="none"/></svg><span class="label">SHOOT</span></div>
</div>
<div class="control btn shield" data-action="shield" data-label="SHIELD">
<div class="face"><svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="m24 5 16 6v12c0 10-9 17-16 20C17 40 8 33 8 23V11Z"/><path d="m16 23 6 6 11-12"/></svg><span class="label">SHIELD</span></div>
</div>
<div class="control btn land" data-action="land" data-label="LAND">
<div class="face"><svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M9 39h30M15 10h18M19 10l-5 23h-5m20-23 5 23h5M24 14v11m-4-4 4 4 4-4"/></svg><span class="label">LAND</span></div>
</div>
</body>
</html>
