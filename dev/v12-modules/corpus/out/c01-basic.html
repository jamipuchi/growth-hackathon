<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Space Party Controller</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Futura-CondensedExtraBold","Futura Condensed ExtraBold","AvenirNextCondensed-Heavy","Avenir Next Condensed","Arial Narrow",Impact,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
.control{position:absolute;opacity:.94;animation:arrive .45s cubic-bezier(.2,.8,.25,1.2) both}
.stick{--d:max(110px,min(27vw,60vh));width:var(--d);height:var(--d);left:clamp(calc(var(--d)/2 + 5px),18.5vw,calc(100vw - var(--d)/2 - 5px));top:clamp(calc(var(--d)/2 + 5px),60vh,calc(100vh - var(--d)/2 - 9px));margin-left:calc(var(--d)/-2);margin-top:calc(var(--d)/-2);border:4px solid #fff;border-radius:50%;background:radial-gradient(circle at 45% 30%,#284b797d,#111b3eb5 72%);box-shadow:0 5px 0 #0b1033,inset 0 3px 0 #ffffff45}
.chevrons{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.knob{position:absolute;width:40%;height:40%;left:30%;top:30%;border:3px solid #fff;border-radius:50%;background:radial-gradient(circle at 35% 20%,#c6efff 0%,#73caff 23%,#2f8bff 58%,#1647c8 100%);box-shadow:0 5px 0 #0b1033,inset 0 3px 0 #ffffff70;transition:filter .12s,box-shadow .12s}
.btn{width:var(--w);height:var(--h);left:clamp(calc(var(--w)/2 + var(--h)*.08 + 5px),var(--cx),calc(100vw - var(--w)/2 - var(--h)*.08 - 5px));top:clamp(calc(var(--h)/2 + 5px),var(--cy),calc(100vh - var(--h)/2 - 10px));margin-left:calc(var(--w)/-2);margin-top:calc(var(--h)/-2);border:3px solid white;border-radius:10px;transform:skewX(-9deg);background:linear-gradient(#86dcff,#2f8bff 51%,#1647c8);box-shadow:0 5px 0 #0b1033,inset 0 3px 0 #ffffff80;transition:translate .12s,scale .23s cubic-bezier(.2,1.7,.5,1),filter .12s,box-shadow .12s;display:flex;align-items:center;justify-content:center}
.face{transform:skewX(9deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.label{font-size:clamp(14px,2.8vw,24px);font-weight:900;letter-spacing:.04em;line-height:1;color:#fff;text-shadow:-1.5px 0 #0b1033,1.5px 0 #0b1033,0 -1.5px #0b1033,0 1.5px #0b1033,0 3px 2px #0b1033}
.icon{width:clamp(20px,4.8vw,42px);height:clamp(20px,7vh,36px);fill:none;stroke:white;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.fire{--w:max(56px,20vw);--h:max(56px,34vh);--cx:84vw;--cy:65vh;background:linear-gradient(#ffe36e,#ffb21f 52%,#d26a06);animation-delay:100ms}
.boost{--w:max(56px,21vw);--h:max(56px,28vh);--cx:57.5vw;--cy:74vh;animation-delay:50ms}
.btn.is-down{translate:0 4px;scale:.95;filter:brightness(1.18);box-shadow:0 1px 0 #0b1033,inset 0 2px 0 #ffffff85}
.stick.is-down .knob{filter:brightness(1.2);box-shadow:0 2px 0 #0b1033,inset 0 3px 0 #ffffff80}
.control.is-on{background:linear-gradient(#ffe36e,#ffb21f 52%,#d26a06)}
.control.is-disabled{opacity:.35;filter:grayscale(.7)}
@keyframes arrive{0%{opacity:0;scale:.35}72%{opacity:.94;scale:1.07}100%{opacity:.94;scale:1}}
</style>
</head>
<body>
<div class="control stick" data-stick="steer" aria-label="Steer">
<svg class="chevrons" viewBox="0 0 200 200" aria-hidden="true"><path d="M90 28 100 16 110 28M90 172 100 184 110 172M28 90 16 100 28 110M172 90 184 100 172 110"/></svg>
<div class="knob" data-knob></div>
</div>
<div class="control btn boost" data-action="boost" data-label="BOOST" aria-label="Boost">
<div class="face">
<svg class="icon" viewBox="0 0 48 40" aria-hidden="true"><path d="m8 9 13 11L8 31M26 9l13 11-13 11"/></svg>
<span class="label">BOOST</span>
</div>
</div>
<div class="control btn fire" data-action="shoot" data-label="FIRE" aria-label="Fire">
<div class="face">
<svg class="icon" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11"/><path d="M20 3v10m0 14v10M3 20h10m14 0h10"/><circle cx="20" cy="20" r="2" fill="white" stroke="none"/></svg>
<span class="label">FIRE</span>
</div>
</div>
</body>
</html>
