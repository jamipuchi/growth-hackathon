<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Space Party Controller</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;touch-action:none;user-select:none}
body{font-family:"Futura-CondensedExtraBold","Futura Condensed ExtraBold","AvenirNextCondensed-Heavy","Avenir Next Condensed","Arial Narrow",Impact,sans-serif}
.control{position:absolute;opacity:.93;animation:arrive .42s cubic-bezier(.2,.8,.3,1.3) both;transition:scale .2s cubic-bezier(.2,.9,.3,1.5),filter .15s,box-shadow .15s}
.tile{width:var(--w);height:var(--h);left:clamp(calc(var(--w)/2 + 2vw),var(--cx),calc(98vw - var(--w)/2));top:clamp(calc(var(--h)/2 + 1vh),var(--cy),calc(98vh - var(--h)/2 - 5px));margin-left:calc(var(--w)/-2);margin-top:calc(var(--h)/-2);display:flex;align-items:center;justify-content:center;gap:1.2vw;border:3px solid white;border-radius:12px;background:linear-gradient(#86dcff 0%,#2f8bff 48%,#1647c8 100%);box-shadow:inset 0 3px 0 #ffffff80,0 5px 0 #0b1033;transform:skewX(-9deg)}
.content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;transform:skewX(9deg)}
.label{font-size:clamp(14px,2.7vw,24px);font-weight:900;line-height:1;letter-spacing:.04em;color:white;text-align:center;white-space:nowrap;text-shadow:-1px -1px 0 #0b1033,1px -1px 0 #0b1033,-1px 1px 0 #0b1033,1px 1px 0 #0b1033,0 3px 2px #0b103380}
.icon{width:clamp(24px,5vw,44px);height:clamp(24px,10vh,44px);fill:none;stroke:white;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.dig{--w:max(56px,20vw);--h:max(56px,40vh);--cx:84vw;--cy:70vh;border-radius:7px;animation-delay:.05s}
.jump{--w:max(56px,17vw);--h:max(56px,30vh);--cx:58.5vw;--cy:77vh;border-radius:50%;transform:none;animation-delay:.1s}
.jump .content{transform:none}
.takeoff{--w:max(56px,26vw);--h:max(56px,24vh);--cx:83vw;--cy:20vh;animation-delay:.15s}
.takeoff .content{flex-direction:row;gap:1.4vw}
.stick{--d:max(110px,min(27vw,62vh));width:var(--d);height:var(--d);left:clamp(calc(var(--d)/2 + 1vw),18.5vw,calc(99vw - var(--d)/2));top:clamp(calc(var(--d)/2 + 1vh),61vh,calc(99vh - var(--d)/2 - 5px));margin-left:calc(var(--d)/-2);margin-top:calc(var(--d)/-2);border:4px solid white;border-radius:50%;background:radial-gradient(circle,#224b7955,#0b1033a6);box-shadow:inset 0 3px 0 #ffffff33,0 5px 0 #0b1033}
.arrows{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:white;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #0b1033)}
.knob{position:absolute;left:29%;top:29%;width:42%;height:42%;border:3px solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#a5e7ff,#2f8bff 52%,#1647c8);box-shadow:inset 0 3px 0 #ffffff80,0 4px 0 #0b1033}
.knob .label{font-size:clamp(14px,2vw,20px)}
.tile.is-down{transform:skewX(-9deg) translateY(4px);scale:.95;box-shadow:inset 0 2px 0 #ffffff90,0 1px 0 #0b1033;filter:brightness(1.2)}
.jump.is-down{transform:translateY(4px)}
.stick.is-down .knob{filter:brightness(1.2);box-shadow:inset 0 2px 0 #ffffff90,0 2px 0 #0b1033}
.control.is-on{background:linear-gradient(#ffe36e,#ffb21f 50%,#d26a06)}
.control.is-disabled{opacity:.35;filter:grayscale(.7)}
@keyframes arrive{0%{opacity:0;scale:.35}75%{opacity:.93;scale:1.07}100%{opacity:.93;scale:1}}
@media(prefers-reduced-motion:reduce){.control{animation:none}}
</style>
</head>
<body>
<div class="control stick" data-stick="move" aria-label="WALK">
<svg class="arrows" viewBox="0 0 200 200" aria-hidden="true"><path d="m91 28 9-13 9 13M172 91l13 9-13 9M109 172l-9 13-9-13M28 109l-13-9 13-9"/></svg>
<div class="knob" data-knob><span class="label">WALK</span></div>
</div>
<div class="control tile dig" data-action="dig" data-label="DIG">
<div class="content">
<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M19 5h10M24 5v24M15 28h18v6c0 6-9 11-9 11s-9-5-9-11z"/></svg>
<span class="label">DIG</span>
</div>
</div>
<div class="control tile jump" data-action="jump" data-label="JUMP">
<div class="content">
<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 34V8M13 19 24 8l11 11M10 40h28"/></svg>
<span class="label">JUMP</span>
</div>
</div>
<div class="control tile takeoff" data-action="takeoff" data-label="TAKE OFF">
<div class="content">
<svg class="icon" viewBox="0 0 48 48" aria-hidden="true"><path d="m13 20 11-11 11 11M13 32l11-11 11 11M10 42h28"/></svg>
<span class="label">TAKE OFF</span>
</div>
</div>
</body>
</html>
