<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>mischief-fx demo</title>
<link rel="icon" href="data:,">
<!--
  Demo and test page for /mischief-fx.js. Landscape phone layout (844 x 390).
    ?mode=dom      (default) plain DOM controls that follow the kit v1 markup contract, with a small pointer handler
    ?mode=sandbox  the controller from /api/template?preset=full, mounted by /ctrl-sandbox.js in a sandboxed iframe
  Bottom bar: trigger every effect. window.__mfx = the module, window.__log = [{ t, type, action }] (press / release /
  axis / swap / ink / error...), window.__ready = mounted, window.__sandboxReady = the frame reported its controls.
-->
<style>
  :root { --cyan: #5ee7ff; --ink: #e9f6ff; --hot: #ff3b5c; --orange: #ff9a3c; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #05060f; color: var(--ink);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  #bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

  /* fake HUD, in the thin-line style of the phone HUD */
  #hud { position: absolute; left: 0; top: 0; right: 0; padding: 6px 10px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; pointer-events: none; z-index: 2; }
  .meter { display: grid; grid-template-columns: 54px 92px; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 9px; letter-spacing: 0.22em; font-weight: 700; text-shadow: 0 0 6px var(--cyan); }
  .meter i { display: block; height: 5px; border: 1px solid rgb(94 231 255 / 0.6); border-radius: 3px; overflow: hidden; box-shadow: 0 0 8px rgb(94 231 255 / 0.35); }
  .meter b { display: block; height: 100%; background: linear-gradient(90deg, #1aa8ff, var(--cyan)); box-shadow: 0 0 8px var(--cyan); }
  #hud .hc { text-align: center; min-width: 220px; }
  #obj { font-size: 13px; letter-spacing: 0.26em; font-weight: 700; text-shadow: 0 0 10px rgb(255 255 255 / 0.6); white-space: nowrap; }
  .objbar { height: 4px; margin: 5px auto 3px; width: 220px; border-radius: 3px; background: rgb(255 255 255 / 0.12); overflow: hidden; }
  .objbar b { display: block; height: 100%; width: 62%; background: linear-gradient(90deg, var(--hot), var(--orange)); box-shadow: 0 0 10px var(--hot); }
  .sub { font-size: 9px; letter-spacing: 0.22em; color: rgb(230 240 255 / 0.85); font-weight: 600; }
  #hud .hr { justify-self: end; }
  #radar { width: 74px; height: 74px; display: block; }

  /* the controller layer (plain DOM controls in dom mode, the iframe container in sandbox mode) */
  #controller { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 5; touch-action: none; }
  .ctl { position: absolute; display: grid; place-items: center; border: 1.5px solid rgb(94 231 255 / 0.7); background: rgb(5 12 30 / 0.45); color: #c9f6ff;
    font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; box-shadow: 0 0 14px rgb(94 231 255 / 0.28), inset 0 0 10px rgb(94 231 255 / 0.12); touch-action: none; }
  .ctl.is-down { background: rgb(94 231 255 / 0.3); box-shadow: 0 0 22px rgb(94 231 255 / 0.65), inset 0 0 12px rgb(94 231 255 / 0.35); }
  .ctl span { margin-right: -0.22em; }
  .stick { left: 28px; bottom: 28px; width: 140px; height: 140px; border-radius: 50%; }
  .stick::before { content: ""; position: absolute; left: 22px; top: 22px; right: 22px; bottom: 22px; border-radius: 50%; border: 1px solid rgb(94 231 255 / 0.3); }
  .stick i { display: block; width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid rgb(94 231 255 / 0.9); background: rgb(94 231 255 / 0.18); box-shadow: 0 0 14px rgb(94 231 255 / 0.6); }
  .b-fire { right: 48px; bottom: 40px; width: 84px; height: 84px; border-radius: 50%; border-color: rgb(94 231 255 / 0.95); font-size: 13px; box-shadow: 0 0 20px rgb(94 231 255 / 0.4), inset 0 0 14px rgb(94 231 255 / 0.2); }
  .b-boost { right: 160px; bottom: 36px; width: 68px; height: 68px; border-radius: 50%; }
  .b-shield { right: 132px; bottom: 150px; width: 62px; height: 62px; border-radius: 16px; }
  .b-land { right: 40px; bottom: 158px; width: 62px; height: 62px; border-radius: 16px; }

  /* trigger bar (bottom centre, between the stick and the buttons) and event log */
  #bar { position: absolute; left: 180px; width: 426px; bottom: 8px; z-index: 10; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
  #bar button, #bar a { font: 700 9px/1 -apple-system, system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #bff3ff; text-decoration: none; touch-action: manipulation;
    border: 1px solid rgb(94 231 255 / 0.55); background: rgb(5 12 30 / 0.6); border-radius: 999px; padding: 6px 9px; box-shadow: 0 0 8px rgb(94 231 255 / 0.2); white-space: nowrap; }
  #bar a.on { background: rgb(94 231 255 / 0.85); color: #04121c; }
  #bar button:active { transform: scale(0.95); }
  #log { position: absolute; left: 8px; top: 100px; z-index: 3; width: 190px; font: 9px/1.35 ui-monospace, Menlo, monospace; color: rgb(160 225 245 / 0.8); pointer-events: none; white-space: pre; text-shadow: 0 0 4px #000; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="hud">
    <div class="hl">
      <div class="meter"><span>SHIELD</span><i><b style="width:82%"></b></i></div>
      <div class="meter"><span>BOOST</span><i><b style="width:55%"></b></i></div>
    </div>
    <div class="hc"><div id="obj">REACH THE BOSS</div><div class="objbar"><b></b></div><div class="sub">DISTANCE TO BOSS 62% &middot; 1:24</div></div>
    <div class="hr"><canvas id="radar" width="148" height="148"></canvas></div>
  </div>
  <div id="controller"></div>
  <div id="bar">
    <button data-fx="emp">EMP</button><button data-fx="ink">INK</button><button data-fx="tractor">TRACTOR</button><button data-fx="mine">MINE</button>
    <button data-fx="decoy">DECOY</button><button data-fx="decoyMine">DECOY (MINE)</button><button data-fx="toast">TOAST</button>
    <a id="mDom" href="?mode=dom">DOM</a><a id="mSb" href="?mode=sandbox">SANDBOX</a>
  </div>
  <pre id="log"></pre>
</div>

<script type="module">
import * as mfx from "/mischief-fx.js";

const $ = (id) => document.getElementById(id);
const MODE = new URLSearchParams(location.search).get("mode") === "sandbox" ? "sandbox" : "dom";
$(MODE === "sandbox" ? "mSb" : "mDom").classList.add("on");

window.__mfx = mfx;
window.__log = [];
window.__ready = false;
window.__sandboxReady = false;

// ---------- event log
let lastAxisLog = 0;
function log(type, action) {
  window.__log.push({ t: Math.round(performance.now()), type, action: String(action) });
  const rows = window.__log.slice(-7).map((e) => String(e.t).padStart(6) + "  " + e.type + " " + e.action.slice(0, 22));
  $("log").textContent = rows.join("\n");
}
function logAxis(name, x, y) {
  const now = performance.now();
  if (now - lastAxisLog < 120 && (x || y)) return;
  lastAxisLog = now;
  log("axis", name + " " + x.toFixed(2) + "," + y.toFixed(2));
}
const actionOf = (a) => (a && typeof a === "object" ? a.action || a.axis : a);

// ---------- fake game background: nebula, stars, planet, rocks, a boss
function paintBackground() {
  const c = $("bg"), W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  let s = 20261009; const r = () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
  const base = g.createLinearGradient(0, 0, W, H);
  base.addColorStop(0, "#1b0f55"); base.addColorStop(0.5, "#0c1457"); base.addColorStop(1, "#070420");
  g.fillStyle = base; g.fillRect(0, 0, W, H);
  const cloud = (x, y, rad, col) => { const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, col); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); };
  cloud(W * 0.16, H * 0.28, W * 0.36, "rgba(190,70,255,.55)");
  cloud(W * 0.8, H * 0.2, W * 0.4, "rgba(70,130,255,.5)");
  cloud(W * 0.5, H * 0.98, W * 0.44, "rgba(255,70,170,.3)");
  cloud(W * 0.62, H * 0.45, W * 0.22, "rgba(120,60,255,.3)");
  for (let i = 0; i < 260; i++) {
    g.fillStyle = "rgba(255,255,255," + (0.25 + r() * 0.75).toFixed(2) + ")";
    g.beginPath(); g.arc(r() * W, r() * H, r() < 0.06 ? 1.6 : r() * 0.9 + 0.3, 0, 7); g.fill();
  }
  // planet, low in the frame
  const px = W * 0.7, py = H * 1.28, pr = H * 0.95;
  const glow = g.createRadialGradient(px, py, pr * 0.96, px, py, pr * 1.07);
  glow.addColorStop(0, "rgba(120,200,255,.55)"); glow.addColorStop(1, "rgba(120,200,255,0)");
  g.fillStyle = glow; g.beginPath(); g.arc(px, py, pr * 1.07, 0, 7); g.fill();
  const pl = g.createRadialGradient(px - pr * 0.25, py - pr * 0.45, pr * 0.1, px, py, pr);
  pl.addColorStop(0, "#5fb4ff"); pl.addColorStop(0.5, "#2a6bd0"); pl.addColorStop(1, "#0b2a6e");
  g.fillStyle = pl; g.beginPath(); g.arc(px, py, pr, 0, 7); g.fill();
  g.fillStyle = "rgba(255,255,255,.28)";
  for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(px + (r() - 0.5) * pr * 1.2, py - pr * (0.55 + r() * 0.35), 18 + r() * 40, 5 + r() * 8, 0, 0, 7); g.fill(); }
  // the boss: a grey armoured sphere with a red core
  const bx = W * 0.5, by = H * 0.3, br = Math.min(H * 0.2, 70);
  const bs = g.createRadialGradient(bx - br * 0.3, by - br * 0.3, br * 0.1, bx, by, br);
  bs.addColorStop(0, "#9a9aa8"); bs.addColorStop(1, "#3a3a48");
  g.fillStyle = bs; g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill();
  g.strokeStyle = "rgba(255,70,70,.9)"; g.lineWidth = 2; g.beginPath(); g.arc(bx, by, br * 0.42, 0, 7); g.stroke();
  const core = g.createRadialGradient(bx, by, 0, bx, by, br * 0.38);
  core.addColorStop(0, "rgba(255,200,180,1)"); core.addColorStop(0.4, "rgba(255,60,60,.95)"); core.addColorStop(1, "rgba(255,40,40,0)");
  g.fillStyle = core; g.beginPath(); g.arc(bx, by, br * 0.5, 0, 7); g.fill();
  // chunky low-poly rocks
  for (let i = 0; i < 9; i++) {
    const rx = r() * W, ry = H * (0.12 + r() * 0.8), rr = 10 + r() * (i < 3 ? 46 : 22), n = 8;
    const pts = []; for (let k = 0; k < n; k++) { const a = (k / n) * 6.283, d = rr * (0.7 + r() * 0.4); pts.push([rx + Math.cos(a) * d, ry + Math.sin(a) * d]); }
    g.fillStyle = "#6b5a55"; g.beginPath(); pts.forEach((p, k) => (k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.fill();
    g.fillStyle = "rgba(20,10,30,.35)"; g.beginPath(); g.moveTo(pts[2][0], pts[2][1]); g.lineTo(pts[3][0], pts[3][1]); g.lineTo(pts[4][0], pts[4][1]); g.lineTo(pts[5][0], pts[5][1]); g.lineTo(rx, ry); g.closePath(); g.fill();
  }
}
function paintRadar() {
  const g = $("radar").getContext("2d"), s = 148, c = s / 2;
  g.strokeStyle = "rgba(160,230,255,.85)"; g.lineWidth = 1.5;
  for (const k of [1, 0.66, 0.33]) { g.beginPath(); g.arc(c, c, (c - 3) * k, 0, 7); g.stroke(); g.globalAlpha = 0.35; }
  g.globalAlpha = 1;
  g.beginPath(); g.moveTo(c, 4); g.lineTo(c, s - 4); g.moveTo(4, c); g.lineTo(s - 4, c); g.globalAlpha = 0.3; g.stroke(); g.globalAlpha = 1;
  g.fillStyle = "#ff4a4a"; for (const [x, y] of [[96, 40], [64, 36], [108, 62], [50, 54]]) { g.beginPath(); g.moveTo(x, y - 6); g.lineTo(x + 5, y + 4); g.lineTo(x - 5, y + 4); g.closePath(); g.fill(); }
  g.fillStyle = "#6fc0ff"; for (const [x, y] of [[44, 100], [60, 112]]) { g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); }
  g.fillStyle = "#5ee7ff"; g.beginPath(); g.moveTo(c, c - 11); g.lineTo(c + 8, c + 9); g.lineTo(c - 8, c + 9); g.closePath(); g.fill();
}
paintBackground(); paintRadar();
addEventListener("resize", paintBackground);

// ---------- dom mode: controls from the markup contract + a small pointer handler that mimics the kit's hit testing
function buildDom(layer) {
  layer.innerHTML =
    '<div class="ctl stick" data-stick="steer" data-label="STEER"><i data-knob></i></div>' +
    '<div class="ctl b-fire" data-action="shoot" data-label="FIRE"><span>FIRE</span></div>' +
    '<div class="ctl b-boost" data-action="boost" data-label="BOOST"><span>BOOST</span></div>' +
    '<div class="ctl b-shield" data-action="shield" data-label="SHIELD"><span>SHIELD</span></div>' +
    '<div class="ctl b-land" data-action="land" data-label="LAND"><span>LAND</span></div>';
  const ctls = [...layer.querySelectorAll("[data-action],[data-stick]")].map((el) => ({
    el, stick: el.hasAttribute("data-stick"), action: el.getAttribute("data-stick") || el.getAttribute("data-action"), knob: el.querySelector("[data-knob]"),
  }));
  const MIN = 56, SLOP = 6;
  // hit rectangles = the rendered box grown to at least 56 px plus slop; inside a drawn box beats the margin, then the smaller box
  function hit(x, y) {
    let best = null, bestInside = false, bestScore = Infinity;
    for (const c of ctls) {
      const r = c.el.getBoundingClientRect();           // follows `translate`, so a scrambled layout is what you hit
      if (r.width < 1 || r.height < 1) continue;
      const w = Math.max(r.width, MIN) + SLOP * 2, h = Math.max(r.height, MIN) + SLOP * 2;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      if (Math.abs(x - cx) > w / 2 || Math.abs(y - cy) > h / 2) continue;
      const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
      const score = inside ? r.width * r.height : Math.hypot((x - cx) / w, (y - cy) / h);
      if ((inside && !bestInside) || (inside === bestInside && score < bestScore)) { best = c; bestInside = inside; bestScore = score; }
    }
    return best;
  }
  function moveStick(c, e) {
    const r = c.el.getBoundingClientRect(), rad = Math.max(16, Math.min(r.width, r.height) / 2 - 18);
    let dx = (e.clientX - (r.left + r.width / 2)) / rad, dy = (e.clientY - (r.top + r.height / 2)) / rad;
    const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
    if (c.knob) c.knob.style.setProperty("translate", (dx * rad).toFixed(1) + "px " + (dy * rad).toFixed(1) + "px");
    c.el.style.setProperty("--x", dx.toFixed(2)); c.el.style.setProperty("--y", (-dy).toFixed(2));
    logAxis(c.action, dx, -dy);
  }
  const held = new Map(); // pointerId -> control
  layer.addEventListener("pointerdown", (e) => {
    const c = hit(e.clientX, e.clientY);
    if (!c) return;
    e.preventDefault();
    try { layer.setPointerCapture(e.pointerId); } catch {}
    held.set(e.pointerId, c);
    c.el.classList.add("is-down");
    if (c.stick) moveStick(c, e); else log("press", c.action);
  });
  layer.addEventListener("pointermove", (e) => { const c = held.get(e.pointerId); if (c && c.stick) moveStick(c, e); });
  const up = (e) => {
    const c = held.get(e.pointerId);
    if (!c) return;
    held.delete(e.pointerId);
    c.el.classList.remove("is-down");
    if (c.stick) { if (c.knob) c.knob.style.removeProperty("translate"); c.el.style.setProperty("--x", 0); c.el.style.setProperty("--y", 0); log("axis", c.action + " 0.00,0.00"); }
    else log("release", c.action);
  };
  layer.addEventListener("pointerup", up);
  layer.addEventListener("pointercancel", up);
  window.__ready = true;
}

// ---------- sandbox mode: /api/layout + /api/template (or a small built-in template) mounted by ctrl-sandbox.js
const FALLBACK_LAYOUT = { buttons: [{ type: "stick", action: "steer" }, { type: "button", action: "shoot" }, { type: "button", action: "boost" }, { type: "button", action: "shield" }, { type: "button", action: "land" }] };
const FALLBACK_HTML =
  '<style>[data-action],[data-stick]{position:absolute;display:grid;place-items:center;border:1.5px solid rgba(94,231,255,.7);background:rgba(5,12,30,.45);color:#c9f6ff;font:700 11px -apple-system,system-ui,sans-serif;letter-spacing:.22em;box-shadow:0 0 14px rgba(94,231,255,.28)}' +
  '.is-down{background:rgba(94,231,255,.3)!important}[data-knob]{display:block;width:56px;height:56px;border-radius:50%;border:1.5px solid #5ee7ff;background:rgba(94,231,255,.18)}</style>' +
  '<div data-stick="steer" style="left:28px;bottom:28px;width:140px;height:140px;border-radius:50%"><i data-knob></i></div>' +
  '<div data-action="shoot" data-label="FIRE" style="right:48px;bottom:40px;width:84px;height:84px;border-radius:50%">FIRE</div>' +
  '<div data-action="boost" data-label="BOOST" style="right:160px;bottom:36px;width:68px;height:68px;border-radius:50%">BOOST</div>' +
  '<div data-action="shield" data-label="SHIELD" style="right:132px;bottom:150px;width:62px;height:62px;border-radius:16px">SHIELD</div>' +
  '<div data-action="land" data-label="LAND" style="right:40px;bottom:158px;width:62px;height:62px;border-radius:16px">LAND</div>';

async function buildSandbox(layer) {
  const { mountController } = await import("/ctrl-sandbox.js");
  let layout = FALLBACK_LAYOUT, html = FALLBACK_HTML;
  try {
    const [l, h] = await Promise.all([fetch("/api/layout?preset=full").then((r) => r.json()), fetch("/api/template?preset=full").then((r) => r.text())]);
    if (l && Array.isArray(l.buttons) && l.buttons.length && h && h.length > 40) { layout = l; html = h; } else throw new Error("empty layout or template");
  } catch (e) { log("error", "api failed, built-in template: " + (e.message || e)); }
  const allowedActions = [...new Set(layout.buttons.map((b) => b.action))];
  window.__ctl = mountController(layer, html, {
    allowedActions,
    onPress: (a) => log("press", actionOf(a)),
    onRelease: (a) => log("release", actionOf(a)),
    onAxis: (axis, x, y) => logAxis(actionOf(axis), +x || 0, +y || 0),
    onReady: (r) => { window.__sandboxReady = true; log("ready", ((r && r.controls) || []).length + " controls"); },
    onViolation: (v) => log("violation", (v && v.kind) + " " + ((v && v.detail) || "")),
  });
  window.__ready = true;
}

const layer = $("controller");
window.__layer = layer;
if (MODE === "sandbox") buildSandbox(layer).catch((e) => { log("error", String(e && e.message || e)); window.__error = String(e && e.message || e); });
else buildDom(layer);

// ---------- the trigger bar
const tones = ["cyan", "gold", "violet", "red"];
let toastN = 0;
const FX = {
  emp: () => mfx.emp(layer, 5, { onSwap: (p) => log("swap", p ? JSON.stringify(p) : "restored") }),
  ink: () => mfx.inkBomb(document.body, { seconds: 4, onClear: (r) => log("ink", "cleared " + JSON.stringify(r)) }),
  tractor: () => mfx.tractorHit(document.body, { by: "ANA", dir: Math.random() * Math.PI * 2 }),
  mine: () => mfx.mineHit(document.body, { by: "BEN", shakeEl: $("stage") }),
  decoy: () => mfx.decoyFooled(document.body, { by: "CAL" }),
  decoyMine: () => mfx.decoyFooled(document.body, { mine: true, victim: "DEE" }),
  toast: () => { const n = toastN++; return mfx.toast(["NICE SHOT", "CHEST OPENED", "BOSS DOWN", "NEW RIVAL"][n % 4], { sub: ["+200 POINTS", "+1500 POINTS", "LAST HIT +1000", "ZED JOINED"][n % 4], tone: tones[n % 4] }); },
};
document.querySelectorAll("#bar button[data-fx]").forEach((b) => b.addEventListener("click", () => { log("fx", b.dataset.fx); FX[b.dataset.fx](); }));
</script>
</body>
</html>
