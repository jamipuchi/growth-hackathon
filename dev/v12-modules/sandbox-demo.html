<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sandboxed controller demo</title>
<link rel="icon" href="data:,">
<style>
  :root { --cyan: #5ee7ff; --dim: rgb(160 200 230 / 0.6); --hot: #ff9a3c; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; touch-action: none; background: #05060f; color: #e9f6ff; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; }
  #sky { position: fixed; inset: 0; background:
      radial-gradient(ellipse at 22% 28%, rgb(124 58 237 / 0.55), transparent 55%),
      radial-gradient(ellipse at 78% 18%, rgb(219 39 119 / 0.45), transparent 50%),
      radial-gradient(ellipse at 60% 85%, rgb(37 99 235 / 0.5), transparent 60%), #070a22; }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; }
  #area { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
  #bar { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
  #bar button { font: 600 9px/1 inherit; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cyan); padding: 7px 10px; border-radius: 999px;
    border: 1px solid rgb(94 231 255 / 0.55); background: rgb(5 12 30 / 0.6); box-shadow: 0 0 10px rgb(94 231 255 / 0.25); }
  #panel { position: fixed; top: 36px; left: 50%; transform: translateX(-50%); width: 300px; z-index: 4; pointer-events: none; text-align: center;
    font: 600 9px/1.5 -apple-system, system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
  #lamps { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 4px; }
  #lamps i { font-style: normal; padding: 2px 6px; border-radius: 4px; border: 1px solid rgb(94 231 255 / 0.3); }
  #lamps i.on { color: #04121c; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  #axes { color: #cfefff; }
  #log { margin-top: 3px; opacity: 0.8; white-space: pre; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="sky"></div><canvas id="stars"></canvas>
<div id="area"></div>
<div id="bar"><button id="bEmp">EMP</button><button id="bDis">Grey drill</button><button id="bRel">Release all</button><button id="bRe">Remount</button></div>
<div id="panel"><div id="lamps"></div><div id="axes">steer 0 0 · move 0 0</div><div id="log"></div></div>
<script type="module">
import { mountController, CSP } from "/ctrl-sandbox.js";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
// ?pagecsp=0: mount without the frame-src 'none' page CSP that mountController adds by default.
const pageCsp = q.get("pagecsp") !== "0";

// starfield, drawn once
const st = $("stars"), dpr = Math.min(2, devicePixelRatio || 1);
st.width = innerWidth * dpr; st.height = innerHeight * dpr;
const g = st.getContext("2d");
for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(255,255,255,${0.2 + Math.random() * 0.7})`; const r = Math.random() * 1.3 * dpr; g.beginPath(); g.arc(Math.random() * st.width, Math.random() * st.height, r, 0, 7); g.fill(); }

window.__events = []; window.__violations = []; window.__ready = null; window.__CSP = CSP;
const down = new Set(), axes = { steer: [0, 0], move: [0, 0] };
let lines = [];
function log(text) { lines = [text, ...lines].slice(0, 5); $("log").textContent = lines.join("\n"); }
function lamps() { $("lamps").innerHTML = [...(window.__allowed || [])].filter((a) => a !== "steer" && a !== "move").map((a) => `<i class="${down.has(a) ? "on" : ""}">${a}</i>`).join(""); }
function axesText() { $("axes").textContent = `steer ${axes.steer[0].toFixed(2)} ${axes.steer[1].toFixed(2)} · move ${axes.move[0].toFixed(2)} ${axes.move[1].toFixed(2)}`; }

async function load() {
  const preset = q.get("preset") || "basic";
  const layout = await (await fetch(`/api/layout?preset=${preset}`)).json();
  const template = await (await fetch(`/api/template?preset=${preset}`)).text();
  const src = q.get("src");
  const html = src ? await (await fetch(src)).text() : template;
  return { layout, template, html };
}

let handle = null;
// Mount any HTML (tests call this too). opts: { allowedActions, fallbackHtml, requiredActions, readyTimeoutMs, rate }
window.__mount = (html, opts = {}) => {
  if (handle) handle.destroy();
  window.__events.length = 0; window.__violations.length = 0; window.__ready = null; down.clear();
  window.__allowed = opts.allowedActions;
  lamps();
  handle = mountController($("area"), html, {
    pageCsp,
    ...opts,
    onPress: (a) => { down.add(a); window.__events.push({ t: performance.now(), type: "press", action: a }); log(`press ${a}`); lamps(); },
    onRelease: (a) => { down.delete(a); window.__events.push({ t: performance.now(), type: "release", action: a }); log(`release ${a}`); lamps(); },
    onAxis: (axis, x, y) => { axes[axis] = [x, y]; window.__events.push({ t: performance.now(), type: "axis", axis, x, y }); axesText(); },
    onReady: ({ controls }) => { window.__ready = controls; log(`ready: ${controls.length} controls`); },
    onViolation: (v) => { window.__violations.push(v); log(`blocked ${v.kind} ${v.detail}`.slice(0, 48)); },
  });
  window.__handle = handle;
  return true;
};

const { layout, template, html } = await load();
const allowedActions = [...new Set(layout.buttons.map((b) => b.action))];
window.__layout = layout; window.__template = template;
window.__mount(html, { allowedActions, fallbackHtml: q.get("fallback") === "0" ? undefined : template, requiredActions: allowedActions });
$("bEmp").onclick = () => handle.fx("emp", { seconds: 5 });
$("bDis").onclick = () => handle.setDisabled(["drill"]);
$("bRel").onclick = () => handle.releaseAll();
$("bRe").onclick = () => window.__mount(html, { allowedActions, fallbackHtml: template, requiredActions: allowedActions });
</script>
</body>
</html>
