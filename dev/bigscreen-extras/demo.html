<!doctype html>
<meta charset="utf-8">
<title>bigscreen extras demo</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 30% 20%,#1a1050,#070818 70%);overflow:hidden}
#stage{position:relative;width:1440px;height:900px;overflow:hidden}
#qr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ship{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%}
</style>
<div id="stage"><div id="qr"></div></div>
<script type="module">
import { createJoinQR, createKillFeed, createNameTags, injectStyles } from "/bigscreen-extras.js";
injectStyles();
const stage = document.getElementById("stage");
const url = new URLSearchParams(location.search).get("url") || "http://10.38.40.24:8000/controller.html";
const qr = createJoinQR(document.getElementById("qr"), url, { size: 260 });
const feed = createKillFeed(stage);
const tags = createNameTags(stage);
const colors = ["#ff5d73", "#4fd1ff", "#ffd166", "#7dff8a", "#c28bff", "#ff9a3c", "#5df2d6", "#ff7bd5"];
const names = ["ANA", "BEN", "CARLA", "DAVID", "ELI", "FRAN", "GINA", "HUGO"];
const ships = names.map((n, i) => ({ name: n, color: colors[i], hp: 100 - i * 9, maxHp: 100, x: 0, y: 0, visible: i !== 6 }));
const dots = ships.map((s) => { const d = document.createElement("div"); d.className = "ship"; d.style.background = s.color; d.style.boxShadow = `0 0 14px ${s.color}`; stage.appendChild(d); return d; });
function frame(t) {
  ships.forEach((s, i) => {
    const a = t / 1500 + i * 0.8;
    s.x = 720 + Math.cos(a) * (420 + i * 8);
    s.y = 450 + Math.sin(a * 1.3) * (300 - i * 10);
    dots[i].style.transform = `translate(${s.x}px,${s.y + 22}px)`;
  });
  const t0 = performance.now();
  tags.update(ships);
  const dt = performance.now() - t0;
  window.__cost = window.__cost || [];
  window.__cost.push(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const events = [["ANA ✕ BEN", 0], ["BEN CRACKED THE BOSS", 1], ["ANA FOUND THE TREASURE", 0], ["CARLA ✕ DAVID", 2], ["ELI ✕ ANA", 4], ["HUGO CRACKED THE BOSS", 7]];
let k = 0;
window.__pushNext = () => { const [txt, c] = events[k++ % events.length]; feed.push(txt, colors[c]); };
window.__pushNext(); window.__pushNext(); window.__pushNext();
if (!location.search.includes("still")) setInterval(window.__pushNext, 2500);
</script>
