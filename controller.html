<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0d0b2e">
<title>Space Party</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800;1,900&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Space Party phone, Fortnite style (v1.1). Orange = ship / explorer drawing, cyan = controller drawing. ===== */
  :root {
    --navy: #0d0b2e; --blue: #2b7bff; --blue2: #1f5dff; --purple: #8a3dff; --purple2: #b45cff;
    --gold: #ffcb3d; --gold2: #ffb000; --green: #4ade5a; --red: #ff3b5c; --orange: #ff8a1f; --cyan: #19d3ff;
    --ink: #120a2e; --hard: #0a0830;
    --accent: var(--orange); --accent2: #ffb347; --glow: rgb(255 138 31 / 0.5);
    --me: #22d3ee;
    --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px);
    --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px);
    --f-head: "Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", Impact, system-ui, sans-serif;
    --f-body: "Barlow", -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: var(--navy); color: #fff;
    font: 600 15px/1.25 var(--f-body); -webkit-font-smoothing: antialiased; }
  input { -webkit-user-select: text; user-select: text; font-family: inherit; }
  /* :where() keeps this reset at zero specificity, so .btn styles also win on the <label class="btn"> photo buttons */
  :where(button, label.btn) { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; }
  svg.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  svg.big { width: 100%; height: 100%; }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; }
  .area { position: fixed; top: var(--st); right: var(--sr); bottom: var(--sb); left: var(--sl); }

  /* Heading text: heavy condensed italic caps, white with a dark outline and a hard shadow */
  .hd { font-family: var(--f-head); font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: 0.02em; line-height: 0.95; color: #fff;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 rgb(10 6 30 / 0.55); }
  .status { font: 700 13px/1.15 var(--f-body); color: #fff; text-align: center; text-shadow: 0 2px 0 rgb(10 6 30 / 0.7); min-height: 1.15em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .counter { display: flex; justify-content: center; }

  /* Pop-in and press motion (transform and opacity only) */
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 62% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .pop { animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin3d { to { transform: rotateY(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }

  /* ---- Buttons: slanted, gold = the main action, hard bottom shadow ---- */
  .btn { position: relative; z-index: 0; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px;
    font-family: var(--f-head); font-weight: 900; font-style: italic; font-size: 22px; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--ink); text-align: center; white-space: nowrap; transition: transform 0.08s; }
  .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); border: 3px solid var(--ink); border-radius: 5px;
    background: linear-gradient(#ffe58a, var(--gold) 45%, var(--gold2)); box-shadow: 0 6px 0 var(--hard); transition: transform 0.08s, box-shadow 0.08s; }
  .btn:active { transform: scale(0.94); }
  .btn:active::before { box-shadow: 0 2px 0 var(--hard); }
  .btn.big { min-height: 64px; font-size: 28px; padding: 0 34px; }
  .btn.sm { min-height: 48px; font-size: 17px; padding: 0 16px; }
  .btn.sq { padding: 0; width: 52px; }
  .btn small { font: 800 0.62em/1 var(--f-body); font-style: normal; letter-spacing: 0.05em; text-transform: none; opacity: 0.9; }
  .btn.blue, .btn.purple, .btn.red, .btn.green, .btn.cyan, .btn.orange, .btn.ghost { color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); }
  .btn.blue::before { background: linear-gradient(#5aa0ff, var(--blue) 50%, var(--blue2)); }
  .btn.purple::before { background: linear-gradient(#c98aff, var(--purple2) 50%, var(--purple)); }
  .btn.red::before { background: linear-gradient(#ff8095, var(--red) 55%, #d81f45); }
  .btn.green::before { background: linear-gradient(#8dff9a, var(--green) 55%, #1fa83a); }
  .btn.cyan::before { background: linear-gradient(#7aeaff, var(--cyan) 55%, #0aa7d6); }
  .btn.orange::before { background: linear-gradient(#ffc06a, var(--orange) 55%, #e06a00); }
  .btn.ghost::before { background: rgb(13 11 46 / 0.82); }
  .btn:disabled, .btn.empty { opacity: 0.5; filter: grayscale(0.5); }
  label.btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .skip { align-self: flex-start; min-height: 44px; padding: 6px 4px; font: 800 14px/1.15 var(--f-body); color: #fff; text-align: left;
    text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: rgb(255 255 255 / 0.5); text-shadow: 0 2px 0 rgb(10 6 30 / 0.7); }
  .skip:active { opacity: 0.7; }

  /* Segmented PHOTO | DRAW toggle */
  .seg { position: relative; z-index: 0; isolation: isolate; display: inline-flex; padding: 3px; gap: 3px; flex: none; align-self: center; }
  .seg::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.88); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--hard); }
  .seg button { position: relative; z-index: 0; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; color: #fff;
    font: 900 italic 17px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; }
  .seg button::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); border-radius: 4px; }
  .seg button.on { color: var(--ink); }
  .seg button.on::before { background: linear-gradient(#ffe58a, var(--gold)); }

  /* ---- Join ---- */
  #join { display: flex; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(ellipse at 18% 12%, #4f2dbb 0%, #241568 42%, #0d0b2e 100%);
    padding: calc(var(--st) + 14px) calc(var(--sr) + 18px) calc(var(--sb) + 14px) calc(var(--sl) + 18px); }
  #join::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgb(255 255 255 / 0.035) 0 22px, transparent 22px 64px); pointer-events: none; }
  .jwrap { position: relative; width: min(420px, 100%); display: flex; flex-direction: column; gap: 16px; }
  .jleft { display: flex; flex-direction: column; gap: 16px; }
  .logo { text-align: center; line-height: 0.82; transform: rotate(-4deg); margin-bottom: 4px; }
  .logo span { display: block; font: 900 italic 78px/0.86 var(--f-head); text-transform: uppercase; letter-spacing: 0.01em;
    -webkit-text-stroke: 11px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 rgb(10 6 30 / 0.7); }
  .logo .l1 { color: var(--gold); }
  .logo .l2 { color: #fff; margin-top: 2px; }
  .jform { display: flex; flex-direction: column; gap: 14px; }
  #name { width: 100%; height: 60px; padding: 0 16px; border: 4px solid var(--ink); border-radius: 6px; outline: none; text-align: center;
    font: 900 italic 26px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.05em; color: #fff; background: rgb(13 11 46 / 0.88);
    box-shadow: 0 6px 0 var(--hard), inset 0 0 0 2px rgb(255 255 255 / 0.12); }
  #name::placeholder { color: rgb(255 255 255 / 0.42); }
  #name:focus { border-color: var(--gold); }
  .steps { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .steps li { position: relative; z-index: 0; isolation: isolate; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px 6px 12px;
    font: 900 italic 20px/1.02 var(--f-head); text-transform: uppercase; letter-spacing: 0.03em; color: #fff; -webkit-text-stroke: 2.2px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); }
  .steps li::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 4px 0 var(--hard); }
  .steps .s1::before { background: linear-gradient(90deg, #ff8a1f, #ffb347); }
  .steps .s2::before { background: linear-gradient(90deg, #0fb8e8, #19d3ff); }
  .steps .s3::before { background: linear-gradient(90deg, var(--blue2), var(--purple)); }
  .steps svg { width: 34px; height: 34px; flex: none; fill: initial; stroke: none; }
  @media (orientation: landscape) and (max-height: 520px) {
    .jwrap { width: min(780px, 100%); flex-direction: row; align-items: center; gap: 34px; }
    .jleft, .steps { flex: 1 1 0; min-width: 0; }
    .jleft { gap: 12px; }
    .steps { gap: 12px; }
    .logo span { font-size: 62px; -webkit-text-stroke-width: 9px; }
    .steps li { min-height: 56px; font-size: 21px; }
  }

  /* ---- Draw screen: STEP 1 (ship, orange) / STEP 2 (controller, cyan) / explorer / planet controller ---- */
  #draw { --accent: #ff8a1f; --accent2: #ffb347; --glow: rgb(255 138 31 / 0.5); display: flex; flex-direction: column; gap: 8px;
    background: radial-gradient(ellipse at 50% -10%, #3b2593 0%, #17104f 50%, #0d0b2e 100%);
    padding: calc(var(--st) + 10px) calc(var(--sr) + 12px) calc(var(--sb) + 8px) calc(var(--sl) + 12px); }
  #draw[data-kind="controller"], #draw[data-kind="planetController"] { --accent: #0fb8e8; --accent2: #19d3ff; --glow: rgb(25 211 255 / 0.5); }
  #draw::after { content: ""; position: fixed; inset: 0; border: 6px solid var(--accent); box-shadow: inset 0 0 30px var(--glow); pointer-events: none; z-index: 6; }
  .dtop { flex: none; display: flex; align-items: center; gap: 12px; }
  .dhead { position: relative; z-index: 0; isolation: isolate; flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 7px 18px 8px 12px; }
  .dhead::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); background: linear-gradient(90deg, var(--accent), var(--accent2));
    border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 5px 0 var(--hard); }
  .dicon { flex: none; width: 46px; height: 46px; position: relative; perspective: 260px; }
  .dicon .still { width: 100%; height: 100%; animation: bob 2.4s ease-in-out infinite; }
  .spin3d { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: spin3d 3.4s linear infinite; }
  .spin3d svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: initial; stroke: none; }
  .dtxt { min-width: 0; line-height: 1; }
  .dtxt b { display: block; font: 900 italic 22px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.02em; color: #fff;
    -webkit-text-stroke: 2.6px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 rgb(10 6 30 / 0.45); }
  .dtxt i { display: block; margin-top: 3px; font: 700 italic 15px/1.1 var(--f-body); color: #fff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.65); }
  .dbody { flex: 1; min-height: 0; display: flex; gap: 10px; }
  .guide { flex: 0 0 30%; min-width: 150px; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .gcol { flex: none; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
  .example { position: relative; flex: 1 1 90px; min-height: 60px; max-height: 152px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #fffdf5; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 5px 0 var(--hard); transform: rotate(-1.2deg); }
  .example svg { width: 100%; height: 100%; display: block; }
  .example::before { content: attr(data-tag); position: absolute; left: 0; top: 0; z-index: 1; padding: 2px 9px 3px 7px; border-radius: 0 0 8px 0;
    background: var(--ink); color: #fff; font: 900 italic 11px/1 var(--f-head); letter-spacing: 0.1em; text-transform: uppercase; }
  .gtext { flex: none; }
  .gtext p { font: 700 14px/1.22 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.75); }
  .gtext p:empty { display: none; }
  .gtext #drawLine, .gtext .ln { margin-top: 5px; color: #ffe27a; }
  .stagebox { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; border: 4px solid var(--accent); border-radius: 8px; background: rgb(13 11 46 / 0.6);
    box-shadow: 0 5px 0 var(--hard), 0 0 22px var(--glow); overflow: hidden; }
  .padwrap { position: absolute; inset: 0; }
  #drawPad { position: absolute; touch-action: none; background: #fbf8ef; border-radius: 3px; }
  #addPad { position: fixed; top: var(--st); left: var(--sl); width: calc(100% - var(--sl) - var(--sr)); height: calc(100% - var(--st) - var(--sb)); touch-action: none; }
  .padhint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; pointer-events: none;
    font: 900 italic 26px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.04em; color: rgb(18 10 46 / 0.18); transition: opacity 0.2s; }
  .padwrap.has-ink .padhint { opacity: 0; }
  .camcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; text-align: center; }
  .camintro { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .camhint { max-width: 330px; font: 700 14px/1.25 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.75); }
  .bigshot { min-height: 92px; padding: 0 34px; font-size: 27px; }
  .bigshot svg.ic { width: 38px; height: 38px; }
  .preview { flex: 1 1 0; min-height: 0; max-width: 100%; object-fit: contain; border: 3px solid #fff; border-radius: 6px; background: #fff; box-shadow: 0 5px 0 var(--hard); }
  .dfoot { flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .dfoot .fl, .dfoot .fr { display: flex; gap: 8px; flex: none; }
  .dfoot .fc { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  @media (orientation: portrait) {
    .dtop { flex-wrap: wrap; row-gap: 8px; }
    .dhead { flex: 1 1 100%; }
    .dbody { flex-direction: column; }
    .guide { flex: none; flex-direction: row; align-items: flex-start; gap: 12px; overflow: visible; }
    .example { flex: 0 0 138px; height: 92px; min-height: 0; max-height: none; }
    .gcol { flex: 1 1 0; min-width: 0; }
    .dfoot { flex-wrap: wrap; row-gap: 6px; }
    .dfoot .fc { order: -1; flex: 1 0 100%; flex-direction: row; justify-content: space-between; }
    .dfoot .fl { flex: 1; }
  }

  /* ---- Sheets: generating, wrong drawing, results, explorer... ---- */
  .sheet { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
    background: rgb(8 6 28 / 0.9); padding: calc(var(--st) + 12px) calc(var(--sr) + 16px) calc(var(--sb) + 12px) calc(var(--sl) + 16px); }
  .spinner { width: 46px; height: 46px; border-radius: 50%; border: 6px solid rgb(255 255 255 / 0.16); border-top-color: var(--gold); animation: spin 0.8s linear infinite; }
  #gen { z-index: 9; }
  #gen h2 { font-size: 30px; }
  .dialog { position: relative; z-index: 0; isolation: isolate; width: min(440px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 22px 22px; }
  .dialog::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-3deg); background: linear-gradient(160deg, #3a2a9a, #1a1252); border: 4px solid var(--ink);
    border-radius: 8px; box-shadow: 0 7px 0 var(--hard), 0 0 0 4px var(--gold) inset; }
  .dialog .dpic { width: 66px; height: 66px; animation: bob 2.4s ease-in-out infinite; }
  .dialog .dpic svg { width: 100%; height: 100%; fill: initial; stroke: none; }
  #wrong { z-index: 9; }
  #wrongText { font-size: 27px; line-height: 1.02; }
  /* result sheet: the item reveal */
  #result { background: radial-gradient(ellipse at 28% 48%, #5d2dd6 0%, #26166f 42%, #0d0b2e 100%);
    padding: calc(var(--st) + 10px) calc(var(--sr) + 14px) calc(var(--sb) + 10px) calc(var(--sl) + 14px); }
  .rwrap { width: min(900px, 100%); height: 100%; display: flex; gap: 22px; align-items: center; }
  .rleft { flex: 1 1 0; min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .rtitle { font-size: 38px; text-align: center; animation: pop 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  .rstage { position: relative; width: 100%; max-width: 330px; flex: 1 1 0; min-height: 120px; max-height: 330px; }
  .rays { position: absolute; inset: -6%; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, rgb(255 255 255 / 0.18) 0 6deg, transparent 6deg 17deg);
    -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 68%); mask-image: radial-gradient(circle, #000 12%, transparent 68%); }
  #previewCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .flatcard { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: 600px; }
  .flat3d { width: 62%; height: 62%; padding: 8px; background: #fff; border: 4px solid var(--ink); border-radius: 10px; box-shadow: 0 7px 0 var(--hard); animation: spin3d 4.2s linear infinite; }
  .flat3d img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .building { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
  .building span { font: 800 14px/1.1 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); }
  .rright { flex: 1 1 0; min-width: 0; min-height: 0; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 9px; text-align: center; }
  .rright > :first-child { margin-top: auto; }
  .rright > :last-child { margin-bottom: auto; }
  .rbtns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; margin-top: 4px; }
  .utip { font: 700 14px/1.22 var(--f-body); color: #ffe27a; text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); min-height: 1.2em; }
  .utip:empty { display: none; }
  /* the unlock card: a rarity item card (purple with a gold frame) */
  .ucard { position: relative; overflow: hidden; padding: 10px 12px 12px; text-align: left; border: 4px solid var(--gold); border-radius: 8px;
    background: linear-gradient(160deg, #c46bff 0%, #7b36ef 50%, #3b1c97 100%); box-shadow: 0 6px 0 var(--hard), 0 0 26px rgb(180 92 255 / 0.55); }
  .ucard::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 28%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.4), transparent);
    transform: translateX(-160%) skewX(-20deg); animation: shine 1.3s ease-out 0.5s 1 both; pointer-events: none; }
  @keyframes shine { to { transform: translateX(480%) skewX(-20deg); } }
  .uhead { font: 900 italic 17px/1 var(--f-head); letter-spacing: 0.09em; text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 2.2px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 7px; margin-top: 8px; list-style: none; }
  .chip { position: relative; z-index: 0; isolation: isolate; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 7px;
    font: 900 italic 16px/1 var(--f-head); letter-spacing: 0.03em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    animation: pop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; animation-delay: calc(var(--i, 0) * 90ms + 200ms); }
  .chip::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.82); border: 2px solid var(--ink); border-radius: 4px; }
  .chip i { width: 18px; height: 18px; border-radius: 50%; background: var(--green); border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-style: normal; flex: none; }
  .chip i svg { width: 11px; height: 11px; stroke: var(--ink); stroke-width: 4; fill: none; }
  .chip small { font: 700 12px/1 var(--f-body); letter-spacing: 0; text-transform: none; -webkit-text-stroke: 0; color: #e7dcff; }
  .chips.many { gap: 5px 6px; margin-top: 6px; }
  .chips.many .chip { font-size: 14px; padding: 3px 9px 3px 5px; }
  .chips.many .chip small { display: none; }

  /* the controller preview: the drawing, every control outlined and labelled */
  .cprev { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .cstage { position: relative; width: 100%; height: 0; padding-top: 50%; border: 4px solid var(--cyan); border-radius: 8px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #3a2a9a, #17104f); box-shadow: 0 6px 0 var(--hard), 0 0 22px rgb(25 211 255 / 0.35); }
  .cstage img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.92; }

    font: 900 italic 13px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; color: #fff; background: #0fb8e8; box-shadow: 0 2px 0 var(--hard); }

  @media (orientation: portrait) {

  }

  /* explorer prompt (orange) and optional controller redraw prompt (cyan) */

  .xhead { position: relative; z-index: 0; isolation: isolate; display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 7px 18px 8px 12px; text-align: left; }
  .xhead::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); background: linear-gradient(90deg, var(--accent), var(--accent2)); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 5px 0 var(--hard); }
  #explorer { --accent: #ff8a1f; --accent2: #ffb347; }

  .xbtns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; margin-top: 8px; }

  #ctrlPrompt .xbody { text-align: center; }
  @media (orientation: portrait) { .xbody { flex-direction: column; align-items: stretch; } .xbody .example { flex: none; height: 120px; } }

  /* ---- Play ---- */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #placeholder { position: fixed; inset: 0; background: radial-gradient(ellipse at 60% 30%, #3a1c78 0%, #11103a 45%, #05060f 100%); }
  #placeholder.plain::after { content: none; }
  #placeholder::after { content: attr(data-t); position: absolute; left: 0; right: 0; top: 55%; text-align: center; font: 800 12px/1 var(--f-body); letter-spacing: 0.3em; color: rgb(255 255 255 / 0.28); }
  #area { transition: opacity 0.4s; }
  #area.locked { opacity: 0.2; pointer-events: none; }
  #area.shot { transition: none; }
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.42; pointer-events: none; }
  #hits { position: absolute; inset: 0; touch-action: none; }
  .hit { position: absolute; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; pointer-events: none; border: 3px dashed rgb(255 255 255 / 0.62); border-radius: 16px;
    background: rgb(255 255 255 / 0.05); transition: transform 0.08s, background 0.12s; }
  .hit .lab { font: 900 italic 14px/1 var(--f-head); letter-spacing: 0.06em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.6); }
  .hit.stick { border-radius: 50%; }
  .hit.down { background: rgb(25 211 255 / 0.3); border-style: solid; border-color: #fff; transform: scale(0.97); }
  .hit.toggle.on { background: rgb(255 203 61 / 0.3); border-color: var(--gold); }
  .hit.locked { border-color: rgb(255 255 255 / 0.28); background: rgb(0 0 0 / 0.28); }
  .hit.locked .lab { opacity: 0.55; }
  .hit .lock { position: absolute; right: -9px; top: -11px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--ink); border-radius: 50%;
    background: var(--red); box-shadow: 0 3px 0 var(--hard); font-size: 12px; line-height: 1; }
  .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 4px solid var(--ink);
    background: radial-gradient(circle at 35% 30%, #fff 0%, #ffe58a 42%, #ffb000 100%); box-shadow: 0 4px 0 var(--hard); will-change: transform; }
  #sketch { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.5s; color: #e9f6ff; }
  #sketch.on { opacity: 1; }
  #sketch svg { width: 100%; height: 100%; }
  #ghost { position: absolute; z-index: 3; display: flex; align-items: center; justify-content: center; border: 3.5px dashed var(--gold); border-radius: 14px; background: rgb(255 203 61 / 0.08);
    font: 900 italic 22px/1 var(--f-head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; animation: ghostPulse 1s ease-in-out infinite alternate; }
  @keyframes ghostPulse { from { opacity: 0.55; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }
  /* Sol's controller: a sandboxed frame over the whole play area (ctrl-sandbox.js). The frame takes the touches; while it is live the DOM
     controls (#hits) hide and the drawing underneath turns faint (the tiles already sit where the drawn boxes are). #ghost (z 3) stays above. */
  #ctl { position: absolute; inset: 0; z-index: 2; pointer-events: none; }   /* an empty #ctl must never cover the DOM controls below it */
  #ctl iframe { pointer-events: auto; }
  #area.locked #ctl iframe { pointer-events: none; }   /* landing / take-off: no control (the overlay fades), as for the DOM controls */
  #area.sb #hits { display: none; }
  #area.sb #ink { opacity: 0.2; }
  #cd { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  /* a skill that is cooling down: its control greys out and a chip counts the seconds */
  .hit.cool { opacity: 0.5; filter: grayscale(0.8); }
  .cdchip { position: absolute; transform: translate(-50%, -50%); min-width: 34px; height: 34px; padding: 0 8px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--ink); border-radius: 17px;
    background: rgb(13 11 46 / 0.9); box-shadow: 0 3px 0 var(--hard); font: 900 italic 20px/1 var(--f-head); font-variant-numeric: tabular-nums; color: var(--gold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }

  /* HUD along the top */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
    padding: calc(var(--st) + 8px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px); }
  #hud .hl { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 9px; }
  #hud .hr { flex: 1 1 0; min-width: 0; display: flex; justify-content: flex-end; }
  .tools { display: flex; gap: 6px; pointer-events: auto; }
  .tool { position: relative; z-index: 0; isolation: isolate; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; color: #fff; transition: transform 0.08s; }
  .tool::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: linear-gradient(#5aa0ff, #6a35e0); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--hard); }
  .tool:active { transform: scale(0.9); }
  .tool.on { color: var(--ink); }
  .tool.on::before { background: linear-gradient(#ffe58a, var(--gold)); }

  .tool svg.fill { fill: currentColor; stroke: none; }
  .badge { position: absolute; right: -7px; top: -9px; z-index: 2; min-width: 20px; height: 20px; padding: 0 4px; border: 2px solid var(--ink); border-radius: 10px;
    background: var(--gold); color: var(--ink); font: 900 12px/16px var(--f-body); text-align: center; }
  #hud .hc { flex: none; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; max-width: 46vw; }
  .objpanel { position: relative; z-index: 0; isolation: isolate; min-width: 210px; padding: 6px 24px 8px; text-align: center; }
  .objpanel::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: linear-gradient(90deg, var(--blue2), var(--purple));
    border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 5px 0 var(--hard); }
  #obj { font: 900 italic 21px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.03em; color: #fff; -webkit-text-stroke: 2.6px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 rgb(10 6 30 / 0.5); white-space: nowrap; }
  .objbar { height: 9px; margin: 5px auto 4px; width: 100%; transform: skewX(-14deg); background: rgb(13 11 46 / 0.9); border: 2px solid var(--ink); border-radius: 2px; overflow: hidden; }
  .objbar b { display: block; height: 100%; background: linear-gradient(#ff9a7a, var(--red)); transform-origin: left; will-change: transform; }
  #status { font: 800 12px/1.1 var(--f-body); letter-spacing: 0.04em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.75); white-space: nowrap; }
  .timer { position: relative; z-index: 0; isolation: isolate; display: flex; align-items: baseline; gap: 8px; padding: 3px 16px 4px; }
  .timer::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.86); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 4px 0 var(--hard); }
  .timer .tl { font: 800 11px/1 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: #bfb5ff; }
  #clock { font: 900 italic 26px/1 var(--f-head); font-variant-numeric: tabular-nums; color: #fff; -webkit-text-stroke: 2.4px var(--ink); paint-order: stroke fill; }
  .timer.low::before { background: #c8324f; animation: lowPulse 0.55s ease-in-out infinite alternate; }
  @keyframes lowPulse { from { transform: skewX(-9deg) scale(1); } to { transform: skewX(-9deg) scale(1.07); } }
  body[data-phase="lobby"] #tAdd, body[data-phase="lobby"] #tRedraw { display: none; }
  body[data-phase="lobby"] #hud .objpanel, body[data-phase="lobby"] #hud .timer, body[data-phase="scoreboard"] #hud .hc { visibility: hidden; }
  #radar { width: 84px; height: 84px; display: block; }

  /* hold-to-see tooltip and the "locked" tip above a control */
  #tip { position: fixed; left: 0; top: 0; z-index: 7; max-width: min(300px, 62vw); padding: 8px 14px 10px; text-align: center; pointer-events: none; opacity: 0;
    transform: translate(-50%, -100%) scale(0.9); transition: opacity 0.12s, transform 0.12s; }
  #tip.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #tip::before { content: ""; position: absolute; inset: 0 0 7px 0; z-index: -1; background: linear-gradient(135deg, #3a2a9a, #1a1252); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 4px 0 var(--hard); }
  #tip::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 14px; height: 14px; margin-left: -7px; z-index: -1; transform: rotate(45deg); background: #1a1252; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
  #tip.lock::before { background: linear-gradient(135deg, #e0405f, #8f1f3a); }
  #tip.lock::after { background: #8f1f3a; }
  #tip { z-index: 7; isolation: isolate; }
  #tipTitle { display: block; font: 900 italic 17px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 2.2px var(--ink); paint-order: stroke fill; }
  #tipText { display: block; margin-top: 3px; font: 700 13px/1.2 var(--f-body); color: #fff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.7); }
  #legend { position: fixed; left: 0; right: 0; bottom: calc(var(--sb) + 10px); z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 0 calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px);
    pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  #legend.on { opacity: 1; }
  #legend .chip { animation: none; }
  #legend .chip.lk { opacity: 0.7; }

  /* the announcement chip: one short line under the objective for a big moment (boss down, a chest, a steal, my kill). The toast sits below it. */
  #chip { position: fixed; left: 50%; top: calc(var(--st) + 114px); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 2px; width: max-content; max-width: min(520px, 86vw); padding: 6px 22px 8px;
    text-align: center; pointer-events: none; isolation: isolate; transform: translate(-50%, 0); transition: opacity 0.2s, transform 0.2s; }
  #chip.off { opacity: 0; transform: translate(-50%, -12px); }
  #chip::before { content: ""; position: absolute; inset: 0 0 4px 0; z-index: -1; transform: skewX(-9deg); border: 3px solid #fff; border-radius: 10px; box-shadow: 0 4px 0 var(--hard), 0 8px 14px rgb(0 0 0 / 0.35), inset 0 3px 0 rgb(255 255 255 / 0.35);
    background: linear-gradient(180deg, #ffe36e 0%, #ffb21f 50%, #d26a06 100%); }
  #chip[data-tone="cyan"]::before { background: linear-gradient(180deg, #86dcff 0%, #2f8bff 50%, #1647c8 100%); }
  #chip[data-tone="red"]::before { background: linear-gradient(180deg, #ff8a8a 0%, #ff3048 50%, #a50d2c 100%); }
  #chip[data-tone="violet"]::before { background: linear-gradient(180deg, #d49bff 0%, #9d4dff 50%, #5a1bc4 100%); }
  #chipTitle { font: 900 italic 22px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); }
  #chipSub { font: 800 italic 14px/1 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; color: #fff; -webkit-text-stroke: 2.4px var(--ink); paint-order: stroke fill; }
  #chipSub:empty { display: none; }
  .mfx-toasts { top: calc(env(safe-area-inset-top, 0px) + 168px) !important; }   /* mischief-fx's own toasts: under the HUD, not over the timer */
  /* toast bubbles */
  #toast { position: fixed; left: 50%; top: calc(var(--st) + 168px); z-index: 6; width: max-content; max-width: min(540px, 80vw); padding: 10px 18px 13px; text-align: center; pointer-events: none;
    transform: translate(-50%, 0); transition: opacity 0.2s, transform 0.2s; isolation: isolate; }
  #toast.act { pointer-events: auto; }
  #toast.off { opacity: 0; transform: translate(-50%, -14px); pointer-events: none; }
  #toast::before { content: ""; position: absolute; inset: 0 0 5px 0; z-index: -1; transform: skewX(-6deg); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 5px 0 var(--hard); background: linear-gradient(135deg, #3a2a9a, #231a78); }
  #toast[data-kind="hint"]::before { background: linear-gradient(135deg, #ffe58a, var(--gold2)); }
  #toast[data-kind="refused"]::before { background: linear-gradient(135deg, #ff6a85, #c8324f); }

  /* wait banner, GO!, results */
  #banner { position: fixed; left: 50%; top: 50%; z-index: 5; transform: translate(-50%, -48%); width: min(440px, 62vw); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 18px 20px; text-align: center; isolation: isolate; }
  #banner::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-4deg); background: linear-gradient(160deg, rgb(58 42 154 / 0.94), rgb(23 16 79 / 0.94)); border: 4px solid var(--ink); border-radius: 8px; box-shadow: 0 7px 0 var(--hard), 0 0 0 4px var(--gold) inset; }
  #bannerTitle { font-size: 40px; color: var(--gold); -webkit-text-stroke-width: 3.6px; }

  #bannerActions { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  #bannerActions .row { gap: 12px; }
  .redo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .redo .btn { min-height: 48px; }
  .redo span { font: 700 11px/1 var(--f-body); color: #d9d0ff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); }
  #go { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
  #go b { font: 900 italic 150px/0.8 var(--f-head); text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 11px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 rgb(10 6 30 / 0.6); }

    78% { opacity: 1; transform: scale(1.05) rotate(-6deg); } 100% { opacity: 0; transform: scale(1.6) rotate(-6deg); } }
  /* the death card: big and centred while my ship is destroyed, above every mischief overlay (mfx: ink 9000, toasts 9100) */
  #dead { position: fixed; inset: 0; z-index: 9300; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.18s; }

  .dcard { position: relative; z-index: 0; isolation: isolate; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 46px 16px; transform: rotate(-2deg); }
  #dead.on .dcard { animation: deadPop 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  @keyframes deadPop { 0% { transform: rotate(-2deg) scale(0.55); opacity: 0; } 62% { transform: rotate(-2deg) scale(1.08); opacity: 1; } 100% { transform: rotate(-2deg) scale(1); opacity: 1; } }
  .dcard::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); background: linear-gradient(160deg, rgb(70 14 44 / 0.95), rgb(20 8 36 / 0.95)); border: 4px solid var(--ink); border-radius: 8px;

  #deadBy { font: 900 italic 28px/1 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; display: flex; align-items: center; gap: 10px; }
  #deadBy:empty { display: none; }
  #deadBy i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: var(--gold); flex: none; }

  #deadN { display: inline-block; min-width: 0.8em; text-align: center; font-size: 56px; color: var(--gold); -webkit-text-stroke-width: 6px; }

  #deadPts { margin-top: 2px; padding: 2px 14px 3px; border: 3px solid var(--ink); border-radius: 6px; background: var(--red); font: 900 italic 22px/1 var(--f-head); letter-spacing: 0.05em; color: #fff; -webkit-text-stroke: 2.6px var(--ink); paint-order: stroke fill; box-shadow: 0 3px 0 var(--hard); transform: skewX(-9deg); }
  #fight { position: fixed; inset: 0; z-index: 9300; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
  #fight b { font: 900 italic 64px/0.9 var(--f-head); text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 rgb(10 6 30 / 0.6); text-align: center; }
  #fight.on { animation: goPop 1.1s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  /* page-level notice (visible on every screen): "ANA WAS TAKEN · YOU ARE ANA2" */
  #notice { position: fixed; left: 50%; top: calc(var(--st) + 16px); z-index: 40; max-width: min(560px, 92vw); padding: 8px 22px 10px; text-align: center; pointer-events: none; isolation: isolate; transform: translate(-50%, 0); transition: opacity 0.2s, transform 0.2s; }
  #notice.off { opacity: 0; transform: translate(-50%, -16px); }

  /* add a button (over the game) */

  .toolbar { position: fixed; top: calc(var(--st) + 8px); left: calc(var(--sl) + 8px); right: calc(var(--sr) + 8px); z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .toolbar > * { pointer-events: auto; }

  #rotate { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; background: radial-gradient(ellipse at 50% 30%, #3b2593, #0d0b2e 70%); }
  #rotate div { font: 900 italic 34px/1.05 var(--f-head); text-transform: uppercase; letter-spacing: 0.03em; color: #fff; -webkit-text-stroke: 3.2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 rgb(10 6 30 / 0.55); }
  #rotate svg { width: 88px; height: 88px; margin-bottom: 14px; color: var(--gold); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.landscape #rotate { display: flex; } }

  @media (max-height: 440px) and (orientation: landscape) {

const tpl = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (v && v[k] != null ? v[k] : m));

// Fill the HTML from COPY: [data-copy="path"] elements get their text, a few attributes are set by hand.
function applyCopy() {
  for (const el of document.querySelectorAll("[data-copy]")) {
    const v = copyAt(el.dataset.copy);
    if (typeof v === "string") el.textContent = v;
  }
  $("name").placeholder = COPY.join.namePlaceholder;
  $("placeholder").dataset.t = COPY.placeholder;
  $("example").dataset.tag = $("expExample").dataset.tag = COPY.draw.exampleTag;
  for (const [id, key] of [["tAdd", "add"], ["tRedraw", "redraw"], ["tView", "view"], ["tTilt", "tilt"], ["tSound", "sound"]]) $(id).setAttribute("aria-label", COPY.tools[key]);
  $("camRotate").setAttribute("aria-label", COPY.draw.turnPhoto);
  $("readyBtn").textContent = COPY.wait.ready;
  $("ctrlRedraw").textContent = COPY.ctrlPrompt.redraw;
  $("ctrlRedraw").append(...usesNote());
  $("cpTitle").textContent = COPY.ctrlPrompt.title;
  $("cpSub").textContent = COPY.ctrlPrompt.sub;
  document.title = COPY.brand.join(" ");
}
function usesNote(text = COPY.result.uses) { const s = document.createElement("small"); s.textContent = " " + text; return [s]; }
// A button label with a small "· uses 1 drawing" after it.
function setBtn(el, label, note) { el.textContent = label; if (note) el.append(...usesNote(note)); }
const joinWords = (list) => {
  const l = list.slice(0, 4);
  const more = list.length > 4 ? ` ${COPY.andMore}` : "";
  if (l.length < 2) return l.join("") + more;
  if (more) return l.join(", ") + more;
  return l.slice(0, -1).join(", ") + ` ${COPY.and} ` + l[l.length - 1];
};
const ordinal = (n) => {
  const o = COPY.results.ord, m100 = n % 100, m10 = n % 10;
  return n + (m100 >= 11 && m100 <= 13 ? o.other : m10 === 1 ? o.one : m10 === 2 ? o.two : m10 === 3 ? o.few : o.other);
};

// ---------- storage (Safari private mode can throw) ----------
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("sp." + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("sp." + k, JSON.stringify(v)); } catch {} },
};
// A random token this phone keeps (localStorage "sp.device", made once) and sends with every /join: a name in use on another phone is
// not taken over, the server answers "ana2" (renamed: true). sessionStorage backs it up where localStorage is off (private mode).
const DEVICE = (() => {
  const ok = (v) => typeof v === "string" && /^[A-Za-z0-9_-]{16,64}$/.test(v);
  let d = store.get("device");
  if (!ok(d)) { try { d = sessionStorage.getItem("sp.device"); } catch { d = null; } }
  if (!ok(d)) {
    const a = new Uint8Array(18);
    try { crypto.getRandomValues(a); } catch { for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); }
    d = btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");   // 24 characters of [A-Za-z0-9_-]
    store.set("device", d);
  }
  try { sessionStorage.setItem("sp.device", d); } catch {}
  return d;
})();

// ---------- sound: the sfx singleton of render.js (guarded: it may be missing) ----------
let sfx = null;
function onRenderModule(m) {
  if (m && m.sfx) { sfx = m.sfx; applyMuted(); }
}
function sfxPlay(name, opts) { try { if (sfx && sfx.play) sfx.play(name, opts); } catch {} }
function applyMuted() {
  try { if (sfx) { if (sfx.setMuted) sfx.setMuted(S.muted); else if (sfx.mute) sfx.mute(S.muted); } } catch {}
  const icon = $("tSoundIcon");
  if (icon) icon.firstElementChild.setAttribute("href", S.muted ? "#i-mute" : "#i-sound");
  $("tSound").classList.toggle("on", !S.muted);
}
// iOS starts audio only inside a user gesture: unlock on the first touch anywhere (capture), keep trying until it works.
document.addEventListener("pointerdown", (e) => {
  try { if (sfx && sfx.unlock && sfx.unlocked !== true) sfx.unlock(); } catch {}
  const t = e.target;
  if (t && t.closest && t.closest("button, label.btn") && !t.closest("#tSound")) sfxPlay("click");
}, { capture: true });

// ---------- iOS: no pinch, no double-tap zoom, no callouts, no scrolling (except [data-scroll]) ----------
for (const ev of ["gesturestart", "gesturechange", "dblclick", "contextmenu"]) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || !(e.target.closest && e.target.closest("input, [data-scroll]"))) e.preventDefault(); }, { passive: false });

// ---------- network ----------
async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const text = await res.text();
  try { return JSON.parse(text); } catch { return { ok: res.ok, error: text.slice(0, 120) }; }
}
// Messages for one action go out in order (a quick tap must never arrive as up-before-down); different actions
// stay parallel. An axis keeps one request in flight and sends only its latest value after it.
const chains = {};
function sendInput(action, down) {
  const body = JSON.stringify({ type: "input", player: S.player, action, down });
  chains[action] = (chains[action] || Promise.resolve()).then(() => fetch("/input", { method: "POST", headers: { "content-type": "application/json" }, body })).catch(() => {});
}
function postAxis(a, axis) {
  if (a.busy) { a.dirty = true; return; }
  a.busy = true; a.dirty = false;
  fetch("/input", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "axis", player: S.player, axis, x: a.x, y: a.y }) })
    .catch(() => {}).finally(() => { a.busy = false; if (a.dirty) postAxis(a, axis); });
}
const axes = {};             // axis -> { x, y, sentAt, timer, busy, dirty }
function sendAxis(axis, x, y, force) {
  const a = axes[axis] || (axes[axis] = { x: 0, y: 0, sentAt: 0, timer: 0 });
  a.x = Math.round(x * 1000) / 1000; a.y = Math.round(y * 1000) / 1000;
  const flush = () => { a.timer = 0; a.sentAt = performance.now(); postAxis(a, axis); };
  const wait = AXIS_MS - (performance.now() - a.sentAt);
  if (force || wait <= 0) { clearTimeout(a.timer); flush(); }
  else if (!a.timer) a.timer = setTimeout(flush, wait);
}

// ---------- screens and steps ----------
const SCREENS = ["join", "draw", "play"];
const SHEETS = ["gen", "wrong", "result", "explorer", "ctrlPrompt", "resultsSheet", "redrawMenu"];
function show(screen) {
  S.screen = screen;
  for (const id of SCREENS) $(id).classList.toggle("hidden", id !== screen);
  syncLandscape();
  syncRendering();
  syncDrawing();
}
// The draw screen is opaque: the 3D view behind it is not drawn (battery, heat, a steadier frame rate when we come back).

  if (own) return own;
  if (S.entity && V.worldOf(S.entity.type) === w) return S.entity;
  return w === "space" ? { type: "ship", verbs: [], unlocked: [] } : { type: "person", verbs: ["jump", "takeoff"], unlocked: [] };
}

function iconHtml(symbol, spin) {   // static markup only: the header icon, a CSS 3D spinning stack of the colour icon, or a still one
  if (!spin) return `<div class="still"><svg viewBox="0 0 64 64" class="big"><use href="#${symbol}"/></svg></div>`;
  return `<div class="spin3d">${[-6, -3, 0, 3, 6].map((z) => `<svg viewBox="0 0 64 64" style="transform:translateZ(${z}px)"><use href="#${symbol}"/></svg>`).join("")}</div>`;
}
function lineFor(kind) {         // the controller steps: which buttons the drawing on the ship / explorer calls for
  if (KINDS[kind].entity) return "";
  const K = COPY.kinds[kind];
  const e = entityFor(KINDS[kind].world);
  const verbs = (e.unlocked || []).map((u) => u.verb);
  if (!verbs.length) return K.canNone;
  return tpl(K.can, { list: joinWords(verbs.map((v) => (COPY.skills[v] || v).toUpperCase())) });
}
function paintDrawChrome() {
  const kind = DR.kind, K = COPY.kinds[kind], head = DR.redraw && K.redraw ? K.redraw : K;
  $("drawTitle").textContent = head.title;
  $("drawSub").textContent = "— " + head.sub;
  $("drawHint").textContent = K.hint;
  setText($("drawLine"), lineFor(kind));
  const ex = kind === "ship" ? "ship" : kind === "explorer" ? "explorer" : "controller";
  $("example").innerHTML = PE ? PE.exampleSvg(ex, K.example) : "";
  $("camHint").textContent = K.photoHint;
  $("padHint").textContent = COPY.draw.padHint[kind];
  $("useDefault").textContent = K.skip;
  $("useDefault").classList.toggle("hidden", DR.redraw);
  $("drawCancel").classList.toggle("hidden", !DR.redraw);
  $("drawIcon").innerHTML = kind === "ship" ? iconHtml("c-ship", true) : kind === "explorer" ? iconHtml("c-astro", true) : iconHtml("c-pad", false);
}

// opts: redraw (a redraw of something I already have: header says REDRAW, CANCEL replaces SKIP), photo (start in photo mode), mode
function enterDraw(kind, { redraw = false, photo = false, mode = null } = {}) {
  releaseAll();
  closeSheets();
  clearTimeout(specTimer); clearTimeout(genTimer);
  Object.assign(DR, { kind, redraw, busy: false, photo: null, cache: null });
  padSketch.strokes = []; padSketch.version++;
  $("padWrap").classList.remove("has-ink");
  latest[KINDS[kind].wire] = null;
  $("draw").dataset.kind = kind;
  paintDrawChrome();
  show("draw");
  setStep(kind === "ship" ? "ship" : kind === "controller" ? "controller" : kind);
  resetPhotoUi();
  setDrawMode(mode || (photo ? "photo" : S.drawMode));
  updateCounters();
  sfxPlay("pop");
}
function setDrawMode(mode) {
  DR.mode = mode; S.drawMode = mode; store.set("drawMode", mode);
  DR.cache = null;
  for (const b of $("drawSeg").children) b.classList.toggle("on", b.dataset.mode === mode);
  const draw = mode === "draw";
  $("padWrap").classList.toggle("hidden", !draw);
  $("camCard").classList.toggle("hidden", draw);
  for (const id of ["undo", "clear", "done"]) $(id).classList.toggle("hidden", !draw);
  setDrawStatus(draw ? (padSketch.strokes.length ? COPY.draw.tapDone : COPY.draw.ready) : (DR.photo ? COPY.draw.photoFound : COPY.draw.readyPhoto));
  syncLandscape();
  if (draw) requestAnimationFrame(sizePad);
}
$("drawSeg").onclick = (e) => { const b = e.target.closest("button"); if (b && b.dataset.mode) setDrawMode(b.dataset.mode); };

// The controller drawing is the whole landscape play area: its pad has the play area's shape, so nothing is stretched later.
function sizePad() {
  const wrap = $("padWrap"), pad = $("drawPad");
  if (wrap.classList.contains("hidden") || S.screen !== "draw") return;
  const r = wrap.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  let w = r.width, h = r.height;
  if (!KINDS[DR.kind].entity) { const A = playAspect(); h = w / A; if (h > r.height) { h = r.height; w = h * A; } }
  Object.assign(pad.style, { width: w + "px", height: h + "px", left: (r.width - w) / 2 + "px", top: (r.height - h) / 2 + "px" });
  padSketch.resize();
}
if (window.ResizeObserver) new ResizeObserver(() => sizePad()).observe($("padWrap"));
const padAspectNow = () => { const r = $("drawPad").getBoundingClientRect(); return r.width / Math.max(1, r.height); };

function onPadChange() {
  const has = padSketch.strokes.length > 0;
  $("padWrap").classList.toggle("has-ink", has);
  clearTimeout(specTimer);
  if (!has) return setDrawStatus(COPY.draw.ready);
  setDrawStatus(COPY.draw.tapDone);
  specTimer = setTimeout(sendSpeculative, SPECULATIVE_MS);   // a pause after the last stroke sends the drawing early
}
$("undo").onclick = () => padSketch.undo();
$("clear").onclick = () => padSketch.clear();

// The drawing as it would be sent: { key, source, image (PNG, dark ink on white, <= 512 px), ink (controller overlay), regions }.
function drawingNow() {
  const K = KINDS[DR.kind];
  if (DR.mode === "photo") {
    const p = DR.photo;
    if (!p) return null;
    return { key: p.key, source: "photo", image: p.rendered.image, ink: p.rendered.ink, regions: K.entity ? null : p.rendered.regions };
  }
  const strokes = padSketch.strokes;
  if (!strokes.length) return null;
  const key = "draw:" + padSketch.version;
  if (DR.cache && DR.cache.key === key) return DR.cache;
  const aspect = padAspectNow();
  let d;
  if (K.entity) d = { key, source: "draw", image: strokesPNG(strokes, aspect, { crop: true }), ink: null, regions: null };
  else d = {
    key, source: "draw", image: strokesPNG(strokes, aspect),
    ink: strokesPNG(strokes, aspect, { bg: null, color: "#fff", px: 1024 }),
    regions: inkRegionsOf(strokesCanvas(strokes, aspect, { bg: null, color: "#fff", px: IMAGE_PX })),
  };
  return (DR.cache = d);
}
// A free early call: most of the time the answer is ready before the player taps DONE.
function sendSpeculative() {
  const d = drawingNow();
  if (!d) return;
  const kind = DR.kind, wire = KINDS[kind].wire;
  const spec = generate(wire, d.image, { source: d.source, speculative: true, key: d.key, inkRegions: d.regions });
  setDrawStatus(COPY.draw.reading);
  spec.promise.then((r) => {
    if (latest[wire] !== spec || DR.kind !== kind || S.screen !== "draw") return;
    setDrawStatus(isWrong(kind, r) ? COPY.draw.mismatch[kind] : DR.mode === "photo" ? COPY.draw.looksGoodPhoto : r.ok ? COPY.draw.looksGood : COPY.draw.tapDone);
  });
}

// ---- photo mode ----
function resetPhotoUi() {
  DR.photo = null;
  $("camPreview").classList.add("hidden"); $("camActions").classList.add("hidden"); $("camIntro").classList.remove("hidden");
}
function showPhoto() {
  $("camPreview").src = DR.photo.rendered.image;
  $("camPreview").classList.remove("hidden"); $("camActions").classList.remove("hidden"); $("camIntro").classList.add("hidden");
  setDrawStatus(COPY.draw.photoFound);
  sendSpeculative();   // a photo is sent as soon as it is processed; USE THIS PHOTO waits for that answer
}
async function onDrawPhoto(file) {
  if (!file) return;
  const kind = DR.kind;
  setDrawStatus(COPY.draw.readingPhoto);
  let p;
  try {
    const analysis = await analysePhoto(file);
    p = { analysis, rendered: renderPhoto(analysis) };
    window.__lastPhotoMs = analysis.ms;
  } catch (e) { return setDrawStatus(e && e.message === COPY.draw.noInk ? COPY.draw.noInk : COPY.draw.badPhoto); }
  if (DR.kind !== kind || S.screen !== "draw") return;
  DR.photo = { ...p, key: "photo:" + (++reqSeq) };
  showPhoto();
}
$("camInput").onchange = (e) => { onDrawPhoto(e.target.files[0]); e.target.value = ""; };
$("camInput2").onchange = (e) => { onDrawPhoto(e.target.files[0]); e.target.value = ""; };
$("camRotate").onclick = () => {
  if (!DR.photo) return;
  DR.photo.analysis.turns = (DR.photo.analysis.turns + 1) % 4;
  DR.photo.rendered = renderPhoto(DR.photo.analysis);
  DR.photo.key = "photo:" + (++reqSeq);
  showPhoto();
};
$("camUse").onclick = () => { if (DR.photo) commit(); };
$("done").onclick = () => { if (!padSketch.strokes.length) return setDrawStatus(COPY.draw.drawFirst); commit(); };

// ---- DONE / USE THIS PHOTO: wait for the early answer, then confirm it (a cache hit that costs 1 drawing) ----
async function commit({ anyway = false } = {}) {
  if (DR.busy) return;
  const d = drawingNow();
  if (!d) return setDrawStatus(COPY.draw.drawFirst);
  DR.busy = true;
  clearTimeout(specTimer);
  const kind = DR.kind, wire = KINDS[kind].wire;
  showGenSoon(kind);
  const spec = latest[wire] && latest[wire].key === d.key ? latest[wire] : null;
  let first = null;
  if (spec) { first = await spec.promise; if (latest[wire] !== spec) { DR.busy = false; hideGen(); return; } }
  // the early answer already says it is the wrong kind of drawing: nothing is committed, ask the player
  if (!anyway && first && isWrong(kind, first)) { DR.busy = false; hideGen(); return showWrong(kind, first); }
  if (first && !first.ok && first.looksLike === "nothing") { DR.busy = false; return showGenError(first.message); }   // a blank page: refused for free
  const res = await generate(wire, d.image, { source: d.source, speculative: false, key: d.key, inkRegions: d.regions, anyway }).promise;
  DR.busy = false;
  if (!isLatest(wire, res)) { hideGen(); return; }           // superseded by a newer request
  if (!anyway && isWrong(kind, res)) { hideGen(); return showWrong(kind, res); }
  const ok = res.ok && (KINDS[kind].entity ? !!res.entity : !!res.layout && !C.CHECKS.layout(res.layout).length);
  if (!ok) return showGenError(res.message || COPY.errors.generic);
  hideGen();
  onCommitted(kind, res, d);
}
function onCommitted(kind, res, d) {
  if (KINDS[kind].entity) {
    S.drawn[kind === "ship" ? "ship" : "explorer"] = res.entity;
    if (kind === "ship") store.set("shipDone", true);
    showResult(kind, { entity: res.entity, image: d.image });
  } else {
    // The answer carries the whole pad as HTML (Sol's template, or Sol's own): it is mounted when the play screen opens. No HTML (an
    // old server): the plain controls are built from the layout, as before.
    const pad = padOf(res);
    const lay = pad && pad.padLayout && !C.CHECKS.layout(pad.padLayout).length ? pad.padLayout : res.layout;
    applyLayout(lay, d.ink, {});
    S.pad = pad; S.padFailed = false;
    S.legendPending = true;
    showResult(kind, { layout: S.layout, ink: d.ink });
  }
}
// "reading your ship…" only shows when the answer takes a moment (a cache hit would just flash it)
function showGenSoon(kind) { clearTimeout(genTimer); genTimer = setTimeout(() => showGen(kind), 250); }
function showGen(kind) {
  $("gen").classList.remove("hidden"); $("genSpin").classList.remove("hidden");
  $("genTitle").textContent = COPY.gen.reading[kind] || COPY.gen.reading.ship;
  setText($("genErr"), ""); $("genActions").classList.add("hidden");
}
function showGenError(msg) {
  clearTimeout(genTimer);
  $("gen").classList.remove("hidden"); $("genSpin").classList.add("hidden");
  $("genTitle").textContent = COPY.gen.failed; setText($("genErr"), msg); $("genActions").classList.remove("hidden");
}
function hideGen() { clearTimeout(genTimer); $("gen").classList.add("hidden"); }
$("genRetry").onclick = () => { hideGen(); commit(); };
$("genBack").onclick = () => hideGen();   // back to the drawing, nothing was lost

// ---- the wrong kind of drawing ----
function showWrong(kind, res) {
  let text, icon;
  if (KINDS[kind].entity) {
    text = tpl(COPY.wrong.toController, { what: COPY.what[kind === "ship" ? "ship" : "explorer"] });
    icon = "#c-pad";
  } else {
    const T = COPY.wrong.things, thing = (res && res.thing && T[res.thing]) || (KINDS[kind].world === "planet" ? T.explorer : T.ship);
    text = tpl(COPY.wrong.toEntity, { thing });
    icon = KINDS[kind].world === "planet" ? "#c-astro" : "#c-ship";
  }
  $("wrongText").textContent = text;
  $("wrongIcon").setAttribute("href", icon);
  $("wrong").classList.remove("hidden");
  sfxPlay("pop");
}
function resetDrawing() {        // REDRAW on the warning: free, nothing was committed
  clearTimeout(specTimer);
  latest[KINDS[DR.kind].wire] = null;
  DR.cache = null;
  resetPhotoUi();
  padSketch.clear();
  setDrawStatus(DR.mode === "draw" ? COPY.draw.ready : COPY.draw.readyPhoto);
}
$("wrongRedraw").onclick = () => { $("wrong").classList.add("hidden"); resetDrawing(); };
$("wrongUse").onclick = () => { $("wrong").classList.add("hidden"); commit({ anyway: true }); };

// ---- leaving the drawing steps ----
$("useDefault").onclick = () => {
  if (DR.kind === "ship" || DR.kind === "controller") applyLayout(defaultLayout(), defaultInk(), {});   // plain ship, default buttons
  backToGame();
};
$("drawCancel").onclick = () => backToGame();
function backToGame() {
  closeSheets();
  if (!S.layout) applyLayout(defaultLayout(), defaultInk(), {});
  enterPlay();
}
function startRedraw(kind) {     // from the wait banner, the redraw menu or a hint: a full redraw, 1 drawing
  if (noneLeft()) return;
  enterDraw(kind, { redraw: true });
}

// ============================================================================================================
// Result sheets: the 3D ship / explorer with its unlock card, and the controller with every control labelled.
// ============================================================================================================
let previewApi = null, previewObj = null, previewToken = 0;
function getPreview() {      // ONE preview renderer (a second WebGL context) for the whole session, made the first time it is needed
  if (!previewApi) previewApi = RM.then((m) => (m && typeof m.createEntityPreview === "function" ? m.createEntityPreview({ canvas: $("previewCanvas"), quality: "phone" }) : null))
    .catch((e) => (console.warn("3D preview unavailable", e), null)).then((p) => (previewObj = p));
  return previewApi;
}
function previewOff() {      // the sheet is hidden: stop rendering, drop the model
  previewToken++;
  if (previewObj) { try { previewObj.setVisible(false); if (previewObj.clear) previewObj.clear(); } catch {} }
}
const nextFrame = () => new Promise((ok) => requestAnimationFrame(() => ok()));
async function show3D(image, type) {
  const token = ++previewToken;
  $("building").classList.remove("hidden");
  $("flatCard").classList.add("hidden");
  $("previewCanvas").classList.remove("hidden");
  const pv = await getPreview();
  if (token !== previewToken) return;
  if (!pv) return showFlat(image);
  let res = null;
  try {
    await nextFrame();                 // the sheet has its size now
    if (token !== previewToken) return;
    pv.setVisible(true);
    res = await pv.show({ image, kind: type || "ship", color: S.color });
  } catch (e) { console.warn("3D preview failed", e); }
  if (token !== previewToken) return;
  if (!res || res.ok === false) return showFlat(image);   // inflate.js did not load: the flat drawing on a spinning card
  $("building").classList.add("hidden");
}
function showFlat(image) {
  $("building").classList.add("hidden");
  $("previewCanvas").classList.add("hidden");
  $("flatImg").src = image;
  $("flatCard").classList.remove("hidden");
}
function replay(el) { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; }

// What the entity can do: what its type does by itself, then every skill the drawing unlocked (with the part that unlocked it).
const shortPart = (part, verb) => { const p = String(part || "").trim().toLowerCase(); return p && p !== "drawing" && p !== verb ? p.slice(0, 18) : ""; };
function skillItems(entity) {
  const drawn = (entity.unlocked || []).map((u) => ({ word: COPY.skills[u.verb] || u.verb, part: shortPart(u.part, u.verb), verb: u.verb }));
  const words = new Set(drawn.map((d) => d.word));
  const innate = (COPY.innate[entity.type] || []).filter((w) => !words.has(w)).map((w) => ({ word: w, part: "", verb: null }));
  return [...innate, ...drawn];
}
const itemText = (it) => (it.part ? `${it.word} (${it.part})` : it.word);
function entityTip(kind, entity) {
  const verbs = entity.verbs || [];
  if (DR.redraw && S.layout) {     // a redraw in the middle of the round: say which new powers still need a button
    const missing = (entity.unlocked || []).filter((u) => !layoutHas(u.verb)).map((u) => (COPY.skills[u.verb] || u.verb).toUpperCase());
    if (missing.length) return tpl(COPY.result.tips.newButtons, { list: joinWords(missing) });
  }
  const T = COPY.result.tips;
  if (kind === "ship") return !V.WEAPONS.some((w) => verbs.includes(w)) ? T.noWeapon : !verbs.includes("land") ? T.noLand : "";
  const dig = verbs.includes("dig"), drill = verbs.includes("drill");
  return !dig && !drill ? T.noDigDrill : !dig ? T.noDig : !drill ? T.noDrill : "";
}
function buildUnlockCard(entity, kind, rc) {
  const what = COPY.what[kind === "ship" ? "ship" : "explorer"];
  const items = skillItems(entity);
  const card = $("unlockCard");
  card.replaceChildren();
  const head = document.createElement("div"); head.className = "uhead"; head.textContent = rc.card;
  const ul = document.createElement("ul"); ul.className = "chips" + (items.length > 5 ? " many" : "");
  items.forEach((it, i) => {
    const li = document.createElement("li"); li.className = "chip"; li.style.setProperty("--i", i);
    li.innerHTML = '<i><svg viewBox="0 0 24 24"><use href="#i-check"/></svg></i>';
    li.append(it.word);
    if (it.part) { const s = document.createElement("small"); s.textContent = `(${it.part})`; li.append(s); }
    ul.append(li);
  });
  card.append(head, ul);
  // "Your ship can: fly, shoot (cannon), boost (flames)", for screen readers and tests
  card.dataset.text = tpl(COPY.result.sentence, { what, list: items.map(itemText).join(", ") });
  card.setAttribute("aria-label", card.dataset.text);
  setText($("unlockTip"), entityTip(kind, entity));
}

// ---- locked skills: a control whose action the current ship / explorer cannot do ----
// → null (usable, or not a skill at all: sticks, movement), or { verb, key, part?, what? } for COPY.locked
function lockInfo(action, entity) {
  const verb = C.normaliseAction(action), spec = V.VERBS[verb];
  if (!spec || !entity || !Array.isArray(entity.verbs) || entity.verbs.includes(verb)) return null;
  const w = V.worldOf(entity.type);
  if (verb === "jump" && (entity.type === "car" || entity.type === "bike")) return { verb, key: "noJump" };
  if (verb === "drive" && w === "planet") return { verb, key: "drive" };
  if (!spec.modes.includes(w)) return { verb, key: w === "space" ? "planetOnly" : "spaceOnly" };
  return { verb, key: "tip", part: V.PARTS[verb] || COPY.locked.partFallback, what: COPY.what[w === "space" ? "ship" : "explorer"] };
}
const lockText = (name, info, what) => tpl(COPY.locked[info.key], { name, part: info.part, what: info.what || what });
const controlName = (b) => String(b.label || b.action).toUpperCase();

function buildCtrlPreview(kind, layout, ink) {
  const w = KINDS[kind].world, ent = entityFor(w), what = COPY.what[w === "space" ? "ship" : "explorer"];
  const host = $("ctrlPreview"); host.replaceChildren();
  const stage = document.createElement("div"); stage.className = "cstage"; stage.style.paddingTop = (100 / playAspect()).toFixed(2) + "%";   // the drawing has the play area's shape
  if (ink) { const img = new Image(); img.alt = ""; img.src = ink; stage.append(img); }
  const locked = [];
  for (const b of layout.buttons) {
    const info = lockInfo(b.action, ent), name = controlName(b);
    const box = document.createElement("div");
    box.className = "cbox" + (b.type === "stick" ? " stick" : "") + (info ? " lock" : "");
    Object.assign(box.style, { left: b.x * 100 + "%", top: b.y * 100 + "%", width: b.w * 100 + "%", height: b.h * 100 + "%" });
    const tag = document.createElement("span"); tag.className = "ctag";
    if (info) { tag.textContent = "🔒 " + name; locked.push(lockText(name, info, what)); }
    else { tag.append(name + " "); const ck = document.createElement("b"); ck.textContent = "✓"; tag.append(ck); }
    box.append(tag); stage.append(box);
  }
  host.append(stage);
  const list = $("ctrlList"); list.replaceChildren();
  const lines = locked.length > 2 ? [locked[0], tpl(COPY.result.controller.more, { n: locked.length - 1, what })] : locked;
  for (const t of lines) { const li = document.createElement("li"); li.textContent = t; list.append(li); }
  if (!locked.length) { const li = document.createElement("li"); li.className = "ok"; li.textContent = "✓ " + tpl(COPY.result.controller.allWork, { what }); list.append(li); }
  setText($("unlockTip"), "");
}

function showResult(kind, data) {
  const R = $("result"), isEntity = KINDS[kind].entity;
  S.resultKind = kind;
  R.dataset.kind = kind; R.dataset.group = isEntity ? "entity" : "controller";
  closeSheets("result");
  R.classList.remove("hidden");

  $("unlockCard").classList.toggle("hidden", !isEntity);

  const rc = COPY.result[isEntity ? (kind === "ship" ? "ship" : "explorer") : "controller"];
  $("resultTitle").textContent = rc.title; replay($("resultTitle"));
  if (isEntity) {

  $("resultNext").textContent = next;

};

// ---------- drawing budget: 5 finished drawings per world per round ----------
const world = () => (S.lastMode === "planet" ? "planet" : "space");
const leftHere = () => (S.left[world()] ?? 5);
function setLeft(left) {
  if (!left) return;
  const changed = left.space !== S.left.space || left.planet !== S.left.planet;
  S.left = { space: left.space, planet: left.planet };

    const list = sampleStrokes(name, padAspectNow());
    padSketch.add(list);
    return list.length;
  },
  // The NEXT /generate answer carries looksLike: value ("controller" | "entity"): the wrong-drawing warning without server support.
  looksLike(value) { forceLooks = value || null; },
  // v1.2. Run the handlers the server's messages reach, for screenshots and tests:
  //   mischief({ kind: "emp"|"inkbomb"|"tractor"|"mine"|"decoy", seconds, from, dir, points, victim })   a rival's mischief hits me
  //   announce("⚡ me scrambled bob's buttons")   a kill-feed line     cooldown("emp", 12)   a skill of mine is cooling down
  //   dead("bob", 3)   the death card for 3 s      html(html, "controller"|"html")   mount my own controller HTML (kind "html" swaps in place)
  //   ctl()   what the sandboxed controller is doing: mounted, live, source, controls, stats...
  mischief(msg = {}) { onMischief({ type: "mischief", player: S.player, from: "bob", seconds: 5, ...msg }); },
  announce(text, big = false) { onAnnounce({ type: "announce", text, big }); },
  cooldown(verb = "emp", seconds = 12) { onCooldown({ type: "cooldown", player: S.player, verb, seconds }); },
  dead(killer = "bob", seconds = 3) { noteKiller(killer); death.test = { until: performance.now() + seconds * 1000 }; },
  html(html, kind = "controller", padLayout = null) {
    let lay = padLayout || (kind === "html" && S.pad && S.pad.padLayout) || null;
    if (!lay) {     // the actions the HTML uses, laid out in a grid (only their names matter for the page)
      const acts = [...new Set([...String(html).matchAll(/data-(?:action|stick)="([^"]+)"/g)].map((x) => C.normaliseAction(x[1])))];
      lay = { source: "test", buttons: acts.map((a, i) => ({ type: C.STICKS.includes(a) ? "stick" : "button", action: a, label: a.toUpperCase(), x: (i % 4) * 0.24, y: i < 4 ? 0.3 : 0.65, w: 0.2, h: 0.3 })) };
    }
    onGenerated({ type: "generated", player: S.player, kind, html, controls: [], htmlSource: kind === "html" ? "model" : "template", padLayout: lay, layout: lay });
    return S.ctl ? S.ctl.sig : null;
  },
  ctl() {
    const c = S.ctl;
    return { mounted: !!c, live: !!(c && c.live), source: c ? c.source : null, usingFallback: !!(c && c.handle.usingFallback), actions: c ? c.actions : [],
      controls: c ? c.handle.controls() : [], stats: c ? c.handle.stats() : null, hitsHidden: $("area").classList.contains("sb"), cool: { ...S.cool },
      pad: S.pad ? { source: S.pad.source, bytes: S.pad.html.length, bad: !!S.pad.bad } : null, padFailed: S.padFailed, drawingDown: S.drawingDown, empMap };
  },
  // Jump to a screen with demo data, for screenshots: join, ship, controller, explorerDraw, planetController, shipResult, explorerResult,
  // controllerResult, wrong (the ship step with the warning), wait/play (the play screen), explorer (the planet prompt), ctrlPrompt, results.
  go(step) {
    const img = (n) => strokesPNG(sampleStrokes(n, 1.6), 1.6, { crop: true });
    switch (step) {
      case "join": show("join"); setStep("join"); break;
      case "ship": case "controller": case "planetController": enterDraw(step); break;
      case "explorerDraw": enterDraw("explorer"); break;
      case "shipResult": S.drawn.ship = DEMO.ship; showResult("ship", { entity: DEMO.ship, image: img("ship") }); break;
      case "explorerResult": S.drawn.explorer = DEMO.explorer; showResult("explorer", { entity: DEMO.explorer, image: img("car") }); break;
      case "controllerResult": if (!S.layout) applyLayout(defaultLayout(), defaultInk(), {}); showResult("controller", { layout: S.layout, ink: S.inkBase }); break;
      case "wrong": enterDraw("ship"); showWrong("ship", { looksLike: "controller" }); break;
      case "wait": case "play": backToGame(); break;
      case "explorer": backToGame(); openExplorer(); break;
      case "ctrlPrompt": backToGame(); openCtrlPrompt(); break;
      case "results": backToGame(); closeSheets("resultsSheet"); renderResults({ round: 1, clock: 8, result: { reason: "chests", winner: S.player, scores: [[S.player, 4500], ["ana", 3000], ["bo", 1500], ["cy", 200]] }, scores: [] });
        $("resultsSheet").classList.remove("hidden"); setStep("results"); break;
    }
    return S.step;
  },
};

// ---------- start ----------
paintExplorerSheet();
applyMuted();
updateCounters();
// A refresh rejoins with the same name and keeps the drawings.
const saved = store.get("player");
const savedLayout = store.get("layout");
if (savedLayout && !C.CHECKS.layout(savedLayout).length) { S.layout = savedLayout; S.inkBase = store.get("inkBase"); S.inkButtons = store.get("inkButtons") || {}; }
setStep("join");
if (saved) { $("name").value = saved; join(saved); } else show("join");
</script>
