<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0d0b2e">
<meta name="apple-mobile-web-app-title" content="Space Party">
<link rel="manifest" href="controller.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Space Party</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800;1,900&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Space Party phone, Fortnite style (v1.1). Orange = ship / explorer drawing, cyan = controller drawing. ===== */
  :root {
    --navy: #0d0b2e; --blue: #2b7bff; --blue2: #1f5dff; --purple: #8a3dff; --purple2: #b45cff;
    --gold: #ffcb3d; --gold2: #ffb000; --green: #4ade5a; --red: #ff3b5c; --orange: #ff8a1f; --cyan: #19d3ff;
    --ink: #120a2e; --hard: #0a0830;
    --accent: var(--orange); --accent2: #ffb347; --glow: rgb(255 138 31 / 0.5);
    --me: #22d3ee;
    --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px);
    --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px);
    --f-head: "Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", Impact, system-ui, sans-serif;
    --f-body: "Barlow", -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: var(--navy); color: #fff;
    font: 600 15px/1.25 var(--f-body); -webkit-font-smoothing: antialiased; }
  input { -webkit-user-select: text; user-select: text; font-family: inherit; }
  /* :where() keeps this reset at zero specificity, so .btn styles also win on the <label class="btn"> photo buttons */
  :where(button, label.btn) { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; }
  svg.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  svg.big { width: 100%; height: 100%; }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; }
  .area { position: fixed; top: var(--st); right: var(--sr); bottom: var(--sb); left: var(--sl); }

  /* Heading text: heavy condensed italic caps, white with a dark outline and a hard shadow */
  .hd { font-family: var(--f-head); font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: 0.02em; line-height: 0.95; color: #fff;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 rgb(10 6 30 / 0.55); }
  .status { font: 700 13px/1.15 var(--f-body); color: #fff; text-align: center; text-shadow: 0 2px 0 rgb(10 6 30 / 0.7); min-height: 1.15em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .counter { display: flex; justify-content: center; }

  /* Pop-in and press motion (transform and opacity only) */
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 62% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .pop { animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin3d { to { transform: rotateY(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }

  /* ---- Buttons: slanted, gold = the main action, hard bottom shadow ---- */
  .btn { position: relative; z-index: 0; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px;
    font-family: var(--f-head); font-weight: 900; font-style: italic; font-size: 22px; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--ink); text-align: center; white-space: nowrap; transition: transform 0.08s; }
  .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); border: 3px solid var(--ink); border-radius: 5px;
    background: linear-gradient(#ffe58a, var(--gold) 45%, var(--gold2)); box-shadow: 0 6px 0 var(--hard); transition: transform 0.08s, box-shadow 0.08s; }
  .btn:active { transform: scale(0.94); }
  .btn:active::before { box-shadow: 0 2px 0 var(--hard); }
  .btn.big { min-height: 64px; font-size: 28px; padding: 0 34px; }
  .btn.sm { min-height: 48px; font-size: 17px; padding: 0 16px; }
  .btn.sq { padding: 0; width: 52px; }
  .btn small { font: 800 0.62em/1 var(--f-body); font-style: normal; letter-spacing: 0.05em; text-transform: none; opacity: 0.9; }
  .btn.blue, .btn.purple, .btn.red, .btn.green, .btn.cyan, .btn.orange, .btn.ghost { color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); }
  .btn.blue::before { background: linear-gradient(#5aa0ff, var(--blue) 50%, var(--blue2)); }
  .btn.purple::before { background: linear-gradient(#c98aff, var(--purple2) 50%, var(--purple)); }
  .btn.red::before { background: linear-gradient(#ff8095, var(--red) 55%, #d81f45); }
  .btn.green::before { background: linear-gradient(#8dff9a, var(--green) 55%, #1fa83a); }
  .btn.cyan::before { background: linear-gradient(#7aeaff, var(--cyan) 55%, #0aa7d6); }
  .btn.orange::before { background: linear-gradient(#ffc06a, var(--orange) 55%, #e06a00); }
  .btn.ghost::before { background: rgb(13 11 46 / 0.82); }
  .btn:disabled, .btn.empty { opacity: 0.5; filter: grayscale(0.5); }
  label.btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .skip { align-self: flex-start; min-height: 44px; padding: 6px 4px; font: 800 14px/1.15 var(--f-body); color: #fff; text-align: left;
    text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: rgb(255 255 255 / 0.5); text-shadow: 0 2px 0 rgb(10 6 30 / 0.7); }
  .skip:active { opacity: 0.7; }

  /* Segmented PHOTO | DRAW toggle */
  .seg { position: relative; z-index: 0; isolation: isolate; display: inline-flex; padding: 3px; gap: 3px; flex: none; align-self: center; }
  .seg::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.88); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--hard); }
  .seg button { position: relative; z-index: 0; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; color: #fff;
    font: 900 italic 17px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; }
  .seg button::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); border-radius: 4px; }
  .seg button.on { color: var(--ink); }
  .seg button.on::before { background: linear-gradient(#ffe58a, var(--gold)); }

  /* ---- Join ---- */
  #join { display: flex; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(ellipse at 18% 12%, #4f2dbb 0%, #241568 42%, #0d0b2e 100%);
    padding: calc(var(--st) + 14px) calc(var(--sr) + 18px) calc(var(--sb) + 14px) calc(var(--sl) + 18px); }
  #join::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgb(255 255 255 / 0.035) 0 22px, transparent 22px 64px); pointer-events: none; }
  .jwrap { position: relative; width: min(420px, 100%); display: flex; flex-direction: column; gap: 16px; }
  .fsbtn { position: absolute; z-index: 2; top: calc(var(--st) + 10px); right: calc(var(--sr) + 10px); display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 11px;
    border: 3px solid var(--ink); border-radius: 8px; background: rgb(13 11 46 / 0.85); box-shadow: 0 3px 0 var(--hard); color: #fff; font: 900 italic 15px/1 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; }
  .fsbtn:active { transform: scale(0.94); }
  .jleft { display: flex; flex-direction: column; gap: 16px; }
  .logo { text-align: center; line-height: 0.82; transform: rotate(-4deg); margin-bottom: 4px; }
  .logo span { display: block; font: 900 italic 78px/0.86 var(--f-head); text-transform: uppercase; letter-spacing: 0.01em;
    -webkit-text-stroke: 11px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 rgb(10 6 30 / 0.7); }
  .logo .l1 { color: var(--gold); }
  .logo .l2 { color: #fff; margin-top: 2px; }
  .jform { display: flex; flex-direction: column; gap: 14px; }
  #name { width: 100%; height: 60px; padding: 0 16px; border: 4px solid var(--ink); border-radius: 6px; outline: none; text-align: center;
    font: 900 italic 26px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.05em; color: #fff; background: rgb(13 11 46 / 0.88);
    box-shadow: 0 6px 0 var(--hard), inset 0 0 0 2px rgb(255 255 255 / 0.12); }
  #name::placeholder { color: rgb(255 255 255 / 0.42); }
  #name:focus { border-color: var(--gold); }
  .steps { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .steps li { position: relative; z-index: 0; isolation: isolate; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px 6px 12px;
    font: 900 italic 20px/1.02 var(--f-head); text-transform: uppercase; letter-spacing: 0.03em; color: #fff; -webkit-text-stroke: 2.2px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); }
  .steps li::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 4px 0 var(--hard); }
  .steps .s1::before { background: linear-gradient(90deg, #ff8a1f, #ffb347); }
  .steps .s2::before { background: linear-gradient(90deg, #0fb8e8, #19d3ff); }
  .steps .s3::before { background: linear-gradient(90deg, var(--blue2), var(--purple)); }
  .steps svg { width: 34px; height: 34px; flex: none; fill: initial; stroke: none; }
  @media (orientation: landscape) and (max-height: 520px) {
    .jwrap { width: min(780px, 100%); flex-direction: row; align-items: center; gap: 34px; }
    .jleft, .steps { flex: 1 1 0; min-width: 0; }
    .jleft { gap: 12px; }
    .steps { gap: 12px; }
    .logo span { font-size: 62px; -webkit-text-stroke-width: 9px; }
    .steps li { min-height: 56px; font-size: 21px; }
  }

  /* ---- Draw screen: STEP 1 (ship, orange) / STEP 2 (controller, cyan) / explorer / planet controller ----
     v1.4 (owner: "more space for drawing"): the paper (#stage) takes the whole screen but a slim tool rail (<= 56 px) on the right edge,
     the bottom edge in portrait; the instruction is one line over the paper's top edge (tap it: the example card); the status and the
     drawings-left counter float over its bottom edge. Both fade while a finger draws, so the whole sheet is paper. */
  #draw { --accent: #ff8a1f; --accent2: #ffb347; --glow: rgb(255 138 31 / 0.5); --rail: 52px; display: flex; flex-direction: row; gap: 6px;
    background: radial-gradient(ellipse at 50% -10%, #3b2593 0%, #17104f 50%, #0d0b2e 100%);
    padding: calc(var(--st) + 4px) calc(var(--sr) + 4px) calc(var(--sb) + 4px) calc(var(--sl) + 4px); }
  #draw[data-kind="controller"], #draw[data-kind="planetController"] { --accent: #0fb8e8; --accent2: #19d3ff; --glow: rgb(25 211 255 / 0.5); }
  .stagebox { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; border: 3px solid var(--accent); border-radius: 8px; background: rgb(13 11 46 / 0.6);
    box-shadow: 0 0 18px var(--glow); overflow: hidden; }
  .padwrap { position: absolute; inset: 0; }
  #drawPad { position: absolute; touch-action: none; background: #fbf8ef; border-radius: 3px; }
  #addPad { position: fixed; top: var(--st); left: var(--sl); width: calc(100% - var(--sl) - var(--sr)); height: calc(100% - var(--st) - var(--sb)); touch-action: none; }
  .padhint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 56px 18px 40px; pointer-events: none; transition: opacity 0.2s; }
  .padhint b { font: 900 italic 28px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.04em; color: rgb(18 10 46 / 0.2); }
  .padhint i { max-width: 460px; font: 700 15px/1.2 var(--f-body); color: rgb(18 10 46 / 0.4); }
  .padhint i:empty { display: none; }
  .padwrap.has-ink .padhint { opacity: 0; }
  /* the one-line instruction over the top edge of the paper, and SKIP / CANCEL at its end */
  .dline { position: absolute; z-index: 9; top: 5px; left: 5px; right: 5px; display: flex; align-items: center; gap: 6px; pointer-events: none; transition: opacity 0.25s; }
  .dline > * { pointer-events: auto; }
  .dhead { position: relative; z-index: 0; isolation: isolate; flex: 0 1 auto; min-width: 0; max-width: 100%; display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 10px 0 6px; text-align: left; color: #fff; }
  .dhead::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); background: linear-gradient(90deg, var(--accent), var(--accent2));
    border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 3px 0 var(--hard); }
  .dhead:active { transform: scale(0.97); }
  .dicon { flex: none; width: 32px; height: 32px; position: relative; perspective: 260px; }
  .dicon .still { width: 100%; height: 100%; animation: bob 2.4s ease-in-out infinite; }
  .spin3d { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: spin3d 3.4s linear infinite; }
  .spin3d svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: initial; stroke: none; }
  .dtxt { min-width: 0; display: flex; align-items: baseline; gap: 8px; padding: 3px 2px; line-height: 1; white-space: nowrap; overflow: hidden; }   /* padding: the outline is not clipped */
  .dtxt b { flex: none; font: 900 italic 20px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.02em; color: #fff;
    -webkit-text-stroke: 2.4px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.45); }
  .dtxt i { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 700 italic 14px/1.1 var(--f-body); color: #fff; text-shadow: 0 1px 0 rgb(10 6 30 / 0.8), 0 0 4px rgb(10 6 30 / 0.5); }
  .dq { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 2.5px solid var(--ink); border-radius: 50%; background: #fff; color: var(--ink);
    font: 900 italic 16px/1 var(--f-head); box-shadow: 0 2px 0 var(--hard); }
  .dskip { flex: none; margin-left: auto; min-height: 42px; padding: 0 14px; border: 3px solid var(--ink); border-radius: 6px; background: rgb(13 11 46 / 0.86); color: #fff;
    font: 900 italic 16px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 3px 0 var(--hard); transform: skewX(-8deg); }
  .dskip:active { transform: skewX(-8deg) scale(0.94); }
  .dstat { position: absolute; z-index: 3; left: 8px; right: 8px; bottom: 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; transition: opacity 0.25s; }
  .dstat .status { padding: 3px 12px 4px; border-radius: 6px; background: rgb(13 11 46 / 0.78); }
  .dstat .status:empty { display: none; }
  #draw.inking .dline, #draw.inking .dstat { opacity: 0.18; }
  #draw.inking .dline > * { pointer-events: none; }
  /* the tool rail: icon buttons with a tiny caption, DONE in gold at the thumb's end */
  .rail { flex: 0 0 var(--rail); min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 5px; }
  .rail .grow { flex: 1 1 0; min-height: 0; }
  .rseg { display: flex; flex-direction: column; gap: 3px; padding: 3px; border: 3px solid var(--ink); border-radius: 8px; background: rgb(13 11 46 / 0.88); box-shadow: 0 3px 0 var(--hard); }
  .rb { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; padding: 3px 0; border-radius: 6px;
    color: #fff; font: 900 italic 10.5px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  .rail > .rb { border: 3px solid var(--ink); background: rgb(13 11 46 / 0.88); box-shadow: 0 3px 0 var(--hard); }
  .rb svg.ic { width: 22px; height: 22px; }
  .rb:active { transform: scale(0.92); }
  .rb:disabled { opacity: 0.5; filter: grayscale(0.5); }
  .rb.on { color: var(--ink); background: linear-gradient(#ffe58a, var(--gold)); }
  .rail > .rdone { min-height: 66px; font-size: 14px; color: var(--ink); background: linear-gradient(#ffe58a, var(--gold) 45%, var(--gold2)); box-shadow: 0 4px 0 var(--hard); }
  .rdone svg.ic { width: 28px; height: 28px; stroke-width: 3; }
  .inkdot { width: 22px; height: 22px; border: 3px solid #fff; border-radius: 50%; background: var(--pen, #111); box-shadow: 0 0 0 2px var(--ink); }
  .inkpick { position: fixed; z-index: 7; display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 3px solid var(--ink); border-radius: 10px; background: rgb(13 11 46 / 0.94); box-shadow: 0 4px 0 var(--hard); }
  .inkpick button { width: 40px; height: 40px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px var(--ink); }
  .inkpick button.on { outline: 3px solid var(--gold); outline-offset: 2px; }
  /* the example card: the instruction line opens it (and it opens by itself the first time per step on this phone) */
  .guide { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; padding: 52px 8px 8px; background: rgb(8 6 28 / 0.62); }
  .gcard { position: relative; z-index: 0; isolation: isolate; width: min(700px, 100%); max-height: 100%; display: flex; gap: 16px; align-items: center; padding: 14px 18px 16px;
    animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  .gcard::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-3deg); background: linear-gradient(160deg, #3a2a9a, #1a1252); border: 4px solid var(--ink);
    border-radius: 8px; box-shadow: 0 7px 0 var(--hard), 0 0 0 4px var(--accent) inset; }
  .gcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; }
  #guideTitle { font-size: 30px; color: #fff; }
  .example { position: relative; flex: 0 0 46%; height: min(62vh, 250px); display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #fffdf5; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 5px 0 var(--hard); transform: rotate(-1.2deg); }
  .example svg { width: 100%; height: 100%; display: block; }
  .example::before { content: attr(data-tag); position: absolute; left: 0; top: 0; z-index: 1; padding: 2px 9px 3px 7px; border-radius: 0 0 8px 0;
    background: var(--ink); color: #fff; font: 900 italic 11px/1 var(--f-head); letter-spacing: 0.1em; text-transform: uppercase; }
  .gtext p { font: 700 15px/1.25 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.75); }
  .gtext p:empty { display: none; }
  .gtext #drawLine, .gtext .ln { margin-top: 6px; color: #ffe27a; }
  .gtext .gskip { margin-top: 6px; font-size: 13px; opacity: 0.8; }
  .camcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 52px 8px 30px; text-align: center; }
  .camintro { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .camhint { max-width: 330px; font: 700 14px/1.25 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.75); }
  .bigshot { min-height: 92px; padding: 0 34px; font-size: 27px; }
  .bigshot svg.ic { width: 38px; height: 38px; }
  .preview { flex: 1 1 0; min-height: 0; max-width: 100%; object-fit: contain; border: 3px solid #fff; border-radius: 6px; background: #fff; box-shadow: 0 5px 0 var(--hard); }
  #draw .preview { width: 100%; }
  #draw .camcard { padding-bottom: 62px; }     /* RETAKE / USE THIS PHOTO stay above the status and the counter */
  #camActions .btn { min-height: 46px; }
  @media (orientation: portrait) {
    #draw { flex-direction: column; }
    .rail { flex: 0 0 var(--rail); flex-direction: row; align-items: stretch; }
    .rseg { flex-direction: row; }
    .rb { min-width: 44px; min-height: 0; padding: 0 4px; }
    .rail > .rb { flex: 1 1 0; max-width: 64px; }
    .rail > .rdone { flex: 0 0 84px; max-width: none; min-height: 0; flex-direction: row; gap: 5px; font-size: 17px; }
    .inkpick { flex-direction: row; }
    .gcard { flex-direction: column; align-items: stretch; }
    .example { flex: none; height: min(30vh, 210px); }
    .dtxt i { display: none; }       /* portrait: the title alone fits the line; the card says the rest */
  }
  @media (max-height: 440px) and (orientation: landscape) {
    .dline .dtxt b { font-size: 18px; }
    #guideTitle { font-size: 26px; }
  }
  @media (max-height: 380px) and (orientation: landscape) {      /* Safari's bars up: the rail still fits (about 300 px) */
    .rail { gap: 4px; }
    .rb { min-height: 42px; }
    .rb svg.ic { width: 20px; height: 20px; }
    .rail > .rdone { min-height: 54px; }
    .dhead, .dskip { height: 38px; min-height: 38px; }
  }

  /* ---- Screen and sheet transitions: everything that opens fades in (the 3D play screen does not) ---- */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet, #draw, #join { animation: fadeIn 0.22s ease-out both; }
  .rwrap, .xwrap, .reswrap { animation: pop 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }

  /* ---- Sheets: generating, wrong drawing, results, explorer... ---- */
  .sheet { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
    background: rgb(8 6 28 / 0.9); padding: calc(var(--st) + 12px) calc(var(--sr) + 16px) calc(var(--sb) + 12px) calc(var(--sl) + 16px); }
  .spinner { width: 46px; height: 46px; border-radius: 50%; border: 6px solid rgb(255 255 255 / 0.16); border-top-color: var(--gold); animation: spin 0.8s linear infinite; }
  #gen { z-index: 9; }
  #gen h2 { font-size: 30px; }
  /* the drawing being read: a white card with a light sweeping over it */
  .genpic { position: relative; width: min(46vw, 210px); height: min(30vh, 150px); padding: 8px; overflow: hidden; background: #fff; border: 4px solid var(--ink); border-radius: 10px;
    box-shadow: 0 6px 0 var(--hard), 0 0 26px rgb(255 203 61 / 0.35); transform: rotate(-2deg); animation: pop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  .genpic img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .genpic .scan { position: absolute; left: 0; right: 0; top: 0; height: 34%; background: linear-gradient(transparent, rgb(255 203 61 / 0.45), transparent); animation: scan 1.1s ease-in-out infinite alternate; }
  @keyframes scan { from { transform: translateY(-40%); } to { transform: translateY(230%); } }
  #genErr { max-width: 420px; font-size: 16px; }
  #genErr:empty, #genSub:empty { display: none; }
  @media (max-height: 440px) and (orientation: landscape) { .genpic { height: 30vh; } #gen { gap: 8px; } }
  .dialog { position: relative; z-index: 0; isolation: isolate; width: min(440px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 22px 22px; }
  .dialog::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-3deg); background: linear-gradient(160deg, #3a2a9a, #1a1252); border: 4px solid var(--ink);
    border-radius: 8px; box-shadow: 0 7px 0 var(--hard), 0 0 0 4px var(--gold) inset; }
  .dialog .dpic { width: 66px; height: 66px; animation: bob 2.4s ease-in-out infinite; }
  .dialog .dpic svg { width: 100%; height: 100%; fill: initial; stroke: none; }
  #wrong { z-index: 9; }
  #wrongText { font-size: 27px; line-height: 1.02; }
  /* result sheet: the item reveal */
  #result { background: radial-gradient(ellipse at 28% 48%, #5d2dd6 0%, #26166f 42%, #0d0b2e 100%);
    padding: calc(var(--st) + 10px) calc(var(--sr) + 14px) calc(var(--sb) + 10px) calc(var(--sl) + 14px); }
  .rwrap { width: min(900px, 100%); height: 100%; display: flex; gap: 22px; align-items: center; }
  .rleft { flex: 1 1 0; min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .rtitle { font-size: 38px; text-align: center; animation: pop 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  .rstage { position: relative; width: 100%; max-width: 330px; flex: 1 1 0; min-height: 120px; max-height: 330px; }
  .rays { position: absolute; inset: -6%; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, rgb(255 255 255 / 0.18) 0 6deg, transparent 6deg 17deg);
    -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 68%); mask-image: radial-gradient(circle, #000 12%, transparent 68%); }
  #previewCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .flatcard { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: 600px; }
  .flat3d { width: 62%; height: 62%; padding: 8px; background: #fff; border: 4px solid var(--ink); border-radius: 10px; box-shadow: 0 7px 0 var(--hard); animation: spin3d 4.2s linear infinite; }
  .flat3d img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .building { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
  .building span { font: 800 14px/1.1 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); }
  .rright { flex: 1 1 0; min-width: 0; min-height: 0; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 9px; text-align: center; }
  .rright > :first-child { margin-top: auto; }
  .rright > :last-child { margin-bottom: auto; }
  .rbtns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; margin-top: 4px; }
  .utip { font: 700 14px/1.22 var(--f-body); color: #ffe27a; text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); min-height: 1.2em; }
  .utip:empty { display: none; }
  /* the unlock card: a rarity item card (purple with a gold frame) */
  .ucard { position: relative; overflow: hidden; padding: 10px 12px 12px; text-align: left; border: 4px solid var(--gold); border-radius: 8px;
    background: linear-gradient(160deg, #c46bff 0%, #7b36ef 50%, #3b1c97 100%); box-shadow: 0 6px 0 var(--hard), 0 0 26px rgb(180 92 255 / 0.55); }
  .ucard::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 28%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.4), transparent);
    transform: translateX(-160%) skewX(-20deg); animation: shine 1.3s ease-out 0.5s 1 both; pointer-events: none; }
  @keyframes shine { to { transform: translateX(480%) skewX(-20deg); } }
  .uhead { font: 900 italic 17px/1 var(--f-head); letter-spacing: 0.09em; text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 2.2px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 7px; margin-top: 8px; list-style: none; }
  .chip { position: relative; z-index: 0; isolation: isolate; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 7px;
    font: 900 italic 16px/1 var(--f-head); letter-spacing: 0.03em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    animation: pop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; animation-delay: calc(var(--i, 0) * 90ms + 200ms); }
  .chip::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.82); border: 2px solid var(--ink); border-radius: 4px; }
  .chip i { width: 18px; height: 18px; border-radius: 50%; background: var(--green); border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-style: normal; flex: none; }
  .chip i svg { width: 11px; height: 11px; stroke: var(--ink); stroke-width: 4; fill: none; }
  .chip small { font: 700 12px/1 var(--f-body); letter-spacing: 0; text-transform: none; -webkit-text-stroke: 0; color: #e7dcff; }
  .chips.many { gap: 5px 6px; margin-top: 6px; }
  .chips.many .chip { font-size: 14px; padding: 3px 9px 3px 5px; }
  .chips.many .chip small { display: none; }
  .chips.many .chip i { width: 15px; height: 15px; }
  /* the locked part of the card: the skills this drawing does not have yet, and what to draw for each */
  .ulock { margin-top: 9px; padding-top: 7px; border-top: 2px dashed rgb(255 255 255 / 0.4); }
  .ulock .uhead { font-size: 14px; color: #fff; }
  .ulist { list-style: none; display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
  .ulist li { font: 700 13px/1.2 var(--f-body); color: #f1e9ff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.7); animation: pop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; animation-delay: calc(var(--i, 0) * 90ms + 450ms); }
  .ulist li b { font: 900 italic 15px/1 var(--f-head); letter-spacing: 0.03em; text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; margin-right: 4px; }
  /* the controller preview: the drawing, every control outlined and labelled */
  .cprev { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .cstage { position: relative; width: 100%; height: 0; padding-top: 50%; border: 4px solid var(--cyan); border-radius: 8px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #3a2a9a, #17104f); box-shadow: 0 6px 0 var(--hard), 0 0 22px rgb(25 211 255 / 0.35); }
  .cstage img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.92; }
  .cbox { position: absolute; border: 3px solid var(--cyan); border-radius: 10px; background: rgb(25 211 255 / 0.14); }
  .cbox.stick { border-radius: 50%; }
  .cbox.lock { border-color: #ff8aa0; border-style: dashed; background: rgb(255 59 92 / 0.14); }
  .ctag { position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); padding: 3px 8px 3px 7px; border: 2px solid var(--ink); border-radius: 5px; white-space: nowrap;
    font: 900 italic 13px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; color: #fff; background: #0fb8e8; box-shadow: 0 2px 0 var(--hard); }
  .cbox.lock .ctag { background: #c8324f; }
  .ctag b { color: #b6ff9a; font-style: normal; }
  .clist { list-style: none; display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .clist li { font: 700 14px/1.2 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); }
  .clist li.ok { color: #b6ff9a; }
  @media (orientation: portrait) {
    .rwrap { flex-direction: column; justify-content: center; gap: 10px; }
    .rleft, .rright { flex: none; width: 100%; height: auto; }
    .rstage { flex: none; width: min(70vw, 270px); height: min(70vw, 270px); max-height: none; }
  }
  #result[data-group="controller"] .rleft { flex-grow: 1.25; }
  @media (max-height: 440px) and (orientation: landscape) {     /* the NEXT button stays in view without scrolling */
    .ucard { padding: 8px 10px 9px; }
    .ulist li:nth-child(n+3) { display: none; }
    #result .btn.big { min-height: 54px; font-size: 24px; }
    #result .rbtns { gap: 8px; }
  }

  /* explorer prompt (orange) and optional controller redraw prompt (cyan) */
  #explorer, #ctrlPrompt { background: linear-gradient(rgb(8 6 28 / 0.88), rgb(8 6 28 / 0.72)); }   /* the island stays visible behind the prompt (PLAN: it is live) */
  .xwrap { width: min(760px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .xhead { position: relative; z-index: 0; isolation: isolate; display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 7px 18px 8px 12px; text-align: left; }
  .xhead::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); background: linear-gradient(90deg, var(--accent), var(--accent2)); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 5px 0 var(--hard); }
  #explorer { --accent: #ff8a1f; --accent2: #ffb347; }
  #ctrlPrompt { --accent: #0fb8e8; --accent2: #19d3ff; }
  .xbody { display: flex; gap: 12px; align-items: center; text-align: left; }
  .xbody > * { flex: 1 1 0; min-width: 0; }
  .xbody .example { max-height: 156px; min-height: 90px; flex: 1 1 0; height: 140px; }
  .xbody p { font: 700 15px/1.25 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); }
  .xbtns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; margin-top: 8px; }
  #ctrlPrompt .xwrap { width: min(520px, 100%); text-align: center; }
  #ctrlPrompt .xbody { text-align: center; }
  @media (orientation: portrait) { .xbody { flex-direction: column; align-items: stretch; } .xbody .example { flex: none; height: 120px; } }

  /* ---- Play ---- */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #placeholder { position: fixed; inset: 0; background: radial-gradient(ellipse at 60% 30%, #3a1c78 0%, #11103a 45%, #05060f 100%); }
  #placeholder.plain::after { content: none; }
  #placeholder::after { content: attr(data-t); position: absolute; left: 0; right: 0; top: 55%; text-align: center; font: 800 12px/1 var(--f-body); letter-spacing: 0.3em; color: rgb(255 255 255 / 0.28); }
  #area { transition: opacity 0.4s; }
  #area.locked { opacity: 0.2; pointer-events: none; }
  #area.shot { transition: none; }
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.42; pointer-events: none; }
  #hits { position: absolute; inset: 0; touch-action: none; }
  .hit { position: absolute; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; pointer-events: none; border: 3px dashed rgb(255 255 255 / 0.62); border-radius: 16px;
    background: rgb(255 255 255 / 0.05); box-shadow: 0 0 0 2px rgb(10 6 30 / 0.3), inset 0 0 0 2px rgb(10 6 30 / 0.22); transition: transform 0.08s, background 0.12s, scale 0.18s cubic-bezier(0.3, 1.8, 0.5, 1); }   /* the dark rim keeps the box visible on bright scenes */
  .hit .lab { font: 900 italic 14px/1 var(--f-head); letter-spacing: 0.06em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.6); }
  .hit.stick { border-radius: 50%; }
  /* v1.5 press juice: the "scale" property squashes the box and springs it back, composing with an EMP's translate (no stick: its knob maths) */
  .hit.down { background: rgb(25 211 255 / 0.3); border-style: solid; border-color: #fff; scale: 0.9; transition: transform 0.08s, background 0.06s, scale 0.05s ease-out; }
  .hit.stick.down { scale: none; }
  .hit.toggle.on { background: rgb(255 203 61 / 0.3); border-color: var(--gold); }
  .hit.locked { border-color: rgb(255 255 255 / 0.28); background: rgb(0 0 0 / 0.28); }
  .hit.locked .lab { opacity: 0.55; }
  .hit .lock { position: absolute; right: -9px; top: -11px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--ink); border-radius: 50%;
    background: var(--red); box-shadow: 0 3px 0 var(--hard); font-size: 12px; line-height: 1; }
  .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 4px solid var(--ink);
    background: radial-gradient(circle at 35% 30%, #fff 0%, #ffe58a 42%, #ffb000 100%); box-shadow: 0 4px 0 var(--hard); will-change: transform; }
  #sketch { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.5s; color: #e9f6ff; }
  #sketch.on { opacity: 1; }
  #sketch svg { width: 100%; height: 100%; }
  #ghost { position: absolute; z-index: 3; display: flex; align-items: center; justify-content: center; border: 3.5px dashed var(--gold); border-radius: 14px; background: rgb(255 203 61 / 0.08);
    font: 900 italic 22px/1 var(--f-head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; animation: ghostPulse 1s ease-in-out infinite alternate; }
  @keyframes ghostPulse { from { opacity: 0.55; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }
  /* Sol's controller: a sandboxed frame over the whole play area (ctrl-sandbox.js). The frame takes the touches; while it is live the DOM
     controls (#hits) hide and the drawing underneath turns faint (the tiles already sit where the drawn boxes are). #ghost (z 3) stays above. */
  #ctl { position: absolute; inset: 0; z-index: 2; pointer-events: none; }   /* an empty #ctl must never cover the DOM controls below it */
  #ctl iframe { pointer-events: auto; }
  #area.locked #ctl iframe { pointer-events: none; }   /* landing / take-off: no control (the overlay fades), as for the DOM controls */
  #area.sb #hits { display: none; }
  #area.sb #ink { opacity: 0.2; }
  #cd { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  /* a skill that is cooling down: its control greys out and a chip counts the seconds */
  .hit.cool { opacity: 0.5; filter: grayscale(0.8); }
  .cdchip { position: absolute; transform: translate(-50%, -50%); min-width: 34px; height: 34px; padding: 0 8px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--ink); border-radius: 17px;
    background: rgb(13 11 46 / 0.9); box-shadow: 0 3px 0 var(--hard); font: 900 italic 20px/1 var(--f-head); font-variant-numeric: tabular-nums; color: var(--gold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }

  /* HUD along the top */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
    padding: calc(var(--st) + 8px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px); }
  #hud .hl { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 9px; }
  #hud .hr { flex: 1 1 0; min-width: 0; display: flex; justify-content: flex-end; }
  .tools { display: flex; gap: 6px; pointer-events: auto; }
  .tool { position: relative; z-index: 0; isolation: isolate; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; color: #fff; transition: transform 0.08s; }
  .tool::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: linear-gradient(#5aa0ff, #6a35e0); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--hard); }
  .tool:active { transform: scale(0.9); }
  .tool.on { color: var(--ink); }
  .tool.on::before { background: linear-gradient(#ffe58a, var(--gold)); }
  .tool.empty { opacity: 0.5; }
  .tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .tool svg.fill { fill: currentColor; stroke: none; }
  .badge { position: absolute; right: -7px; top: -9px; z-index: 2; min-width: 20px; height: 20px; padding: 0 4px; border: 2px solid var(--ink); border-radius: 10px;
    background: var(--gold); color: var(--ink); font: 900 12px/16px var(--f-body); text-align: center; }
  #hud .hc { flex: none; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; max-width: 46vw; }
  .objpanel { position: relative; z-index: 0; isolation: isolate; min-width: 210px; padding: 6px 24px 8px; text-align: center; }
  .objpanel::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: linear-gradient(90deg, var(--blue2), var(--purple));
    border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 5px 0 var(--hard); }
  #obj { font: 900 italic 21px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.03em; color: #fff; -webkit-text-stroke: 2.6px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 rgb(10 6 30 / 0.5); white-space: nowrap; }
  .objbar { height: 9px; margin: 5px auto 4px; width: 100%; transform: skewX(-14deg); background: rgb(13 11 46 / 0.9); border: 2px solid var(--ink); border-radius: 2px; overflow: hidden; }
  .objbar b { display: block; height: 100%; background: linear-gradient(#ff9a7a, var(--red)); transform-origin: left; will-change: transform; }
  #status { font: 800 12px/1.1 var(--f-body); letter-spacing: 0.04em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.75); white-space: nowrap; }
  .timer { position: relative; z-index: 0; isolation: isolate; display: flex; align-items: baseline; gap: 8px; padding: 3px 16px 4px; }
  .timer::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.86); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 4px 0 var(--hard); }
  .timer .tl { font: 800 11px/1 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: #bfb5ff; }
  #clock { font: 900 italic 26px/1 var(--f-head); font-variant-numeric: tabular-nums; color: #fff; -webkit-text-stroke: 2.4px var(--ink); paint-order: stroke fill; }
  .timer.low::before { background: #c8324f; animation: lowPulse 0.55s ease-in-out infinite alternate; }
  @keyframes lowPulse { from { transform: skewX(-9deg) scale(1); } to { transform: skewX(-9deg) scale(1.07); } }
  body[data-phase="lobby"] #tAdd, body[data-phase="lobby"] #tRedraw { display: none; }
  body[data-phase="lobby"] #hud .objpanel, body[data-phase="lobby"] #hud .timer, body[data-phase="scoreboard"] #hud .hc { visibility: hidden; }
  body[data-phase="countdown"] #hud .objpanel, body[data-phase="countdown"] #hud .timer { visibility: hidden; }   /* the big 3-2-1 says it */
  body:not([data-phase="lobby"]) #tFull { display: none; }   /* back into full screen from the lobby; in play the tools stay five */
  #radar { width: 84px; height: 84px; display: block; }
  /* a dark scrim behind the HUD: its words read on the white sand of the island and the pink nebula */
  #hud::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--st) + 122px); z-index: -1; pointer-events: none;
    background: linear-gradient(rgb(8 6 28 / 0.6), rgb(8 6 28 / 0.32) 55%, rgb(8 6 28 / 0)); }
  #hud .hr { gap: 10px; align-items: flex-start; }
  /* my points, with a +N / -N pop on every change (a steal shows as a red minus) */
  .score { position: relative; z-index: 0; isolation: isolate; display: flex; flex-direction: column; align-items: flex-end; min-width: 78px; padding: 4px 14px 6px; }
  .score::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.86); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 4px 0 var(--hard); }
  #scoreN { font: 900 italic 27px/1 var(--f-head); font-variant-numeric: tabular-nums; color: var(--gold); -webkit-text-stroke: 2.6px var(--ink); paint-order: stroke fill; }
  #scoreRank { margin-top: 2px; font: 900 italic 12px/1 var(--f-head); letter-spacing: 0.08em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  #scoreRank:empty { display: none; }
  .spop { position: absolute; right: 6px; top: 100%; margin-top: 5px; white-space: nowrap; pointer-events: none; font: 900 italic 24px/1 var(--f-head); color: var(--gold);
    -webkit-text-stroke: 2.8px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 rgb(10 6 30 / 0.5); animation: spop 1.15s ease-out both; }
  .spop.neg { color: #ff6a85; }
  @keyframes spop { 0% { opacity: 0; transform: translateY(-8px) scale(0.6); } 14% { opacity: 1; transform: translateY(0) scale(1.18); } 28% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(18px); } }
  body[data-phase="lobby"] .score { visibility: hidden; }
  /* the name under each HUD tool, the first few times the play screen opens */
  .tool::after { content: attr(data-cap); position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    font: 900 italic 12px/1 var(--f-head); letter-spacing: 0.06em; color: #fff; -webkit-text-stroke: 2.2px var(--ink); paint-order: stroke fill; }
  #hud.caps .tool::after { opacity: 1; }
  /* hit and spawn-shield feedback when mischief-fx.js (its direction marker and shield aura) is missing */
  #hurt { position: fixed; inset: 0; z-index: 8; pointer-events: none; opacity: 0; box-shadow: inset 0 0 0 6px rgb(255 59 92 / 0.85), inset 0 0 70px rgb(255 59 92 / 0.6); }

  #play.spawn::after { content: ""; position: fixed; inset: 0; z-index: 3; pointer-events: none; box-shadow: inset 0 0 0 4px rgb(25 211 255 / 0.85), inset 0 0 40px rgb(25 211 255 / 0.5); animation: aura 0.7s ease-in-out infinite alternate; }
  @keyframes aura { from { opacity: 0.55; } to { opacity: 1; } }

  /* hold-to-see tooltip and the "locked" tip above a control */
  #tip { position: fixed; left: 0; top: 0; z-index: 7; max-width: min(300px, 62vw); padding: 8px 14px 10px; text-align: center; pointer-events: none; opacity: 0;
    transform: translate(-50%, -100%) scale(0.9); transition: opacity 0.12s, transform 0.12s; }
  #tip.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #tip::before { content: ""; position: absolute; inset: 0 0 7px 0; z-index: -1; background: linear-gradient(135deg, #3a2a9a, #1a1252); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 4px 0 var(--hard); }
  #tip::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 14px; height: 14px; margin-left: -7px; z-index: -1; transform: rotate(45deg); background: #1a1252; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }

  #tipText { display: block; margin-top: 3px; font: 700 13px/1.2 var(--f-body); color: #fff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.7); }
  #legend { position: fixed; left: 0; right: 0; bottom: calc(var(--sb) + 10px); z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 0 calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px);
    pointer-events: none; opacity: 0; transition: opacity 0.3s; }

  /* the announcement chip: one short line under the objective for a big moment (boss down, a chest, a steal, my kill). The toast sits below it. */
  #chip { position: fixed; left: 50%; top: calc(var(--st) + 114px); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 2px; width: max-content; max-width: min(520px, 86vw); padding: 6px 22px 8px;
    text-align: center; pointer-events: none; isolation: isolate; transform: translate(-50%, 0); transition: opacity 0.2s, transform 0.2s; }
  #chip.off { opacity: 0; transform: translate(-50%, -12px); }
  #chip::before { content: ""; position: absolute; inset: 0 0 4px 0; z-index: -1; transform: skewX(-9deg); border: 3px solid #fff; border-radius: 10px; box-shadow: 0 4px 0 var(--hard), 0 8px 14px rgb(0 0 0 / 0.35), inset 0 3px 0 rgb(255 255 255 / 0.35);
    background: linear-gradient(180deg, #ffe36e 0%, #ffb21f 50%, #d26a06 100%); }
  #chip[data-tone="cyan"]::before { background: linear-gradient(180deg, #86dcff 0%, #2f8bff 50%, #1647c8 100%); }

  #chip[data-tone="violet"]::before { background: linear-gradient(180deg, #d49bff 0%, #9d4dff 50%, #5a1bc4 100%); }
  #chipTitle { font: 900 italic 22px/1 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); }
  #chipSub { font: 800 italic 14px/1 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; color: #fff; -webkit-text-stroke: 2.4px var(--ink); paint-order: stroke fill; }
  #chipSub:empty { display: none; }
  .mfx-toasts { top: calc(env(safe-area-inset-top, 0px) + 168px) !important; }   /* mischief-fx's own toasts: under the HUD, not over the timer */
  /* toast bubbles */
  #toast { position: fixed; left: 50%; top: calc(var(--st) + 168px); z-index: 6; width: max-content; max-width: min(540px, 80vw); padding: 10px 18px 13px; text-align: center; pointer-events: none;
    transform: translate(-50%, 0); transition: opacity 0.2s, transform 0.2s; isolation: isolate; }
  #toast.act { pointer-events: auto; }
  #toast.off { opacity: 0; transform: translate(-50%, -14px); pointer-events: none; }
  #toast::before { content: ""; position: absolute; inset: 0 0 5px 0; z-index: -1; transform: skewX(-6deg); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 0 5px 0 var(--hard); background: linear-gradient(135deg, #3a2a9a, #231a78); }
  #toast[data-kind="hint"]::before { background: linear-gradient(135deg, #ffe58a, var(--gold2)); }
  #toast[data-kind="refused"]::before { background: linear-gradient(135deg, #ff6a85, #c8324f); }
  #toastText { display: block; font: 800 16px/1.2 var(--f-body); color: #fff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.6); }
  #toast[data-kind="hint"] #toastText { color: var(--ink); text-shadow: none; }
  #toastAct { margin-top: 8px; min-height: 48px; font-size: 18px; }
  /* while the add-a-button sheet is open the toast sits above it, low on the screen (the hint used to hide behind the photo card) */
  body.adding #toast { z-index: 9; top: auto; bottom: calc(var(--sb) + 64px); }

  /* wait banner, GO!, results */
  #banner { position: fixed; left: 50%; top: 50%; z-index: 5; transform: translate(-50%, -48%); width: min(440px, 62vw); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 18px 20px; text-align: center; isolation: isolate; }
  #banner::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-4deg); background: linear-gradient(160deg, rgb(58 42 154 / 0.94), rgb(23 16 79 / 0.94)); border: 4px solid var(--ink); border-radius: 8px; box-shadow: 0 7px 0 var(--hard), 0 0 0 4px var(--gold) inset; }
  #bannerTitle { font-size: 40px; color: var(--gold); -webkit-text-stroke-width: 3.6px; }
  #bannerSub { font: 700 15px/1.2 var(--f-body); text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); }
  #bannerActions { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  #bannerActions .row { gap: 12px; }
  .redo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .redo .btn { min-height: 48px; }
  .redo span { font: 700 11px/1 var(--f-body); color: #d9d0ff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); }
  #go { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
  #go b { font: 900 italic 150px/0.8 var(--f-head); text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 11px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 rgb(10 6 30 / 0.6); }
  #go.on { animation: goPop 1.15s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  @keyframes goPop { 0% { opacity: 0; transform: scale(0.4) rotate(-6deg); } 22% { opacity: 1; transform: scale(1.18) rotate(-6deg); } 36% { transform: scale(1) rotate(-6deg); }
    78% { opacity: 1; transform: scale(1.05) rotate(-6deg); } 100% { opacity: 0; transform: scale(1.6) rotate(-6deg); } }
  /* the death card: big and centred while my ship is destroyed, above every mischief overlay (mfx: ink 9000, toasts 9100) */
  #dead { position: fixed; inset: 0; z-index: 9300; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.18s; }
  #dead.on { opacity: 1; }
  #dead::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgb(120 0 24 / 0.12) 30%, rgb(170 8 40 / 0.6) 100%); }
  .dcard { position: relative; z-index: 0; isolation: isolate; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 46px 16px; transform: rotate(-2deg); }
  #dead.on .dcard { animation: deadPop 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  @keyframes deadPop { 0% { transform: rotate(-2deg) scale(0.55); opacity: 0; } 62% { transform: rotate(-2deg) scale(1.08); opacity: 1; } 100% { transform: rotate(-2deg) scale(1); opacity: 1; } }
  .dcard::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); background: linear-gradient(160deg, rgb(70 14 44 / 0.95), rgb(20 8 36 / 0.95)); border: 4px solid var(--ink); border-radius: 8px;
    box-shadow: 0 7px 0 var(--hard), 0 0 0 4px var(--red) inset, 0 0 40px rgb(255 59 92 / 0.45); }
  #deadTitle { font-size: 62px; color: var(--red); -webkit-text-stroke-width: 6px; }
  #deadBy { font: 900 italic 28px/1 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; display: flex; align-items: center; gap: 10px; }
  #deadBy:empty { display: none; }
  #deadBy i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: var(--gold); flex: none; }
  #deadBy b { color: var(--gold); font-weight: 900; }
  .dback { display: flex; align-items: baseline; gap: 12px; margin-top: 4px; font: 900 italic 24px/1 var(--f-head); letter-spacing: 0.06em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 3.4px var(--ink); paint-order: stroke fill; }
  #deadN { display: inline-block; min-width: 0.8em; text-align: center; font-size: 56px; color: var(--gold); -webkit-text-stroke-width: 6px; }
  #deadN.tick { animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  #deadPts { margin-top: 2px; padding: 2px 14px 3px; border: 3px solid var(--ink); border-radius: 6px; background: var(--red); font: 900 italic 22px/1 var(--f-head); letter-spacing: 0.05em; color: #fff; -webkit-text-stroke: 2.6px var(--ink); paint-order: stroke fill; box-shadow: 0 3px 0 var(--hard); transform: skewX(-9deg); }
  #fight { position: fixed; inset: 0; z-index: 9300; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
  #fight b { font: 900 italic 64px/0.9 var(--f-head); text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 rgb(10 6 30 / 0.6); text-align: center; }
  #fight.on { animation: goPop 1.1s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  /* page-level notice (visible on every screen): "ANA WAS TAKEN · YOU ARE ANA2" */
  #notice { position: fixed; left: 50%; top: calc(var(--st) + 16px); z-index: 40; max-width: min(560px, 92vw); padding: 8px 22px 10px; text-align: center; pointer-events: none; isolation: isolate; transform: translate(-50%, 0); transition: opacity 0.2s, transform 0.2s; }
  #notice.off { opacity: 0; transform: translate(-50%, -16px); }
  #notice::before { content: ""; position: absolute; inset: 0 0 4px 0; z-index: -1; transform: skewX(-7deg); border: 3px solid #fff; border-radius: 10px; box-shadow: 0 4px 0 var(--hard), 0 8px 14px rgb(0 0 0 / 0.35);
    background: linear-gradient(180deg, #ffe36e 0%, #ffb21f 50%, #d26a06 100%); }
  #noticeText { display: block; font: 900 italic 21px/1.05 var(--f-head); letter-spacing: 0.04em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 rgb(10 6 30 / 0.5); text-wrap: balance; }
  #resultsSheet { z-index: 7; background: radial-gradient(ellipse at 30% 20%, #4f2dbb 0%, #1d1360 45%, #0d0b2e 100%); }
  .reswrap { width: min(820px, 100%); display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 22px; align-items: center; }
  .reshead { flex: 1 1 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #resTitle { font-size: 46px; color: var(--gold); -webkit-text-stroke-width: 4px; animation: pop 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; }
  #resWinner { font: 900 italic 24px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.04em; color: #fff; -webkit-text-stroke: 2.6px var(--ink); paint-order: stroke fill; }
  #resWinner b { color: var(--gold); }
  .resme { flex: 1 1 0; min-width: 180px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .rank { position: relative; z-index: 0; isolation: isolate; padding: 8px 26px 10px; }
  .rank::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: linear-gradient(160deg, #c46bff, #5d2dd6); border: 4px solid var(--gold); border-radius: 8px; box-shadow: 0 6px 0 var(--hard); }
  #resRank { font-size: 44px; }
  #resPts { font: 900 italic 22px/1 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 2.4px var(--ink); paint-order: stroke fill; }
  #resList { flex: 1 1 0; min-width: 240px; list-style: none; display: flex; flex-direction: column; gap: 5px; text-align: left; }
  #resList li { position: relative; z-index: 0; isolation: isolate; display: flex; align-items: center; gap: 10px; padding: 5px 14px 6px 10px; font: 900 italic 20px/1 var(--f-head); text-transform: uppercase; letter-spacing: 0.03em; color: #fff;
    -webkit-text-stroke: 2.2px var(--ink); paint-order: stroke fill; animation: pop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.4) both; animation-delay: calc(var(--i, 0) * 70ms + 150ms); }
  #resList li::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.82); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 0 3px 0 var(--hard); }
  #resList li.me::before { background: linear-gradient(90deg, #c98a10, var(--gold2)); }
  #resList li .n { width: 1.4em; color: var(--gold); }
  #resList li .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
  #resList li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #resList li .pt { font-variant-numeric: tabular-nums; }
  #resNextRound { flex: 1 1 100%; font: 900 italic 22px/1 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 2.4px var(--ink); paint-order: stroke fill; text-align: center; }
  @media (orientation: portrait) { .resme, #resList { flex: 1 1 100%; } }
  /* v1.5 results: big and celebratory for the winner (gold sheet, a spinning star, confetti), kind for everyone else */
  #resYou { font-size: 40px; color: #fff; -webkit-text-stroke-width: 3.6px; animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.5) 0.1s both; }
  #resYou:empty { display: none; }
  .rank { animation: pop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.6) 0.2s both; }
  #resStar { position: absolute; left: 50%; top: 50%; z-index: -2; width: 150px; height: 150px; margin: -75px 0 0 -75px; display: none; pointer-events: none;
    background: radial-gradient(circle, rgb(255 227 110 / 0.9) 0 18%, rgb(255 176 0 / 0.35) 40%, transparent 68%); border-radius: 50%; }
  #resStar::before { content: "★"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 150px; line-height: 1; color: var(--gold);
    -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; opacity: 0.95; animation: spin 7s linear infinite; }
  #resultsSheet.win { background: radial-gradient(ellipse at 50% 30%, #ffcf4a 0%, #e0811c 30%, #6b2bb8 70%, #1d1360 100%); }
  #resultsSheet.win #resYou { color: var(--gold); font-size: 54px; text-shadow: 0 5px 0 rgb(10 6 30 / 0.5); }
  #resultsSheet.win #resStar { display: block; }
  #resultsSheet.win .rank::before { background: linear-gradient(160deg, #ffe36e, #ffb000 55%, #d26a06); border-color: #fff; }
  #resultsSheet.win #resPts { color: var(--gold); }
  #resList li:nth-child(1) .n { color: var(--gold); }
  #resList li:nth-child(2) .n { color: #dfe6ff; }
  #resList li:nth-child(3) .n { color: #ff9b5c; }
  #resList li.gap { margin-top: 6px; }
  #resNextRound { animation: npulse 1s ease-in-out infinite alternate; }
  #resNextRound.wait { color: #d9d0ff; animation: none; }
  @keyframes npulse { from { transform: scale(1); } to { transform: scale(1.06); } }
  @media (max-height: 440px) and (orientation: landscape) { #resTitle { font-size: 30px; } #resYou { font-size: 32px; } #resultsSheet.win #resYou { font-size: 40px; } #resRank { font-size: 38px; } #resStar { transform: scale(0.75); } }

  /* v1.5 waiting card: what is happening now, a bar with a shimmer that keeps moving, and a tip from the game */
  .gprog { width: min(78vw, 360px); display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .gbar { position: relative; display: block; height: 18px; overflow: hidden; border: 3px solid var(--ink); border-radius: 9px; background: rgb(255 255 255 / 0.12); box-shadow: 0 3px 0 var(--hard); }
  .gbar b { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0.04); background: linear-gradient(90deg, var(--gold2), var(--gold)); transition: transform 14s cubic-bezier(0.1, 0.7, 0.2, 1); }
  .gbar.go b { transform: scaleX(0.94); }
  .gbar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.55), transparent); animation: shimmer 1.1s linear infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  #genStage { font: 900 italic 19px/1 var(--f-head); letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  #genStage.tick { animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.5) both; }
  .gtip, .btip { max-width: min(80vw, 420px); font: 700 14px/1.25 var(--f-body); color: #d9d0ff; text-shadow: 0 2px 0 rgb(10 6 30 / 0.8); transition: opacity 0.25s; }
  .gtip:empty, .btip:empty { display: none; }
  .gtip.fade, .btip.fade { opacity: 0; }
  .btip { font-style: normal; max-width: 90%; }
  @media (max-height: 440px) and (orientation: landscape) { .gtip { font-size: 13px; } .gbar { height: 14px; } }

  /* v1.5 button juice: a ring bursts from a pressed control; a gold ring sweeps round a control while it cools down, and flashes when it is ready */
  .pfx { position: absolute; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 14px rgb(25 211 255 / 0.8); pointer-events: none; transform: translate(-50%, -50%) scale(0.55); opacity: 0.95;
    animation: pfx 0.36s ease-out forwards; }
  .pfx.ready { border-color: var(--gold); box-shadow: 0 0 18px rgb(255 203 61 / 0.9); animation-duration: 0.5s; }
  @keyframes pfx { to { transform: translate(-50%, -50%) scale(1.25); opacity: 0; } }
  .cdchip.ring { min-width: 0; padding: 0; border: 0; background: none; box-shadow: none; border-radius: 50%; }
  .cdchip.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .cdchip.ring .bg { fill: rgb(13 11 46 / 0.55); stroke: rgb(13 11 46 / 0.85); stroke-width: 14; }
  .cdchip.ring .fg { fill: none; stroke: var(--gold); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
  .cdchip.ring span { position: relative; font: 900 italic 22px/1 var(--f-head); font-variant-numeric: tabular-nums; color: var(--gold); -webkit-text-stroke: 2.2px var(--ink); paint-order: stroke fill; }

  /* v1.5 vibration switch (Android only: iPhones have none), in the wait banner */
  .hapbtn { font: 800 13px/1 var(--f-body); letter-spacing: 0.04em; color: #d9d0ff; padding: 8px 12px; min-height: 36px; border: 2px solid rgb(217 208 255 / 0.4); border-radius: 18px; }
  .hapbtn.on { color: #fff; border-color: var(--gold); }
  @media (prefers-reduced-motion: reduce) { #resYou, .rank, #resStar::before, #resNextRound, .gbar::after, #genStage.tick { animation: none !important; } .pfx { display: none; } }

  /* redraw menu (the pencil tool) */
  #redrawMenu { position: fixed; left: calc(var(--sl) + 12px); top: calc(var(--st) + 148px); z-index: 7; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 12px 12px; isolation: isolate; }
  #redrawMenu::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(160deg, #3a2a9a, #1a1252); border: 4px solid var(--ink); border-radius: 8px; box-shadow: 0 6px 0 var(--hard); }
  #redrawMenu .btn { width: 100%; }
  .redo-note { font: 700 11px/1 var(--f-body); color: #d9d0ff; margin: -2px 0 6px 4px; }

  /* add a button (over the game) */
  #add { z-index: 8; justify-content: flex-start; background: rgb(8 6 28 / 0.3); }
  #add.camera { background: rgb(8 6 28 / 0.92); }
  body.adding #hud, body.adding #legend, body.adding #chip { visibility: hidden; }   /* v1.4: only the pad and my controller's ink behind it */

  /* v1.5 the HUD switch (owner, 10 Oct 11:23): one small eye button in a corner no drawn control covers (placeHudBtn, re-placed on rotate /
     resize / a new controller). body.hudoff hides the normal UI: vitals, objective, timer, score, radar, the tool row, name tags, toasts,
     chips, hit markers, coach bubbles. Always kept: the 3D view (never paused), my controller, the 3-2-1 / GO!, the death card, the results,
     the wait banner, the big late card and the mischief that acts on the controls (EMP swap, ink). */
  .hudbtn { position: fixed; z-index: 7; width: 46px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; color: #fff; isolation: isolate;
    pointer-events: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: transform 0.08s; }
  .hudbtn::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-9deg); background: rgb(13 11 46 / 0.78); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 3px 0 var(--hard); }
  .hudbtn:active { transform: scale(0.9); }
  .hudbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .hudbtn b { font: 900 italic 11px/1 var(--f-head); letter-spacing: 0.08em; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .hudbtn.off { color: var(--ink); }
  .hudbtn.off::before { background: linear-gradient(#ffe58a, var(--gold)); }
  .hudbtn.off b { color: #fff; }
  .hudbtn.hidden, body.adding .hudbtn { display: none; }
  /* the corner it sits in (data-at), with the HUD row making room for it on its side */
  .hudbtn[data-at="tl"] { left: calc(var(--sl) + 8px); top: calc(var(--st) + 8px); }
  .hudbtn[data-at="tr"] { right: calc(var(--sr) + 8px); top: calc(var(--st) + 8px); }
  .hudbtn[data-at="bl"] { left: calc(var(--sl) + 8px); bottom: calc(var(--sb) + 8px); }
  .hudbtn[data-at="br"] { right: calc(var(--sr) + 8px); bottom: calc(var(--sb) + 8px); }
  body[data-hudbtn="tl"] #hud { padding-left: calc(var(--sl) + 66px); }
  body[data-hudbtn="tr"] #hud { padding-right: calc(var(--sr) + 66px); }
  body.hudoff #hud, body.hudoff #legend, body.hudoff #chip, body.hudoff #toast, body.hudoff #tip, body.hudoff #redrawMenu, body.hudoff #hurt,
    body.hudoff .bse-tags, body.hudoff .pe-coach, body.hudoff .mfx-toasts, body.hudoff [data-mfx="hit"], body.hudoff [data-mfx="toast"] { visibility: hidden !important; }
  /* v1.5 no overlaps (HUD shown): a HUD piece over the control a finger is on fades to 25 % until the finger lifts (overlapFade) */
  .ovf:not(.off) { opacity: 0.25 !important; transition: opacity 0.12s !important; }
  #addRegion { position: fixed; z-index: 1; display: flex; align-items: center; justify-content: center; pointer-events: none; border: 3.5px dashed var(--gold); border-radius: 14px; background: rgb(255 203 61 / 0.08);
    font: 900 italic 24px/1 var(--f-head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
  /* v1.4: the tools are a slim rail on the right edge (the pad under it is the whole play area, so the new button lands where it is drawn) */
  .addrail { position: fixed; z-index: 5; top: calc(var(--st) + 6px); bottom: calc(var(--sb) + 6px); right: calc(var(--sr) + 6px); width: 52px; pointer-events: none; }
  .addrail > * { pointer-events: auto; }
  .addrail .grow { pointer-events: none; }
  #add .camcard { z-index: 2; padding: calc(var(--st) + 10px) calc(var(--sr) + 66px) calc(var(--sb) + 58px) calc(var(--sl) + 10px); }
  /* a photo is in: the preview takes the room, the camera button shrinks to a RETAKE-sized one */
  #addCam.shot .bigshot { min-height: 48px; padding: 0 18px; font-size: 18px; }
  #addCam.shot .bigshot svg.ic { width: 24px; height: 24px; }
  #addCam.shot .camhint { display: none; }   /* the status and the counter sit under it */
  #addDrawStatus { position: fixed; bottom: calc(var(--sb) + 8px); left: 0; right: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }

  #rotate { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; background: radial-gradient(ellipse at 50% 30%, #3b2593, #0d0b2e 70%); }
  #rotate div { font: 900 italic 34px/1.05 var(--f-head); text-transform: uppercase; letter-spacing: 0.03em; color: #fff; -webkit-text-stroke: 3.2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 rgb(10 6 30 / 0.55); }
  #rotate svg { width: 88px; height: 88px; margin-bottom: 14px; color: var(--gold); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.landscape #rotate { display: flex; } }

  @media (max-height: 440px) and (orientation: landscape) {
    .rtitle { font-size: 32px; }
    .chip { font-size: 15px; padding: 4px 10px 4px 6px; }
    .dtxt b { font-size: 20px; }
    #bannerTitle { font-size: 34px; }
    #go b { font-size: 120px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pop, .rtitle, .chip, #resList li, #resTitle, .dicon .still, .spin3d, .dialog .dpic, .flat3d, .ucard::after, #ghost, .timer.low::before, #dead.on .dcard, #deadN.tick, .genpic, .genpic .scan, .spop,
      .sheet, #draw, #join, .rwrap, .xwrap, .reswrap, .ulist li { animation: none !important; }
    #go.on { animation-duration: 0.6s; }
  }
</style>

// ---------- small helpers ----------
const tpl = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (v && v[k] != null ? v[k] : m));
const copyAt = (path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), COPY);
const $ = (id) => document.getElementById(id);
const DPR = Math.min(2, window.devicePixelRatio || 1);
const SPECULATIVE_MS = 1200;  // a pause this long after the last stroke sends the drawing early
const AXIS_MS = 50;           // at most 20 axis messages per second
const HUD_MS = 100;           // DOM HUD at most 10 times a second
const TOAST_MS = 4000, TOAST_ACTION_MS = 7500;
const HOLD_TIP_MS = 450;      // hold a control this long to see what it does
const LEGEND_MS = 3000;       // the control names shown after a new controller
const REFUSED_QUIET_MS = 5000;   // the server's own "refused" toast is dropped this long after our locked tip
const IMAGE_PX = 512;
const MAX_BUTTONS = 16;

// Fill the HTML from COPY: [data-copy="path"] elements get their text, a few attributes are set by hand.
function applyCopy() {
  for (const el of document.querySelectorAll("[data-copy]")) {
    const v = copyAt(el.dataset.copy);
    if (typeof v === "string") el.textContent = v;
  }
  $("name").placeholder = COPY.join.namePlaceholder;
  $("placeholder").dataset.t = COPY.placeholder;
  $("example").dataset.tag = $("expExample").dataset.tag = COPY.draw.exampleTag;
  for (const [id, key] of [["tAdd", "add"], ["tRedraw", "redraw"], ["tView", "view"], ["tTilt", "tilt"], ["tSound", "sound"], ["tFull", "full"]]) { $(id).setAttribute("aria-label", COPY.tools[key]); $(id).dataset.cap = COPY.toolCaps[key]; }
  $("camRotate").setAttribute("aria-label", COPY.draw.turnPhoto);
  $("readyBtn").textContent = COPY.wait.ready;
  $("ctrlRedraw").textContent = COPY.ctrlPrompt.redraw;
  $("ctrlRedraw").append(...usesNote());
  $("cpTitle").textContent = COPY.ctrlPrompt.title;
  $("cpSub").textContent = COPY.ctrlPrompt.sub;
  document.title = COPY.brand.join(" ");
}
function usesNote(text = COPY.result.uses) { const s = document.createElement("small"); s.textContent = " " + text; return [s]; }
// A button label with a small "· uses 1 drawing" after it.
function setBtn(el, label, note) { el.textContent = label; if (note) el.append(...usesNote(note)); }
const joinWords = (list) => {
  const l = list.slice(0, 4);
  const more = list.length > 4 ? ` ${COPY.andMore}` : "";
  if (l.length < 2) return l.join("") + more;
  if (more) return l.join(", ") + more;
  return l.slice(0, -1).join(", ") + ` ${COPY.and} ` + l[l.length - 1];
};

// A random token this phone keeps (localStorage "sp.device", made once) and sends with every /join: a name in use on another phone is
// not taken over, the server answers "ana2" (renamed: true). sessionStorage backs it up where localStorage is off (private mode).
const DEVICE = (() => {
  const ok = (v) => typeof v === "string" && /^[A-Za-z0-9_-]{16,64}$/.test(v);
  let d = store.get("device");
  if (!ok(d)) { try { d = sessionStorage.getItem("sp.device"); } catch { d = null; } }
  if (!ok(d)) {
    const a = new Uint8Array(18);
    try { crypto.getRandomValues(a); } catch { for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); }
    d = btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");   // 24 characters of [A-Za-z0-9_-]
    store.set("device", d);

})();

    const text = await res.text();

  } catch (e) {

const chains = {};

  const body = JSON.stringify({ type: "input", player: S.player, action, down });
  chains[action] = (chains[action] || Promise.resolve()).then(() => fetch("/input", { method: "POST", headers: { "content-type": "application/json" }, body }))
    .then((res) => { if (res && res.status === 409) rejoinSoon(); }).catch(() => {});
}

let rejoinAt = -1e9;
function rejoinSoon() {

  rejoinAt = performance.now();
  post("/join", { player: S.player, device: DEVICE, token: DEVICE }).then((res) => {
    if (!res || !res.player) return;
    if (res.color) { S.color = colorCss(res.color); document.documentElement.style.setProperty("--me", S.color); }

    .then((res) => { if (res && res.status === 409) rejoinSoon(); }).catch(() => {}).finally(() => { a.busy = false; if (a.dirty) postAxis(a, axis); });
}

  a.x = Math.round(x * 1000) / 1000; a.y = Math.round(y * 1000) / 1000;
  const flush = () => { a.timer = 0; a.sentAt = performance.now(); postAxis(a, axis); };
  const wait = AXIS_MS - (performance.now() - a.sentAt);

// Strokes are kept in pad fractions so they can be re-rendered at any size (undo, export, overlay).
function makeSketch(canvas, { ink = "#111", width = 6, onChange, onStart } = {}) {

    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * DPR)); canvas.height = Math.max(1, Math.round(r.height * DPR));
    sk.redraw();

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStrokes(ctx, sk.strokes, canvas.width, canvas.height, sk.ink, sk.width * DPR);
  };

    e.preventDefault();

    try { canvas.setPointerCapture(e.pointerId); } catch {}
    cur = { id: e.pointerId, pts: [pt(e)] };
    if (sk.color) cur.pts.c = sk.color;   // v1.4 pen colours: kept on the stroke, so undo / resize / export keep it
    sk.strokes.push(cur.pts);

    if (!cur || e.pointerId !== cur.id) return;

// The controller on the play screen: the player's own drawing laid over the 3D view, with hit areas

function defaultLayout() {

    { type: "stick", action: "steer", label: "STEER", x: 0.04, y: 0.4, w: 0.3, h: 0.55 },
    { type: "button", action: "boost", label: "BOOST", x: 0.56, y: 0.62, w: 0.17, h: 0.32 },

  for (const b of defaultLayout().buttons) {

function applyLayout(layout, inkBase, inkButtons) {

  S.inkBase = inkBase; S.inkButtons = inkButtons || {};

const images = new Map();
function loadImg(url) {

  if (!images.has(url)) images.set(url, new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = url; }));

// ---- hit areas, multi-touch (the DOM controls: the fallback when Sol's controller frame is not in use) ----
const controls = [];         // { b, el, knob, badge, info (locked?), presses, on }
function buildHits() {

  for (const b of S.layout.buttons) {
    const el = document.createElement("div");
    el.className = "hit " + b.type;
    el.dataset.action = C.normaliseAction(b.action);   // mischief-fx's EMP finds the controls, and which is which, through this
    Object.assign(el.style, { left: b.x * 100 + "%", top: b.y * 100 + "%", width: b.w * 100 + "%", height: b.h * 100 + "%" });
    const lab = document.createElement("span"); lab.className = "lab"; lab.textContent = controlName(b); el.append(lab);
    const ctl = { b, el, presses: 0, on: false, info: null, badge: null };

// A control whose skill the current ship / explorer cannot do is dimmed and wears a lock; sticks and movement are never locked.
function refreshLocks() {

  for (const ctl of controls) {

    ctl.el.classList.toggle("locked", !!ctl.info);
    if (ctl.info && !ctl.badge) { ctl.badge = document.createElement("span"); ctl.badge.className = "lock"; ctl.badge.textContent = "🔒"; ctl.el.append(ctl.badge); }

const entityKey = (e) => (e ? `${e.type}|${(e.verbs || []).join(",")}` : "");
function setEntity(e) {

let hitRect = null;

// ---- the tip above a control: "🔒 BOOST · draw an exhaust with fire on your ship" (locked), "EMP · READY IN 12 S" (cooling down), or what a

function setScale(key, el, v) { v = Math.round(Math.max(0, Math.min(1, v)) * 100) / 100; if (hudCache[key] !== v) { hudCache[key] = v; el.style.transform = `scaleX(${v})`; } }

const fmt = (s) => { s = Math.max(0, Math.ceil(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function updateHud() {
