  updateScore(h, me);
  setCached("obj", hudEls.obj, h.phase === "lobby" || h.phase === "countdown" ? COPY.hud.getReady : String(h.objectiveText || "").toUpperCase());
  setCached("status", hudEls.status, String(h.status || "").toUpperCase());
  // time left to the cap while playing (turns red and pulses under 30 s); the lobby and the scoreboard have no timer
  const playing = h.phase === "playing" || h.phase === "assists";
  const left = typeof h.left === "number" ? h.left : Math.max(0, C.ROUND.maxSeconds - (h.clock || 0));
  setCached("clock", hudEls.clock, playing ? (typeof h.leftText === "string" ? h.leftText : fmt(left)) : "");
  const low = playing && left < 30;
  if (hudCache.low !== low) { hudCache.low = low; hudEls.timer.classList.toggle("low", low); }
  if (h.phase === "assists" && !h.status) setCached("status", hudEls.status, COPY.hud.assists);
  setScale("bar", hudEls.objBar, typeof h.bar === "number" ? h.bar : 0);
  if (vitals) {
    const dead = !!(me && me.flags && me.flags.dead);
    if (dead && !deadSince) deadSince = performance.now();
    if (!dead) deadSince = 0;
    // The server sends respawnIn while dead; count down locally from TUNING.respawnSeconds if it is missing.
    const respawnIn = me && Number.isFinite(me.respawnIn) ? me.respawnIn : dead ? Math.max(0, C.TUNING.respawnSeconds - (performance.now() - deadSince) / 1000) : 0;
    const known = S.entity && Array.isArray(S.entity.verbs);
    vitals.update({ hp: me ? me.hp : C.TUNING.shipHp, maxHp: C.TUNING.shipHp, shieldEnergy: me ? me.shieldEnergy : 1, boostEnergy: me ? me.boostEnergy : 1, dead, respawnIn,
      shieldOff: known && !S.entity.verbs.includes("shield"), boostOff: known && !S.entity.verbs.includes("boost") });
  }
  if (radar && !hudOff) radar.update(h.radar || [], me && me.mode === "planet" ? 100 : 300);   // v1.5: hidden by the HUD switch: no work
  // phases: lobby → the wait banner, playing → GO!, scoreboard → the results; the drawings are kept across rounds
  if (h.phase !== S.phase) onPhase(h.phase, h);
  if (h.phase === "scoreboard") renderResults(h);
  // landing and take-off are a predefined animation with no control: the overlay fades to 20 %
  const flags = (me && me.flags) || {};
  const locked = !!(flags.landing || flags.takingOff);
  if (hudCache.locked !== locked) { hudCache.locked = locked; $("area").classList.toggle("locked", locked); if (locked) releaseAll(); }
  // During the shot (render.js + transition.js) the overlay follows its overlayAlpha: 1 → 0.2 on landing, back on take-off.
  const shotAlpha = h.transition && typeof h.overlayAlpha === "number" ? Math.round(h.overlayAlpha * 100) / 100 : null;
  if (hudCache.shotAlpha !== shotAlpha) { hudCache.shotAlpha = shotAlpha; $("area").classList.toggle("shot", shotAlpha !== null); $("area").style.opacity = shotAlpha === null ? "" : shotAlpha; }
  // after touchdown ("planet", no longer landing, the shot over) the phone asks for the explorer, once per landing
  const mode = me ? me.mode : null;

  if (mode === "planet" && !locked && !h.transition && !S.explorerAsked && S.lastMode !== null && h.phase !== "scoreboard") { S.explorerAsked = true; openExplorer(); }
  if (mode) S.lastMode = mode;

}
function onPhase(phase, h) {

  $("banner").classList.toggle("hidden", !lobby);
  $("resultsSheet").classList.toggle("hidden", !board);
  if (board) { closeSheets("resultsSheet"); closeAdd(); releaseAll(); hudCache.resRows = null; hudCache.resNext = null; hudCache.resParty = null; if (coach) coach.hide(); }
  // a new round starts clean: no leftover ghost box or sketch hint (the server's hint ladder starts again), nothing cooling down
  if (board || lobby) { clearGhost(); clearSketch(); S.tipAt = {}; }
  if (lobby) { resetReady(); clearCooldowns(); }
  if (board || lobby) { lateSeen.clear(); if (lateCard) lateCard.hide(); }   // the big "DRAW A SHOVEL" card comes once per gate and round
  syncPlayStep();
  // GO! is played by syncCountdown (from the ticks, on every screen) when the round starts
}
// wait / play / results, unless a sheet of the planet flow (explorer, controller prompt...) owns the step
function syncPlayStep() {
  if (S.screen !== "play") return;
  if (SHEETS.some((id) => id !== "resultsSheet" && !$(id).classList.contains("hidden")) || !$("add").classList.contains("hidden")) return;
  setStep(S.phase === "scoreboard" ? "results" : S.phase === "playing" || S.phase === "assists" ? "play" : "wait");
}
// text: a countdown number when phone-extras.js (its big 3-2-1) is missing; none = GO!
function showGo(text) {
  if (!text && countdownFx) return countdownFx.go();
  const g = $("go");
  g.firstElementChild.textContent = text || COPY.go;
  g.classList.remove("on"); void g.offsetWidth; g.classList.add("on");
  clearTimeout(goTimer);      // the start sound is render.js's (WorldSound plays every game sound: the page must not play it twice)
  goTimer = setTimeout(() => g.classList.remove("on"), 1300);
}
// ---- the 3-2-1 after START (owner, 10 Oct 09:05: a server phase, so every phone counts down with the big screen), then GO! ----
// tick.countdown = whole seconds left (3, 2, 1); a server without the field: ceil(clock), which counts the seconds left in that phase. A
// server that skips the phase (lobby -> playing) gets GO! only. Driven by the ticks, so it shows over any screen, a draw sheet included.
const countdownFx = PE && typeof PE.createCountdown === "function" ? PE.createCountdown(document.body, { go: COPY.go, sub: COPY.hud.getReady }) : null;
let cdLast = null, cdPhase = null;
function syncCountdown(m) {
  const phase = m && m.phase, was = cdPhase;
  cdPhase = phase;
  if (phase === "countdown") {
    const n = Number.isFinite(m.countdown) ? Math.round(m.countdown) : Math.ceil(Number(m.clock) || 0);
    if (n >= 1 && n !== cdLast) {
      cdLast = n;
      if (countdownFx) countdownFx.show(n); else showGo(String(n));

    }

  if ((was === "countdown" || was === "lobby") && (phase === "playing" || phase === "assists")) showGo();
  else if (was === "countdown" && countdownFx) countdownFx.hide();      // back to the lobby (a reset) mid-count
}
function resetReady() { $("readyBtn").textContent = COPY.wait.ready; $("readyBtn").classList.remove("green"); }
$("readyBtn").onclick = () => {
  sendInput("ready", true); setTimeout(() => sendInput("ready", false), 120);

};
$("redrawShip").onclick = () => startRedraw("ship");
$("redrawCtrl").onclick = () => startRedraw("controller");

// ---- the round results (phase scoreboard) ----
function renderResults(h) {

  const rows = (res && Array.isArray(res.scores) ? res.scores.map(([name, score]) => ({ name, score })) : (h.scores || []).map((s) => ({ name: s.name, score: s.score })))
    .sort((a, b) => b.score - a.score);

    const w = $("resWinner"); w.replaceChildren();
    if (winner) {
      w.append(tpl(COPY.results.winner, { name: String(winner).toUpperCase() }));
      if (winner === S.player) { w.append(" "); const star = document.createElement("b"); star.textContent = COPY.results.star; w.append(star); }
    } else w.append(COPY.results.noWinner);

    $("resRank").textContent = idx >= 0 ? ordinal(idx + 1) : "–";
    $("resPts").textContent = idx >= 0 ? tpl(COPY.results.points, { n: Number(rows[idx].score).toLocaleString("en-US") }) : "";

      hudCache.resParty = party;

  setCached("resNext", $("resNextRound"), nextN > 0 ? tpl(COPY.results.next, { n: nextN }) : COPY.results.waiting);
  if (hudCache.resWait !== (nextN <= 0)) { hudCache.resWait = nextN <= 0; $("resNextRound").classList.toggle("wait", nextN <= 0); }
}

// ---------- toasts: chunky bubbles; a hint about a missing part offers a one-tap redraw ----------
let toastTimer = 0, toastRun = null;
function toastAction(m) {

  if (m.kind === "hint" && m.need === "part") return { label: planet ? COPY.toast.redrawExplorer : COPY.toast.redrawShip, run: () => startRedraw(planet ? "explorer" : "ship") };
  if (m.kind === "info" && (m.verb === "takeoff" || /wrecked your|draw a new ship/i.test(String(m.text || "")))) return { label: COPY.toast.redrawShip, run: () => startRedraw("ship") };   // a wrecked ship
  return null;
}
function showToast(m) {
  // the locked tip above the control already said it: no second message from the server for the same skill
  if (m.kind === "refused" && m.verb && performance.now() - (S.tipAt[m.verb] || -1e9) < REFUSED_QUIET_MS) return;
  // Step 2 of the hint ladder has an empty text and only a sketch: no text bubble for it. The last step for a missing part (or button) is
  // the big card instead (lateHint).
  if (m.text && !lateHint(m)) {
    const act = toastAction(m);
    $("toast").dataset.kind = m.kind || "info";

}

// ---- the late hint (owner, 10 Oct 09:05: no free skills at 3:00, the skill is never given): a big, friendly "DRAW A SHOVEL" card with the
// part's example and one tap to the drawing (a full redraw of the ship / explorer, or the add-a-button sheet on the ghost box for a missing
// button). The server sends it from 3:00 as a hint toast with late: true, title, parts (sketch names, both when the explorer misses a shovel
// AND a drill), on (ship | explorer | controller) and, for a button, the ghost box (world.js / rules.js lateHint). An older server: its
// ladder's answer step once assists are on. The ladder's answer before 3:00 stays the plain toast (with its REDRAW). Once per card and
// round, never with no drawing left here; it closes by itself after LATE_MS and whenever a draw or add sheet opens. ----
const LATE_MS = 15000;

let lateGhost = null, lateTimer = 0;

// ============================================================================================================
// What rivals do to me (mischief), the big moments (one chip), and my own death (the card)
// ============================================================================================================
const short = (name, n = 12) => String(name == null ? "" : name).toUpperCase().slice(0, n);
const isBot = (name) => { try { const h = S.game && S.game.hud && S.game.hud(); const r = h && (h.scores || []).find((x) => x.name === name); return !!(r && r.bot); } catch { return false; } };

// A toast addressed to me. My death arrives as one ("Destroyed by bob · back in 3 s", killer: "bob" | null): the death card says all of it,
// so that toast is swallowed and only its killer is kept.
function onToast(m) {
  if (m && m.kind === "info" && !m.verb && ("killer" in m || /^Destroyed\b/.test(String(m.text || "")))) return noteKiller(m.killer);
  showToast(m);
}

// ---- mischief: { type: "mischief", kind, player (the victim, me), from, seconds, points?, dir?, victim? } (render.js also sends other players'
// messages on older builds: only mine count). The effects live in mischief-fx.js and play no sound (render.js plays them). ----
let empRun = null;    // the EMP running on the DOM controls (the sandboxed frame swaps its own controls)
function onMischief(m) {
  if (!m || (m.player && m.player !== S.player) || S.screen !== "play") return;
  if (mfxLoading) return void MFXP.then(() => onMischief(m));      // still importing (a message right after the page opened)
  const host = $("play"), secs = Number(m.seconds);
  if (m.kind === "emp") buzz("emp"); else if (m.kind === "inkbomb" || m.kind === "tractor" || m.kind === "mine") buzz("mischief");
  if (!MFX) return plainMischief(m);
  try {
    switch (m.kind) {
      case "emp":      // the target is the whole play screen: its EMP overlay (and the countdown chip) then sit above the HUD; the frame is found inside it
        empRun = MFX.emp(host, secs > 0 ? secs : 5, S.ctl ? {} : { onSwap: (map) => { empMap = map || null; releaseAll(); } });
        break;
      case "inkbomb": MFX.inkBomb(host, { seconds: secs > 0 ? secs : 10 }); break;   // v1.4: it stays until wiped; seconds = the safety fade (10 s)
      case "tractor": MFX.tractorHit(host, { by: m.from, dir: Number.isFinite(+m.dir) ? -m.dir : 0, seconds: secs > 0 ? secs : undefined }); break;   // server: 0 = right, PI/2 = UP; mischief-fx: PI/2 = DOWN
      case "mine": MFX.mineHit(host, { by: m.from, points: -Math.abs(Number.isFinite(+m.points) ? +m.points : 30), stunSeconds: secs > 0 ? secs : undefined, shakeEl: $("game") }); break;
      case "decoy":    // seconds 0: no victim = I shot a decoy of m.from; a victim = my own decoy fooled him
        if (m.victim) MFX.decoyFooled(host, { by: m.victim, mine: true, victim: m.victim }); else MFX.decoyFooled(host, { by: m.from });
        break;

}
// Without mischief-fx.js: the frame's own EMP still scrambles, and a line says what happened.
function plainMischief(m) {
  const P = COPY.mischief.plain;
  if (m.kind === "emp" && S.ctl && S.ctl.handle) { try { S.ctl.handle.fx("emp", { seconds: Number(m.seconds) > 0 ? Number(m.seconds) : 5 }); } catch {} }
  const text = m.kind === "decoy" ? (m.victim ? P.decoyMine : P.decoy) : tpl(P[m.kind] || "", { n: Math.abs(Number.isFinite(+m.points) ? +m.points : 30) });
  if (text) showToast({ kind: "info", text });

// ---- the announcement chip: one short line under the objective for 2.5 s. A more important one is not pushed out by a lesser one. ----
let chipTimer = 0, chipPrio = 0;
function moment(title, { sub = "", tone = "gold", prio = 1, ms = 2500 } = {}) {
  const el = $("chip");
  if (S.screen !== "play" || (chipPrio > prio && !el.classList.contains("off"))) return;
  chipPrio = prio;
  $("chipTitle").textContent = title; $("chipSub").textContent = sub; el.dataset.tone = tone;
  el.classList.remove("off");
  clearTimeout(chipTimer);
  chipTimer = setTimeout(() => { el.classList.add("off"); chipPrio = 0; }, ms);
}
// My skill hit a rival (the kill feed names me): a gold toast. mischief-fx.js makes it when it is loaded, else the chip does.
function ownMischief(kind, victim) {
  const title = tpl(COPY.mischief.own[kind], { name: short(victim) });
  if (MFX) { try { MFX.toast(title, { tone: "gold", seconds: 2.4, screenEl: $("play") }); return; } catch {} }
  moment(title, { tone: "gold", prio: 3 });
}
// The kill feed ("announce") lines worth a chip. The TV shows the whole feed; the phone only the big moments and the ones about me.
function onAnnounce(m) {
  const t = m && typeof m.text === "string" ? m.text.trim() : "";
  if (!t || S.screen !== "play") return;
  const me = S.player, M = COPY.moment;
  let g;
  if ((g = /^(\w+) ✕ (\w+)/.exec(t))) {                       // "bob ✕ ana" (+ " 💣" / " 🧲" for a mischief kill)
    if (g[1] === me) { moment(tpl(M.kill, { name: short(g[2]) }), { sub: isBot(g[2]) ? "" : tpl(M.killSub, { n: C.SCORING.kill }), prio: 3 }); buzz("kill"); }
    else if (g[2] === me) noteKiller(g[1]);                    // the death card says who did it
  } else if ((g = /^\S+\s+(\w+) scrambled (\w+)'s buttons/.exec(t))) { if (g[1] === me) ownMischief("emp", g[2]); }
  else if ((g = /^\S+\s+(\w+) inked (\w+)'s screen/.exec(t))) { if (g[1] === me) ownMischief("inkbomb", g[2]); }
  else if ((g = /^\S+\s+(\w+) pulled (\w+) in/.exec(t))) { if (g[1] === me) ownMischief("tractor", g[2]); }
  else if ((g = /^\S+\s+(\w+) hit (\w+)'s mine/.exec(t))) { if (g[2] === me) ownMischief("mine", g[1]); }      // "ana hit bob's mine (-30)": bob owns the mine
  else if ((g = /^\S+\s+(\w+) (?:landed the last hit on the boss|destroyed the boss|stole the boss from (\w+))/.exec(t))) {
    // "💥 bob destroyed the boss! +1000" / "💥 bob stole the boss from ana! +1000" (v1.3; older: "… landed the last hit on the boss").

  // gen (reading the ship drawing), genError (a drawing that could not be read: DRAW IT AGAIN).
  go(step) {
    const img = (n) => strokesPNG(sampleStrokes(n, 1.6), 1.6, { crop: true });
    switch (step) {
      case "join": show("join"); setStep("join"); break;
      case "ship": case "controller": case "planetController": enterDraw(step); break;
      case "explorerDraw": enterDraw("explorer"); break;
      case "shipResult": S.drawn.ship = DEMO.ship; showResult("ship", { entity: DEMO.ship, image: img("ship") }); break;
      case "explorerResult": S.drawn.explorer = DEMO.explorer; showResult("explorer", { entity: DEMO.explorer, image: img("car") }); break;
      case "controllerResult": if (!S.layout) applyLayout(defaultLayout(), defaultInk(), {}); showResult("controller", { layout: S.layout, ink: S.inkBase }); break;
      case "wrong": enterDraw("ship"); showWrong("ship", { looksLike: "controller" }); break;
      case "gen": enterDraw("ship"); showGen("ship", img("ship")); break;
      case "genError": enterDraw("ship"); showGenError({ ok: false, error: "nothing to read", looksLike: "nothing", message: "We couldn't see a drawing. Draw your ship bigger and darker." }); break;
      case "wait": case "play": backToGame(); break;
      case "explorer": backToGame(); openExplorer(); break;
      case "ctrlPrompt": backToGame(); openCtrlPrompt(); break;
      case "results": backToGame(); closeSheets("resultsSheet"); hudCache.resRows = null; $("resultsSheet").classList.remove("hidden");
        renderResults({ round: 1, clock: 8, result: { reason: "chests", winner: S.player, scores: [[S.player, 4500], ["ana", 3000], ["bo", 1500], ["cy", 200]] }, scores: [] });
        setStep("results"); break;
      case "resultsLose": backToGame(); closeSheets("resultsSheet"); hudCache.resRows = null; $("resultsSheet").classList.remove("hidden");     // v1.5: 5th, kind words, no confetti
        renderResults({ round: 1, clock: 0, phase: "scoreboard", result: { reason: "time", winner: "ana", scores: [["ana", 4500], ["bo", 3000], ["cy", 1500], ["di", 1400], [S.player, 200]] }, scores: [] });
        setStep("results"); break;
    }
    return S.step;
  },
};

// ---------- start ----------
paintExplorerSheet();
applyMuted();
updateCounters();
// A refresh rejoins with the same name and keeps the drawings.
const saved = store.get("player");
const savedLayout = store.get("layout");
if (savedLayout && !C.CHECKS.layout(savedLayout).length) { S.layout = savedLayout; S.inkBase = store.get("inkBase"); S.inkButtons = store.get("inkButtons") || {}; }
setStep("join");
if (saved) { $("name").value = saved; join(saved); } else show("join");
</script>
