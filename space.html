<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Party</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: the page looks right with the fallback fonts and swaps when Barlow arrives. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800;1,900&family=Barlow:wght@500;600;700;800&family=Bebas+Neue&display=swap" media="print" onload="this.media='all'">
<style>
  /* Big screen = spectator TV, Fortnite-like: chunky slanted panels, heavy italic capitals, white text with a dark
     outline, blue / purple / gold, hard bottom shadows, pop-in motion. Everything is sized in rem: 1rem = 16px at
     1440x900 and the page scales with the screen (the smaller of width and height), so it reads from a sofa. */
  :root {
    --navy: #0d0b2e; --ink: #120a2e; --shadow: #0a0830;
    --blue: #2b7bff; --blue2: #1f5dff; --purple: #8a3dff; --purple2: #b45cff;
    --gold: #ffcb3d; --gold2: #ffb000; --green: #4ade5a; --red: #ff3b5c; --orange: #ff8a1f; --cyan: #19d3ff;
    --fh: "Barlow Condensed", Impact, "Arial Narrow", system-ui, sans-serif;
    --fd: "Bebas Neue", "Barlow Condensed", Impact, "Arial Narrow", sans-serif; /* display: the countdown and the stings */
    --fb: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
    --pop: cubic-bezier(.34, 1.56, .64, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html { font-size: min(calc(100vw / 90), calc(100vh / 56.25)); }
  html, body { height: 100%; background: #05030f; color: #fff; overflow: hidden; font-family: var(--fb); font-weight: 700; user-select: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; overflow: hidden; --bse-fs: 1rem; }
  /* A soft vignette keeps the white outlined text readable over the bright island sky. */
  #hud::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, transparent 58%, rgb(5 3 20 / .4) 100%), linear-gradient(rgb(5 3 20 / .4), transparent 20%); }

  /* Which part is on screen: lobby, play (playing + assists) or results (scoreboard). */
  #hud:not([data-view=play]) .play,
  #hud:not([data-view=play]) .bse-feed,
  #hud:not([data-view=lobby]) #roster,
  #hud:not([data-view=play]) #alarm,
  #hud:not([data-view=lobby]) #lobby,
  #hud:not([data-view=results]) #results,
  #hud:not([data-view=play]) #banner { display: none; }
  .off { display: none !important; }

  /* ---- type ---- */
  .h { font-family: var(--fh); font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: 1; color: #fff;
       -webkit-text-stroke: .1rem var(--ink); paint-order: stroke fill; text-shadow: 0 .2rem 0 rgb(10 6 30 / .55); }
  .hh { font-weight: 900; -webkit-text-stroke-width: .17rem; text-shadow: 0 .3rem 0 rgb(10 6 30 / .6); }
  .tx { font-family: var(--fb); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #fff;
        -webkit-text-stroke: .07rem var(--ink); paint-order: stroke fill; text-shadow: 0 .14rem 0 rgb(10 6 30 / .5); }
  .dk { color: #241400 !important; -webkit-text-stroke: 0 !important; text-shadow: 0 .14rem 0 rgb(255 255 255 / .5) !important; }
  /* Gradient capitals with a dark outline: the base text is the outline, ::after paints the gradient fill on top. */
  .gt { position: relative; display: inline-block; white-space: nowrap; color: var(--ink); -webkit-text-stroke: .14em var(--ink); paint-order: stroke fill;
        text-shadow: 0 .09em 0 var(--shadow), 0 .13em .2em rgb(0 0 0 / .5); }
  .gt::after { content: attr(data-t); position: absolute; left: 0; top: 0; color: transparent; -webkit-text-stroke: 0; text-shadow: none;
        background: linear-gradient(180deg, var(--g1, #fff) 5%, var(--g2, #9fd0ff) 100%); -webkit-background-clip: text; background-clip: text; }

  /* ---- slanted plates: the plate is a skewed ::before, the content stays upright ---- */
  .sk { position: relative; isolation: isolate; }
  .sk::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); border-radius: .4rem;
                background: var(--bg, linear-gradient(180deg, #3a82ff, #1f5dff)); border: .2rem solid var(--bd, #fff); box-shadow: 0 .4rem 0 var(--shadow); }
  .sk.gold { --bg: linear-gradient(180deg, #ffe27a, #ffb000); }
  .sk.purple { --bg: linear-gradient(180deg, #b45cff, #8a3dff); }
  .sk.navy { --bg: linear-gradient(180deg, rgb(46 34 150 / .96), rgb(22 14 78 / .96)); }
  .sk.green { --bg: linear-gradient(180deg, #7df08a, #27b840); }
  .sk.red { --bg: linear-gradient(180deg, #ff7b92, #ff3b5c); }

  @keyframes popIn { 0% { opacity: 0; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes riseIn { 0% { opacity: 0; transform: translateY(2.2rem) scale(.8); } 60% { opacity: 1; transform: translateY(-.2rem) scale(1.04); } 100% { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes toastIn { 0% { opacity: 0; transform: scale(.6) translateY(1rem); } 100% { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-.8rem) scale(.95); } }
  @keyframes glow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.15); } }
  @keyframes inLeft { from { opacity: 0; transform: translateX(-3rem); } to { opacity: 1; transform: none; } }
  @keyframes inRight { from { opacity: 0; transform: translateX(3rem); } to { opacity: 1; transform: none; } }
  @keyframes inDown { from { opacity: 0; transform: translateY(-3rem); } to { opacity: 1; transform: none; } }
  @keyframes inUp { from { opacity: 0; transform: translateY(3rem); } to { opacity: 1; transform: none; } }
  @keyframes tagIn { 0% { opacity: 0; transform: rotate(-3deg) scale(.6); } 60% { opacity: 1; transform: rotate(-3deg) scale(1.1); } 100% { opacity: 1; transform: rotate(-3deg) scale(1); } }
  @keyframes throb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes alarm { 0%, 100% { opacity: .1; } 50% { opacity: .85; } }
  @keyframes sweep { to { transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================= PLAY ================= */
  /* scoreboard, top left */
  #scores { position: absolute; left: 1.6rem; top: 1.4rem; width: 19.2rem; z-index: 20; animation: inLeft .55s var(--pop) both; }
  #scoresTitle { display: inline-block; padding: .45rem 1.5rem .55rem 1.2rem; margin: 0 0 .9rem .3rem; }
  #scoresTitle span { font-size: 1.95rem; }
  #rows { position: relative; height: calc(var(--n, 0) * 3.45rem + var(--x, 0) * .6rem); }
  .row { position: absolute; left: 0; top: 0; width: 100%; height: 2.95rem; transform: translateY(calc(var(--i, 0) * 3.45rem)); transition: transform .45s var(--pop); }
  .row .in { position: relative; isolation: isolate; height: 100%; display: flex; align-items: center; gap: .6rem; padding: 0 .9rem 0 .45rem; }
  .row.new .in { animation: popIn .4s var(--pop) both; }
  .row .in::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); border-radius: .3rem;
                     background: linear-gradient(180deg, rgb(40 29 128 / .94), rgb(20 13 68 / .94)); border: .15rem solid rgb(255 255 255 / .55); box-shadow: 0 .28rem 0 var(--shadow); }
  .row.me .in::before { border-color: var(--gold); background: linear-gradient(180deg, rgb(96 58 210 / .97), rgb(54 28 140 / .97));
                        box-shadow: 0 .28rem 0 var(--shadow), 0 0 1.3rem rgb(255 203 61 / .55); }
  .row.dead { opacity: .55; }
  /* v1.6: the followed player outside the top 7 is an extra row under rank 7 (a small gap and a dashed rule), never in its place */
  .row.extra { transform: translateY(calc(var(--i, 0) * 3.45rem + .6rem)); }
  .row.extra::before { content: ""; position: absolute; left: 2.4rem; right: 1.2rem; top: -.5rem; border-top: .16rem dashed rgb(255 255 255 / .5); }
  /* the player's true colour as a chip; the name itself is a readable tint of it (dark blues and purples read from the sofa) */
  .row .sw { flex: none; width: .55rem; height: 1.85rem; transform: skewX(-8deg); border-radius: .15rem; background: var(--pc, #fff);
             border: .12rem solid rgb(255 255 255 / .85); box-shadow: 0 .14rem 0 var(--shadow); margin-right: -.15rem; }
  .rk { position: relative; isolation: isolate; flex: none; width: 2.2rem; height: 2.2rem; display: grid; place-items: center; font-size: 1.5rem; }
  .rk::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); border-radius: .28rem;
                background: linear-gradient(180deg, #4b61f0, #2a3bb8); border: .13rem solid rgb(255 255 255 / .75); }
  .rk.r1, .rk.r2, .rk.r3 { color: #241400; -webkit-text-stroke: 0; text-shadow: 0 .1rem 0 rgb(255 255 255 / .5); }
  .rk.r1::before { background: linear-gradient(180deg, #fff0a0, #ffb800); border-color: #fff; }
  .rk.r2::before { background: linear-gradient(180deg, #f4f7ff, #a3afd3); border-color: #fff; }
  .rk.r3::before { background: linear-gradient(180deg, #ffc690, #d9782f); border-color: #fff; }
  .row .nm { flex: 1; min-width: 0; font-size: 1.85rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-bottom: .1rem; }
  .row .pl { flex: none; width: 1.15rem; height: 1.15rem; display: block; }
  .row .pl:empty { display: none; }
  .row .pl svg { display: block; width: 100%; height: 100%; }
  .row .sc { font-size: 1.95rem; font-variant-numeric: tabular-nums; }
  .row .st { flex: none; font-size: 1.35rem; color: var(--gold); white-space: nowrap; }
  .row .st:empty { display: none; }
  #more { margin: .3rem 0 0 .6rem; font-size: 1.6rem; color: #d6d0ff; }
  #more:empty { display: none; }

  /* objective + time left, top centre */
  #top { position: absolute; left: 0; right: 0; top: 1.4rem; display: flex; justify-content: center; align-items: stretch; gap: 1.4rem; z-index: 20; animation: inDown .55s var(--pop) .05s both; }
  #objective { width: 33.4rem; padding: .85rem 1.6rem 1.1rem; text-align: center; }
  #objTitle { font-size: 2.7rem; line-height: 1.02; min-height: 2.75rem; }
  #bar { position: relative; height: 1.3rem; margin: .65rem .8rem .55rem; transform: skewX(-14deg); border-radius: .3rem; background: rgb(10 6 30 / .78);
         border: .18rem solid #fff; box-shadow: 0 .25rem 0 var(--shadow); overflow: hidden; }
  #barFill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(var(--v, 1)); transition: transform .3s ease-out;
             background: linear-gradient(90deg, #ff3b5c, #ff8a1f); }
  #barFill::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 42%; background: linear-gradient(rgb(255 255 255 / .5), transparent); }
  #status { font-size: 1.75rem; line-height: 1.1; min-height: 1.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; padding: 0 .2rem .1rem; }
  #timerBox { width: 11rem; padding: .6rem 1rem .75rem; text-align: center; display: flex; flex-direction: column; justify-content: center; --bg: linear-gradient(180deg, #ffe27a, #ffb000); }
  #timerBox .lbl { font-size: 1.45rem; letter-spacing: .08em; }
  #timer { font-size: 4.4rem; line-height: .95; font-variant-numeric: tabular-nums; }
  #timerBox.urgent { --bg: linear-gradient(180deg, #ff7b92, #ff3b5c); animation: throb 1s ease-in-out infinite; }
  #timerBox.urgent .dk { color: #fff !important; -webkit-text-stroke: .1rem var(--ink) !important; text-shadow: 0 .2rem 0 rgb(10 6 30 / .55) !important; }
  #assistWrap { position: absolute; left: 0; right: 0; top: 100%; margin-top: 1rem; display: flex; justify-content: center; }
  #assist { padding: .35rem 1.1rem .45rem; font-size: 1.6rem; white-space: nowrap; display: none; }
  #assist.on { display: block; animation: popIn .4s var(--pop) both; }
  #alarm { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 8rem 1rem rgb(255 59 92 / .6); opacity: 0; }
  #alarm.on { animation: alarm 1s ease-in-out infinite; }

  /* right column, top right (Fortnite puts the map there): the live map (SPACE, then PLANET once it is open) and the chest counter */
  #side { position: absolute; right: 1.6rem; top: 2.3rem; width: 16.6rem; display: flex; flex-direction: column; gap: 1.5rem; z-index: 20; animation: inRight .55s var(--pop) .1s both; }
  #mapSlot .bse-map { gap: 1.6rem; }
  #mapSlot .bse-map-panel.planet .bse-map-cv { aspect-ratio: 16 / 10; }
  /* v1.6 (QA N5): one line at any size up to "32 / 32": the value never wraps or shrinks (its width is reserved), the label gives way */
  #chests { position: relative; width: 100%; padding: .55rem 1.1rem .75rem .9rem; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .6rem; align-items: center;
            --bg: linear-gradient(180deg, rgb(58 38 160 / .96), rgb(30 19 96 / .96)); --bd: var(--gold); }
  #chests svg { grid-row: 1; grid-column: 1; width: 2.6rem; height: 2.6rem; display: block; }
  #chests .ct { grid-row: 1; grid-column: 2; min-width: 0; display: flex; flex-wrap: nowrap; align-items: baseline; justify-content: space-between; gap: .5rem; }
  #chests .lbl { flex: 0 1 auto; min-width: 0; font-size: 1.3rem; color: #ffe9a3; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 padding: .1rem .25rem .3rem .1rem; } /* room for the italic overhang, the outline and the drop shadow inside the clip */
  #chestVal { flex: none; min-width: 5.6ch; text-align: right; white-space: nowrap; font-size: 2.1rem; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: 100% 60%; }
  #pips { grid-row: 2; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
  #pips:empty { display: none; }
  .pip { width: .9rem; height: .9rem; border-radius: .2rem; transform: skewX(-10deg); background: rgb(255 255 255 / .16); border: .1rem solid rgb(255 255 255 / .5); }
  .pip.on { background: linear-gradient(180deg, #ffe27a, #ffb000); border-color: #fff; }

  /* kill feed (bigscreen-extras), bottom left, newest line at the bottom: far from the banner (centre) and the map (right) */
  #hud .bse-feed { top: auto; right: auto; left: 1.6rem; bottom: 1.8rem; max-width: 40rem; font-size: 1.12rem; z-index: 35; }

  /* followed player's meters, bottom right */
  #meters { position: absolute; right: 1.6rem; bottom: 1.6rem; width: 21.6rem; padding: 1rem 1.5rem 1.35rem 1.4rem; z-index: 20; animation: inRight .55s var(--pop) .15s both; --bg: linear-gradient(180deg, rgb(58 38 160 / .96), rgb(30 19 96 / .96)); }
  #who { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem; }
  #who .lbl { font-size: 1.3rem; color: #d8d2ff; letter-spacing: .1em; }
  #who .lbl::before { content: ""; display: inline-block; width: 1.5rem; height: .95rem; margin-right: .45rem; vertical-align: .05rem; transform: skewX(-8deg);
                      border-radius: .15rem; background: var(--pc, #fff); border: .12rem solid #fff; box-shadow: 0 .12rem 0 var(--shadow); }
  #whoName { font-size: 2.6rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 .3rem .15rem 0; }
  #dead { display: none; text-align: center; margin-top: .5rem; }
  #meters.dead #dead, #meters.back #dead { display: block; }
  #meters.dead .meter, #meters.back .meter { display: none; }
  #meters.dead { --bg: linear-gradient(180deg, #ff6f8b, #d0123a); }
  #meters.dead #who .lbl, #meters.back #who .lbl { color: #fff; }
  #meters.back { --bg: linear-gradient(180deg, #7df08a, #27b840); }
  #deadTitle { font-size: 3.5rem; line-height: .95; }
  #deadSub { margin-top: .35rem; font-size: 3.2rem; line-height: 1; }
  #meters.dead #deadSub { animation: throb .9s ease-in-out infinite; }
  #meters.back #deadSub { display: none; }
  #meters.back #deadTitle { font-size: 2.7rem; }
  .meter { display: flex; align-items: center; gap: .6rem; height: 1.9rem; margin-top: .6rem; }
  .meter svg { flex: none; width: 1.75rem; height: 1.75rem; display: block; }
  .meter .lbl { width: 5.4rem; flex: none; font-size: 1.35rem; letter-spacing: .05em; }
  .track { position: relative; flex: 1; height: 1.25rem; transform: skewX(-14deg); border-radius: .3rem; background: rgb(8 6 34 / .82); border: .16rem solid #fff; box-shadow: 0 .2rem 0 var(--shadow); overflow: hidden; }
  .fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(var(--v, 1)); transition: transform .18s; background: var(--fillbg); }
  .fill::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 42%; background: linear-gradient(rgb(255 255 255 / .5), transparent); }
  #mHp { --fillbg: linear-gradient(180deg, #86f593, #26c442); }
  #mShield { --fillbg: linear-gradient(180deg, #8be9ff, #19b6ff); }
  #mBoost { --fillbg: linear-gradient(180deg, #ffe27a, #ff9a1f); }
  .meter.on .track { box-shadow: 0 .2rem 0 var(--shadow), 0 0 1rem rgb(25 211 255 / .9); }
  #mBoost.on .track { box-shadow: 0 .2rem 0 var(--shadow), 0 0 1rem rgb(255 176 0 / .95); }
  .meter.on .fill { filter: brightness(1.25) saturate(1.2); }

  /* announcement banner */
  #banner { position: absolute; left: 0; right: 0; top: 27%; display: flex; justify-content: center; pointer-events: none; z-index: 30; }
  /* centre band only: the scoreboard (left), the map (right) and the kill feed (bottom left) are never under it */
  #bannerBox { padding: 1rem 3.4rem 1.2rem; max-width: min(44rem, 50vw); opacity: 0; transform: scale(.6); }
  #bannerBox.big { padding: 1.2rem 4.4rem 1.5rem; }
  #bannerBox.gold { --bg: linear-gradient(180deg, #ffe27a, #ffb000); }
  #bannerBox.gold .h { color: #241400; -webkit-text-stroke: 0; text-shadow: 0 .2rem 0 rgb(255 255 255 / .5); }
  #bannerBox.show { animation: popIn .38s var(--pop) both; }
  #bannerBox.hide { animation: toastOut .35s ease-in both; }
  #bannerText { display: block; font-size: 2.6rem; text-align: center; line-height: 1.05; }
  #bannerBox.big #bannerText { font-size: 3.4rem; }

  /* stings: the big full-screen moments (the 3-2-1 after START, GO!, BOSS DOWN!, the last 5 seconds). Above the 3D, under the kill feed. */
  #sting { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; pointer-events: none; z-index: 32; }
  #sting.on { display: flex; }
  #sting::before { content: ""; position: absolute; left: 50%; top: 50%; width: 120vmax; height: 120vmax; margin: -60vmax 0 0 -60vmax; z-index: -1; opacity: 0;
                   background: repeating-conic-gradient(from 0deg, rgb(255 214 90 / .22) 0 6deg, transparent 6deg 16deg);
                   -webkit-mask-image: radial-gradient(circle, #000 0, transparent 40%); mask-image: radial-gradient(circle, #000 0, transparent 40%); }
  #sting.rays::before { opacity: 1; animation: spin 18s linear infinite; }
  #sting.dim { background: radial-gradient(ellipse at 50% 50%, rgb(20 10 60 / .55), transparent 62%); }
  #stingBig { font-family: var(--fd); font-weight: 400; text-transform: uppercase; font-size: 15rem; line-height: .86; letter-spacing: .02em; transform: skewX(-8deg);
              --g1: #fff6b0; --g2: #ffa800; -webkit-text-stroke: .1em var(--ink); }
  #stingBig.word { font-size: 9.5rem; }
  #stingBig.red { --g1: #ffd0d8; --g2: #ff3b5c; }
  #stingBig.blue { --g1: #ffffff; --g2: #6fc4ff; }
  #stingBig.soft { font-size: 11rem; }
  #sting.soft { opacity: .8; } /* the last seconds: see-through, the action stays visible */
  #stingBig.go { animation: stingIn .42s var(--pop) both; }
  #stingSub { padding: .5rem 2.2rem .62rem; font-size: 2.6rem; white-space: nowrap; max-width: 86vw; overflow: hidden; text-overflow: ellipsis; animation: popIn .4s var(--pop) .12s both; }
  #stingSub:empty, #stingSub.off { display: none; }
  #stingSub.gold { --bg: linear-gradient(180deg, #ffe27a, #ffb000); }
  #stingSub.gold .h { color: #241400; -webkit-text-stroke: 0; text-shadow: 0 .2rem 0 rgb(255 255 255 / .5); }
  @keyframes stingIn { 0% { opacity: 0; transform: skewX(-8deg) scale(2.2); } 55% { opacity: 1; transform: skewX(-8deg) scale(.92); } 100% { opacity: 1; transform: skewX(-8deg) scale(1); } }

  /* toasts: someone joined, sound on / off */
  #pops { position: absolute; left: 0; right: 0; top: 10.8rem; display: flex; flex-direction: column; align-items: center; gap: .7rem; z-index: 40; }
  .toast { padding: .5rem 1.7rem .62rem; font-size: 2rem; animation: toastIn .34s var(--pop) both; white-space: nowrap; }
  .toast.out { animation: toastOut .3s ease-in both; }

  /* ================= LOBBY ================= */
  #lobby { position: absolute; inset: 0; }
  #logoBar { position: absolute; top: 1rem; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 2rem; z-index: 20; animation: inDown .6s var(--pop) both; }
  .logo { display: flex; gap: 1.1rem; font-family: var(--fh); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 5.8rem; line-height: .92; transform: rotate(-2.5deg); }
  .logo .w1 { --g1: #ffffff; --g2: #8fd0ff; }
  .logo .w2 { --g1: #fff2a8; --g2: #ffa800; }
  #roundChip { --bg: linear-gradient(180deg, #b45cff, #8a3dff); padding: .5rem 1.8rem .62rem; font-size: 2.3rem; margin-top: .6rem; }

  .card { position: absolute; top: 9.8rem; width: max(21.8rem, 318px); min-height: 35rem; padding: 3.1rem 1.7rem 1.6rem; isolation: isolate; z-index: 20; }
  .card::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-3.5deg); border-radius: .8rem;
                  background: linear-gradient(180deg, rgb(46 37 172 / .95), rgb(32 21 112 / .95) 60%, rgb(24 14 84 / .95)); border: .22rem solid rgb(255 255 255 / .9);
                  box-shadow: 0 .5rem 0 var(--shadow), 0 1.2rem 2.4rem rgb(0 0 0 / .4); }
  .ribbon { position: absolute; left: -.6rem; right: -.6rem; top: -1.7rem; height: 3.6rem; display: grid; place-items: center; padding: 0 1rem; }
  .ribbon span { font-size: 1.95rem; white-space: nowrap; }
  #join { left: 1.8rem; width: max(23.6rem, 340px); animation: riseIn .55s var(--pop) both; }
  #leaderboard { right: 1.8rem; animation: riseIn .55s var(--pop) .1s both; }
  /* about a third of the screen height: scannable from the back of the room */
  #qr { width: min(100%, max(290px, 20.2rem)); margin: 0 auto; font-size: 1rem; }
  .qr-empty { aspect-ratio: 1; display: grid; place-items: center; padding: 1.4rem; text-align: center; border-radius: .9rem; border: .25rem dashed rgb(255 255 255 / .6);
              background: rgb(10 6 30 / .45); font-size: 1.4rem; line-height: 1.15; text-transform: none; letter-spacing: 0; }
  #joinUrl { position: relative; left: 50%; transform: translateX(-50%); margin: 1.1rem 0 0; width: max-content; max-width: calc(100% + 1.4rem); text-align: center; text-transform: none; letter-spacing: 0; font-family: var(--fh); font-weight: 700;
             -webkit-text-stroke: 0; text-shadow: none; color: #ffe9a3; background: rgb(10 6 30 / .66); padding: .3rem 1rem .4rem; border-radius: .6rem; overflow-wrap: anywhere; }
  #joinUrl .js { display: block; font-size: 1.35rem; line-height: 1.05; }
  #joinUrl .jh { display: block; width: max-content; margin: 0 auto; white-space: nowrap; font-size: 1.95rem; line-height: 1.08; color: #fff; } /* fitJoin() shrinks it when the address is long */
  #joinUrl .jp { display: block; font-size: 1.4rem; line-height: 1.15; }
  #joinUrl .jp:empty { display: none; }
  #steps { list-style: none; padding: 0; margin: 1.1rem 0 0; display: grid; gap: .7rem; }
  .step { display: flex; align-items: center; gap: .7rem; min-height: 3.1rem; padding: .35rem .7rem .45rem .5rem; }
  .step .n { flex: none; width: 2.1rem; height: 2.1rem; display: grid; place-items: center; font-size: 1.5rem; }
  .step .n::before { border-width: .15rem; box-shadow: none; }
  .step .t { font-size: 1.65rem; line-height: 1.05; }
  #lbList, #resLb { display: grid; gap: .6rem; align-content: start; }
  .lrow { position: relative; isolation: isolate; display: flex; align-items: center; gap: .6rem; height: 2.7rem; padding: 0 .9rem 0 .45rem; animation: popIn .38s var(--pop) both; animation-delay: calc(var(--i, 0) * 35ms); }
  .lrow::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); border-radius: .3rem; background: linear-gradient(180deg, rgb(40 29 128 / .94), rgb(20 13 68 / .94));
                  border: .15rem solid rgb(255 255 255 / .55); box-shadow: 0 .28rem 0 var(--shadow); }
  .lrow.first::before { border-color: var(--gold); box-shadow: 0 .28rem 0 var(--shadow), 0 0 1.1rem rgb(255 203 61 / .45); }
  .lrow .nm { flex: 1; min-width: 0; font-size: 1.5rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-bottom: .1rem; }
  .lrow .st { font-size: 1.35rem; color: var(--gold); white-space: nowrap; }
  .lrow .st.zero { color: rgb(255 255 255 / .35); }
  .lrow .tp { font-size: 1.35rem; min-width: 3.6rem; text-align: right; font-variant-numeric: tabular-nums; }
  .lmore { margin: .1rem 0 0 .6rem; font-size: 1.3rem; color: #d6d0ff; }
  .lbempty { display: grid; justify-items: center; align-content: center; gap: .5rem; min-height: 22rem; text-align: center; font-size: 1.7rem; line-height: 1.15; color: #e4dfff; padding: 0 .6rem; animation: popIn .4s var(--pop) both; }
  .lbempty::before { content: "★"; font-size: 6.5rem; line-height: 1; color: rgb(255 203 61 / .4); -webkit-text-stroke: 0; text-shadow: 0 .3rem 0 rgb(10 6 30 / .5); }

  /* who is in: one chip per player (name in their colour, READY or DRAWING), no tags over the ships */
  /* between the join card (1.8rem + max(23.6rem, 340px)) and the session board (1.8rem + max(21.8rem, 318px)): never under either, even at 1280x720 */
  #roster { position: absolute; left: max(27.4rem, calc(3.8rem + 340px)); right: max(25.4rem, calc(3.6rem + 318px)); top: 10.2rem; bottom: 16.6rem; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
  #rosterGrid { width: 100%; display: grid; grid-template-columns: repeat(var(--rc, 2), minmax(0, 1fr)); gap: .7rem 1.1rem; align-content: center; }
  #rosterGrid:empty { display: none; }
  .rc { position: relative; isolation: isolate; display: flex; align-items: center; gap: .55rem; height: var(--rch, 3.4rem); padding: 0 .9rem 0 .7rem; animation: popIn .38s var(--pop) both; }
  .rc::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); border-radius: .35rem; background: linear-gradient(180deg, rgb(40 29 128 / .94), rgb(20 13 68 / .94));
                border: .16rem solid rgb(255 255 255 / .6); box-shadow: 0 .3rem 0 var(--shadow); }
  .rc.ok::before { border-color: var(--green); box-shadow: 0 .3rem 0 var(--shadow), 0 0 .9rem rgb(74 222 90 / .45); }
  .rc .nm { flex: 1; min-width: 0; font-size: var(--rcf, 2rem); line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-bottom: .1rem; }
  .rc .mk { flex: none; font-size: calc(var(--rcf, 2rem) * .62); padding: .2rem .55rem .26rem; border-radius: .5rem; white-space: nowrap; }
  .rc.ok .mk { background: var(--green); color: #08260f; -webkit-text-stroke: 0; text-shadow: none; }
  .rc.wait .mk { background: rgb(255 255 255 / .16); color: #ddd8ff; }
  .rc .stc { flex: none; font-size: calc(var(--rcf, 2rem) * .7); color: var(--gold); }
  .rc .stc:empty { display: none; }
  #rosterEmpty { display: none; font-size: 3rem; text-align: center; line-height: 1.1; animation: throb 1.8s ease-in-out infinite; }
  #rosterEmpty.on { display: block; }
  /* v1.5 hangar (bigscreen-extras createHangar): a card per player with their ship drawing; the chips above are the fallback */
  #roster.hangar #rosterGrid { display: none; }

  /* attract mode: an empty lobby for a minute cycles tips on a sticker hanging from the join card (the code stays clear) */
  #tip { position: absolute; left: -.8rem; right: -.8rem; top: calc(100% - 1.3rem); min-height: 5.4rem; display: none; flex-direction: column; align-items: center;
         justify-content: center; padding: 1.15rem 1.4rem 1rem; text-align: center; z-index: 3; --bg: linear-gradient(180deg, #ffe27a, #ffb000); transform: rotate(-1.5deg); }
  #join.attract #tip { display: flex; }
  #tip .tl { position: absolute; left: 1.1rem; top: -1.25rem; padding: .22rem .95rem .32rem; font-size: 1.45rem; }
  #tipText { font-size: 2.15rem; line-height: 1.02; }
  #tip.flip { animation: tipFlip .6s var(--pop) both; }
  #join.attract .bse-qr-tile { animation: qrGlow 2.4s ease-in-out infinite; }
  @keyframes tipFlip { 0% { opacity: 0; transform: rotate(-1.5deg) perspective(40rem) rotateX(85deg) scale(.85); } 100% { opacity: 1; transform: rotate(-1.5deg); } }
  @keyframes qrGlow { 0%, 100% { box-shadow: 0 0 0 .18em #120a2e, 0 .55em 0 .18em #0a0830; } 50% { box-shadow: 0 0 0 .18em #120a2e, 0 .55em 0 .18em #0a0830, 0 0 2.6rem .5rem rgb(255 214 90 / .8); } }

  #startZone { position: absolute; left: 0; right: 0; bottom: 1.9rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; z-index: 20; animation: inUp .6s var(--pop) .1s both; }
  #startBtn { pointer-events: auto; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 1.1rem; width: 28rem; height: 7.8rem; padding: 0 2rem; border: 0; background: none;
              font: inherit; color: #1a0f3a; --bg: linear-gradient(180deg, #ffec94 0%, #ffcb3d 48%, #ffa800 100%); transition: transform .12s, filter .12s; }
  #startBtn:not(.busy)::before { animation: glow 1.6s ease-in-out infinite; }
  #startBtn::before { border-width: .28rem; border-radius: .8rem; box-shadow: 0 .6rem 0 #b86a00, 0 .85rem 0 var(--shadow), 0 1.5rem 2.2rem rgb(0 0 0 / .45); }
  #startBtn::after { content: ""; position: absolute; left: .45rem; right: .45rem; top: .4rem; height: 44%; z-index: -1; transform: skewX(-8deg); border-radius: .5rem .5rem 0 0; background: linear-gradient(rgb(255 255 255 / .6), rgb(255 255 255 / .05)); }
  #startBtn:hover { filter: brightness(1.07); }
  #startBtn:active { transform: translateY(.25rem) scale(.95); }
  #startBtn:focus-visible { outline: .3rem solid #fff; outline-offset: .5rem; }
  #startBtn svg { width: 3.6rem; height: 3.6rem; flex: none; display: block; }
  #startLabel { font-size: 5.2rem; line-height: 1; color: #1a0f3a; -webkit-text-stroke: 0; text-shadow: 0 .2rem 0 rgb(255 255 255 / .55); letter-spacing: .03em; padding-right: .3rem; }
  #startBtn.long svg { display: none; }
  #startBtn.long #startLabel { font-size: 3rem; padding: 0; }
  #startBtn.busy { filter: saturate(.7) brightness(.92); cursor: progress; }
  #lobbyCount { padding: .45rem 1.7rem .6rem; font-size: 1.75rem; white-space: nowrap; }
  #lobbyCount b { color: var(--gold); font-weight: inherit; }
  #startNote { font-size: 1.15rem; color: #e4dfff; text-align: center; }
  /* v1.7 (owner 12:26): START needs a READY player (ship + controller drawn): greyed out, no glow, until there is one */
  #startBtn.off { filter: grayscale(.75) brightness(.8); cursor: not-allowed; }
  #startBtn.off::before { animation: none; }
  /* v1.7: during a round, who waits for the next one (not ready at START, or joined later) */
  #tvWait { position: fixed; left: 50%; bottom: 1.1rem; z-index: 6; transform: translateX(-50%); max-width: 70vw; padding: .45rem 1.3rem .55rem; font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  #tvWait.hidden { display: none; }
  #tvWait b { color: var(--gold, #ffc93c); }
  /* v1.6 ENDLESS (endless.js): the switch beside START (host key E) and, in an endless game, END under the timer (or ENTER twice) */
  #startRow { display: flex; align-items: center; gap: 1.8rem; }
  #endlessBtn { pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem; width: 12rem; height: 6.2rem;
                border: 0; background: none; font: inherit; color: #fff; --bg: linear-gradient(180deg, rgb(46 34 150 / .96), rgb(22 14 78 / .96)); transition: transform .12s, filter .12s; }
  #endlessBtn.on { --bg: linear-gradient(180deg, #b45cff, #8a3dff); }
  #endlessBtn.on::before { animation: glow 1.6s ease-in-out infinite; }
  #endlessBtn:hover { filter: brightness(1.12); }
  #endlessBtn:active { transform: translateY(.2rem) scale(.95); }
  #endlessBtn:focus-visible { outline: .3rem solid #fff; outline-offset: .4rem; }
  #endlessBtn > .h:first-child { font-size: 2.2rem; }
  #endlessState { font-size: 1.5rem; padding: .1rem .7rem .15rem; border-radius: .3rem; background: rgb(0 0 0 / .35); }
  #endlessBtn.on #endlessState { background: #ffd34d; color: #1a0f3a; }
  /* v1.9 (owner 13:41): ROUND 1-4 MIN (ENDLESS beside it) and AUTO-START 15 / 30 / 60 s / OFF, and the lobby's STARTING IN n */
  #lenPanel { display: flex; align-items: center; gap: 1.3rem; pointer-events: auto; margin-top: -.2rem; }
  .seg { display: flex; align-items: center; gap: .3rem; }
  .seg > .lbl { font-size: 1.2rem; color: #e4dfff; padding-right: .35rem; }
  .seg button { pointer-events: auto; cursor: pointer; border: 0; background: none; font: inherit; color: #fff; min-width: 3rem; padding: .2rem .55rem .3rem; font-size: 1.35rem;
                --bg: linear-gradient(180deg, rgb(46 34 150 / .96), rgb(22 14 78 / .96)); transition: transform .12s, filter .12s; }
  .seg button.on { --bg: linear-gradient(180deg, #ffe27a, #ffb000); color: #1a0f3a; }
  .seg button:hover { filter: brightness(1.12); }
  .seg button:active { transform: translateY(.15rem) scale(.95); }
  .seg button:focus-visible { outline: .25rem solid #fff; outline-offset: .3rem; }
  #autoStartBar { padding: .35rem 1.7rem .5rem; font-size: 2.2rem; white-space: nowrap; --bg: linear-gradient(180deg, #ffe27a, #ffb000); color: #1a0f3a; animation: throb 1s ease-in-out infinite; }
  #autoStartBar.hidden { display: none; }
  /* v1.9 PRACTICE (owner 14:08, "play while you wait"): n PRACTICING beside the lobby count / STARTING IN (from tick.practicing) */
  #countRow { display: flex; align-items: center; justify-content: center; gap: 1.1rem; }
  #practiceChip { padding: .45rem 1.5rem .6rem; font-size: 1.75rem; white-space: nowrap; animation: popIn .38s var(--pop) both; }
  #practiceChip.hidden { display: none; }
  #practiceChip b { color: var(--gold); font-weight: inherit; }
  #endWrap { position: absolute; left: 0; right: 0; top: 100%; margin-top: 1rem; display: flex; justify-content: center; }
  #endBtn { pointer-events: auto; cursor: pointer; padding: .35rem 1.1rem .45rem; border: 0; background: none; font: inherit; font-size: 1.5rem; white-space: nowrap;
            --bg: linear-gradient(180deg, #ff7b92, #ff3b5c); }
  #endBtn.off { display: none; }
  #endBtn.armed { animation: throb .8s ease-in-out infinite; }

  /* ================= RESULTS ================= */
  #results { position: absolute; inset: 0; overflow: hidden; z-index: 20; background: radial-gradient(ellipse at 38% 42%, rgb(70 40 190 / .55), rgb(8 5 32 / .9) 72%); animation: fadeIn .4s ease-out both; }
  #rays { position: absolute; left: 33%; top: 48%; width: 120vmax; height: 120vmax; margin: -60vmax 0 0 -60vmax; opacity: .85; will-change: transform;
          background: repeating-conic-gradient(from 0deg, rgb(255 214 90 / .2) 0 6deg, transparent 6deg 16deg);
          -webkit-mask-image: radial-gradient(circle, #000 0, transparent 46%); mask-image: radial-gradient(circle, #000 0, transparent 46%); animation: spin 50s linear infinite; }
  #confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .cf { position: absolute; top: 0; left: var(--x); width: .9rem; height: 1.5rem; background: var(--c); border-radius: .15rem; animation: cf var(--t) linear var(--d) both; }
  @keyframes cf { 0% { transform: translate3d(0, -12vh, 0) rotate(0); } 100% { transform: translate3d(var(--sw), 118vh, 0) rotate(var(--r)); } }
  #resTitleWrap { position: absolute; top: 1rem; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: .35rem; animation: riseIn .6s var(--pop) both; }
  #resTitle { font-family: var(--fh); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 5.4rem; line-height: .95; --g1: #fff6b0; --g2: #ffa800; }
  #resTitle.long { font-size: 4.4rem; }
  #resSub { padding: .1rem 1.8rem .22rem; font-size: 1.8rem; }
  #resSub:empty, #resSub.off { display: none; }
  #resBody { position: absolute; left: 4rem; right: 4rem; top: 9.6rem; bottom: 7.2rem; display: grid; grid-template-columns: minmax(0, 1fr) 23.4rem; gap: 2.6rem; }
  #resLeft { display: flex; flex-direction: column; min-height: 0; }
  /* v1.5 ceremony: the places rise one at a time (3rd, 2nd, then the winner): .up = rising now (animated), .shown = already up
     (a rebuilt or skipped screen, no animation). Each place: crown (1st), name, points, their drawing standing on the block. */
  #podium { height: 18.6rem; flex: none; display: flex; align-items: flex-end; justify-content: center; gap: 1.5rem; margin-bottom: 1.2rem; }
  #podium.compact { height: 8.6rem; align-items: center; }
  .nobody { align-self: center; padding: 1.2rem 3rem 1.4rem; font-size: 3rem; text-align: center; animation: popIn .5s var(--pop) both; }
  .pc { position: relative; isolation: isolate; flex: 1 1 0; min-width: 0; max-width: 17.5rem; display: flex; flex-direction: column; align-items: center; opacity: 0; }
  .pc.up, .pc.shown { opacity: 1; }
  .pc .wl { display: flex; align-items: center; gap: .5rem; font-size: 1.5rem; color: var(--gold); margin-bottom: .1rem; }
  .pc .wl svg { width: 2.4rem; height: 1.8rem; display: block; animation: throb 1.6s ease-in-out infinite; }
  .pc .nm { max-width: 100%; font-size: 2.4rem; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: .1rem .3rem .25rem; }
  .pc.p1 .nm { font-size: 3.2rem; }
  .pc .pt { font-size: 1.8rem; color: #fff6c8; }
  .pc .pic { position: relative; width: var(--ps, 4.6rem); aspect-ratio: 1; margin-top: .4rem; border-radius: .6rem; border: .2rem solid #fff; transform: rotate(-3deg);
             background: repeating-linear-gradient(180deg, #fffdf4 0 .9rem, #dfe8ff .9rem .96rem); box-shadow: 0 0 0 .14rem var(--ink), 0 .3rem 0 .14rem var(--shadow); }
  .pc.p2 .pic { transform: rotate(3deg); }
  .pc .pic img { position: absolute; left: 6%; top: 6%; width: 88%; height: 88%; object-fit: contain; }
  .pc .pic svg { position: absolute; left: 14%; top: 14%; width: 72%; height: 72%; }
  .pc .pic.has svg { display: none; }
  .p1 { --ps: 6.2rem; }
  .p2 { --ps: 5rem; }
  .p3 { --ps: 4.4rem; }
  .pc .starTag { position: absolute; right: -2.6rem; top: -1.1rem; padding: .3rem 1rem .4rem; font-size: 1.45rem; white-space: nowrap; transform: rotate(-3deg); z-index: 2; }
  .pc .blk { position: relative; isolation: isolate; width: 100%; display: grid; place-items: center; margin-top: .5rem; font-size: 2.6rem; color: #241400; -webkit-text-stroke: 0; text-shadow: 0 .14rem 0 rgb(255 255 255 / .55); transform-origin: 50% 100%; }
  .pc .blk::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-8deg); border-radius: .4rem; border: .2rem solid #fff; box-shadow: 0 .4rem 0 var(--shadow), 0 0 0 .2rem var(--ink), inset 0 .5rem 0 var(--pc, #fff); background: var(--pbg); }
  .p1 { --pbg: linear-gradient(180deg, #fff0a0, #ffb800); }
  .p2 { --pbg: linear-gradient(180deg, #f4f7ff, #a3afd3); }
  .p3 { --pbg: linear-gradient(180deg, #ffc690, #d9782f); }
  .p1 .blk { height: 4.2rem; font-size: 3.2rem; }
  .p2 .blk { height: 3.2rem; }
  .p3 .blk { height: 2.4rem; }
  .pc.up .blk { animation: blkUp .5s var(--pop) both; }
  .pc.up .pic { animation: dropIn .6s var(--pop) .16s both; }
  .pc.up .nm, .pc.up .pt, .pc.up .wl { animation: popIn .42s var(--pop) .32s both; }
  .pc.up .starTag { animation: tagIn .5s var(--pop) .75s both; }
  .pc.p1.up::before { content: ""; position: absolute; left: 50%; top: 45%; width: 24rem; height: 24rem; margin: -12rem 0 0 -12rem; z-index: -1; border-radius: 50%; pointer-events: none;
                      background: radial-gradient(circle, rgb(255 226 122 / .7), rgb(255 176 0 / .25) 40%, transparent 68%); animation: burst 1.3s ease-out both; }
  @keyframes blkUp { 0% { transform: scaleY(0); } 65% { transform: scaleY(1.14); } 100% { transform: scaleY(1); } }
  @keyframes dropIn { 0% { opacity: 0; transform: translateY(-4.5rem) scale(.5) rotate(-14deg); } 60% { opacity: 1; transform: translateY(.3rem) scale(1.08) rotate(3deg); } 100% { opacity: 1; } }
  @keyframes burst { 0% { opacity: 0; transform: scale(.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
  #resTitle.reveal { animation: titleIn .55s var(--pop) both; }
  @keyframes titleIn { 0% { opacity: 0; transform: scale(1.7); } 60% { opacity: 1; transform: scale(.94); } 100% { opacity: 1; transform: none; } }
  /* the winner's star flies from the podium into the session leaderboard; the row it lands on flashes */
  .flyStar { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; font-family: var(--fh); font-weight: 900; font-size: 4.4rem; line-height: 1; color: #ffd84a;
             -webkit-text-stroke: .1em var(--ink); paint-order: stroke fill; text-shadow: 0 0 1.4rem rgb(255 214 90 / .95), 0 .2rem 0 var(--shadow); will-change: transform, opacity; }
  .flyStar.spark { font-size: 2rem; color: #fff3b0; -webkit-text-stroke: 0; text-shadow: 0 0 .9rem #ffd84a; }
  .landRing { position: fixed; left: 0; top: 0; width: 6rem; height: 6rem; margin: -3rem 0 0 -3rem; border-radius: 50%; border: .45rem solid #ffd84a; pointer-events: none; z-index: 59;
              box-shadow: 0 0 1.4rem rgb(255 214 90 / .9); animation: ringOut .65s ease-out both; }
  @keyframes ringOut { 0% { opacity: 1; transform: translate(var(--x), var(--y)) scale(.25); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.9); } }
  #resLb.calm .lrow { animation: none; }
  .lrow.gotStar::before { border-color: var(--gold); box-shadow: 0 .28rem 0 var(--shadow), 0 0 1.6rem rgb(255 203 61 / .9); animation: starFlash 1.3s ease-out both; }
  .lrow.gotStar .st { display: inline-block; animation: starBump .7s var(--pop) both; }
  @keyframes starFlash { 0% { filter: brightness(2.3) saturate(1.4); } 100% { filter: none; } }
  @keyframes starBump { 0% { transform: scale(2.6) rotate(-12deg); } 100% { transform: none; } }
  #resRest { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); grid-template-rows: repeat(var(--rn, 6), var(--rh, 2.4rem)); gap: .4rem 1.4rem; align-content: start; }

// START posts /start at once. { countdown: true }: the server plays its 3-2-1 first (phase "countdown", v1.3: every phone counts
// with this screen, see countdownTick); ?nocountdown (tests) asks for none, so play starts at once. An older server ignores it.
const NO_COUNTDOWN = params.has("nocountdown");
async function startRound() {
  sfxUnlock();
  sfxPlay("click");
  $("startBtn").blur();
  if (starting || view !== "lobby" || phase === "countdown") return;
  if (lobbyReady === 0 && !mocked) { setText($("startNote"), COPY.lobby.noReadyNote); return; } // v1.7: nobody to start with
  starting = true;
  setStartState("busy");
  syncAmbience(); // the lobby's ambience fades out at START
  setAttract(false);
  let next = "busy";
  try {
    const res = await fetch("/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ countdown: !NO_COUNTDOWN }) });
    const body = res.status === 409 ? await res.json().catch(() => ({})) : null;
    next = res.status === 409 ? (body && body.error === "nobody is ready" ? "idle" : "already") : res.ok ? "busy" : "error"; // v1.7
  } catch (e) { next = "error"; }
  setStartState(next);
  // The next ticks flip the phase (the 3-2-1, then play hides the lobby); if they did not (or the call failed), offer START
  // again. Never during the 3-2-1: START stays busy until play starts.
  setTimeout(() => { starting = false; if (view === "lobby" && phase !== "countdown") setStartState("idle"); }, next === "busy" ? 3000 : 1800);
}
// The 3-2-1 is the server's phase "countdown": its ticks carry the seconds left (tick.countdown, whole seconds; else tick.clock,
// fractional). Each number shows once, over the lobby, with a beep (render.js beeps only the last 10 s of a round and has no
// 3-2-1). GO! is enterPhase's when play starts: one GO! whether the server counted or not (an older one goes straight to play).
let cdNum = 0; // the number on screen (0: none)
function countdownDigit(n) {
  sting(String(n), { sub: COPY.lobby.getReady, rays: true, dim: true, ms: 0 });
  sfxPlay("countdown", { volume: 0.7, pitch: n === 1 ? 1.5 : 1 });
}
function countdownTick(m) {
  if (m.phase !== "countdown") {
    if (cdNum && m.phase === "lobby") hideSting(); // called off: no digit left behind (when play starts, GO! replaces it)
    cdNum = 0;
    return;
  }
  const n = Number.isFinite(m.countdown) ? m.countdown : Math.ceil(m.clock);
  if (n >= 1 && n !== cdNum) { cdNum = n; countdownDigit(n); }
}
// __bigscreen.countdown(): the same digits locally (no START, no server phase), one a second; resolves true when done, false
// when the screen left the lobby meanwhile.
function localCountdown() {
  return new Promise((resolve) => {
    let n = 3, seq = -1;
    const step = () => {
      if (view !== "lobby") { resolve(false); return; }
      if (n === 0) { if (seq === stingSeq) hideSting(); resolve(true); return; }
      countdownDigit(n--);
      seq = stingSeq;
      setTimeout(step, 1000);
    };
    step();
  });
}

function renderScores(h) {

function secondsLeft(h) {

  return NaN;

let lastFinalSec = 0, firstLanded = false;

function renderPlay(h) {

  flag($("assist"), "on", h.assists);

    }

// session leaderboard (their row shows one star fewer until it lands) and the full list cascades in: about 6.3 s of the 10 s
// scoreboard. Enter (the host) skips to the end. A page opened during the results, ?noceremony, reduced motion and the mock show the end at
// once (mock("results", { ceremony: true }) or __bigscreen.ceremony() plays it). v1.6: the results' ONE jingle is this page's "fanfare"
// (render.js's "win" is off on the TV): at the winner's step, at once when the end shows at once or the host skips first, and

const NO_CEREMONY = params.has("noceremony");

const shipSvg = (col) => `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l7 16 11 6-11 4-7 14-7-14-11-4 11-6z" fill="${col}" stroke="#120a2e" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="21" r="4.5" fill="#fff" stroke="#120a2e" stroke-width="2.5"/></svg>`;
function buildResults(r, h) {
  const have = !!r;
  // ONE winner: the server's world.result.winner (most points). The list is put in line with it (the winner first, the others
  // by points), so the title, the podium and the first row can never name different players.
  const scores = have && Array.isArray(r.scores) ? r.scores.map((x) => [x[0], x[1]]) : h.scores.map((x) => [x.name, x.score]);
  const winner = have ? r.winner || null : null;
  if (winner) {
    const i = scores.findIndex((x) => x[0] === winner);
    if (i < 0) scores.unshift([winner, 0]); else if (i > 0) scores.unshift(scores.splice(i, 1)[0]);
  }

  cer.final = winner ? fmt(COPY.results.wins, { name: winner }) : have ? COPY.results.nobody : COPY.results.roundOver;
  cer.reason = have ? (r.reason === "chests" ? COPY.results.allChests : r.reason === "host" ? COPY.results.gameOver : COPY.results.timesUp) : "";
  const pod = $("podium");
  flag(pod, "compact", !winner);
  if (!winner) {
    pod.innerHTML = have ? `<div class="nobody sk navy h hh">${esc(COPY.results.noStar)}</div>` : "";
  } else {
    pod.innerHTML = [1, 0, 2].filter((i) => scores[i]).map((i) => {
      const [name, score] = scores[i], col = colourOf(name), rank = i + 1, img = drawingOf(name);
      // their drawing stands on the block (a failed image falls back to the colour ship)
      const pic = img ? `<img src="${esc(img)}" alt="" onerror="this.parentNode.classList.remove('has');this.remove()">` : "";
      return `<div class="pc p${rank}" style="--pc:${col}">` +
        (rank === 1 ? `<div class="wl h">${ICON.crown}<span>${esc(COPY.results.winner)}</span></div>` : "") +
        `<div class="nm h hh" style="color:${textColour(col)}">${esc(name)}</div><div class="pt h">${esc(fmt(COPY.results.points, { n: fmtNum(score) }))}</div>` +
        `<div class="pic${img ? " has" : ""}">${shipSvg(col)}${pic}` +
        (rank === 1 ? `<div class="starTag sk gold"><span class="h dk">${esc(COPY.results.star)}</span></div>` : "") + "</div>" +
        `<div class="blk h"><span>${rank}</span></div></div>`;
    }).join("");
