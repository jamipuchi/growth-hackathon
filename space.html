<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space Party 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #mission { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; }
  #mission h2 { font-size: 15px; letter-spacing: 2px; color: #fca5a5; }
  #hpbar { width: 420px; height: 12px; margin-top: 6px; border: 1px solid #fca5a5; border-radius: 6px; overflow: hidden; }
  #hp { height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f97316); transition: width 0.1s; }
  #distance { font-size: 12px; margin-top: 4px; color: #cbd5e1; }
  #scores { position: absolute; top: 14px; left: 14px; display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
  #join { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgb(255 255 255 / 0.1); padding: 8px 14px; border-radius: 10px; font-size: 14px; }
  .label { position: absolute; font-size: 12px; font-weight: 700; transform: translate(-50%, 0); text-shadow: 0 1px 3px #000; }
  #banner { position: absolute; inset: 0; display: none; place-items: center; text-align: center; background: rgb(0 0 0 / 0.55); }
  #banner h1 { font-size: 64px; }
  #banner p { font-size: 20px; margin-top: 10px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="hud">
  <div id="mission">
    <h2>MISSION: DESTROY THE MOTHERSHIP BEFORE IT REACHES EARTH</h2>
    <div id="hpbar"><div id="hp"></div></div>
    <div id="distance"></div>
  </div>
  <div id="scores"></div>
  <div id="labels"></div>
  <div id="join">📱 Join: <b id="url"></b> — draw your controller! (keyboard: arrows · space fire · shift shield · B boost)</div>
  <div id="banner"><div><h1 id="bannerTitle"></h1><p id="bannerText"></p></div></div>
</div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const COLORS = [0x22d3ee, 0xf472b6, 0xa3e635, 0xfacc15, 0xfb923c, 0xc084fc];
const BOUNDS = { x: 14, y: 7 };
const SHIP_SPEED = 0.25;
const BULLET_SPEED = 2.2;
const FIRE_COOLDOWN = 8;
const MOTHERSHIP_HP = 600;
const MOTHERSHIP_START_Z = -260;
const MOTHERSHIP_SPEED = 0.04;
const EARTH_Z = -25;
const RESTART_MS = 8000;
const MEGA_DAMAGE = 100;
const MEGA_COOLDOWN = 900;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 120, 320);
const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 1000);
camera.position.set(0, 5, 20);
camera.lookAt(0, 0, -40);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(10, 20, 10);
scene.add(sun);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.1, 0.5, 0.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// Soft round sprite texture shared by stars, nebula clouds, glows and engine trails.
function glowTexture(inner, outer) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, inner);
  grad.addColorStop(1, outer);
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTexture("rgba(255,255,255,1)", "rgba(255,255,255,0)");

const STAR_COUNT = 2500;
const STAR_DEPTH = 400;
const starPos = new Float32Array(STAR_COUNT * 3);
const starColor = new Float32Array(STAR_COUNT * 3);
const starTint = [new THREE.Color(0xffffff), new THREE.Color(0x93c5fd), new THREE.Color(0xfde68a), new THREE.Color(0xf9a8d4)];
for (let i = 0; i < STAR_COUNT; i++) {
  starPos.set([(Math.random() - 0.5) * 300, (Math.random() - 0.5) * 200, -Math.random() * STAR_DEPTH], i * 3);
  starColor.set(starTint[i % starTint.length].toArray(), i * 3);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute("color", new THREE.BufferAttribute(starColor, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1.2, map: GLOW, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })));

function addSprite(color, scale, position, opacity) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  sprite.scale.setScalar(scale);
  sprite.position.copy(position);
  scene.add(sprite);
  return sprite;
}
[[0x7c3aed, -120, 40], [0xdb2777, 110, 20], [0x0ea5e9, 20, 70], [0x9333ea, -60, -30]].forEach(([color, x, y]) => addSprite(color, 260, new THREE.Vector3(x, y, -420), 0.35));

const earth = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 48), new THREE.MeshStandardMaterial({ color: 0x1d4ed8, emissive: 0x0b1e4a, roughness: 0.8 }));
earth.position.set(0, -75, 30);
scene.add(earth);
const clouds = new THREE.Mesh(new THREE.IcosahedronGeometry(61, 3), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, flatShading: true }));
earth.add(clouds);
addSprite(0x60a5fa, 170, earth.position.clone().add(new THREE.Vector3(0, 0, -10)), 0.55);
let shake = 0;

document.getElementById("url").textContent = `http://${location.host.startsWith("localhost") ? "<your-ip>:8000" : location.host}/controller.html`;

const players = {};
let bullets = [];
let rocks = [];
let sparks = [];
let mothership;
let frame = 0;
let state = "playing";

function makeShip(color) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, flatShading: true, metalness: 0.4, roughness: 0.4 });
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.7, 2.6, 6), mat);
  body.rotation.x = -Math.PI / 2;
  const wings = new THREE.Mesh(new THREE.BoxGeometry(3, 0.12, 0.9), mat);
  wings.position.z = 0.6;
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xfb923c).multiplyScalar(3), toneMapped: false }));
  flame.rotation.x = Math.PI / 2;
  flame.position.z = 1.7;
  const shield = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
  shield.visible = false;
  group.add(body, wings, flame, shield);
  group.userData = { flame, shield };
  return group;
}

function getPlayer(name) {
  if (players[name]) return players[name];
  const index = Object.keys(players).length;
  const color = COLORS[index % COLORS.length];
  const mesh = makeShip(color);
  mesh.position.set(-8 + (index % 5) * 4, -2, 0);
  scene.add(mesh);
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = name;
  label.style.color = "#" + color.toString(16).padStart(6, "0");
  document.getElementById("labels").appendChild(label);
  players[name] = { name, color, mesh, label, keys: {}, cooldown: 0, megaCooldown: 0, score: 0, hit: 0 };
  return players[name];
}

function makeMothership() {
  const group = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), new THREE.MeshStandardMaterial({ color: 0x4b5563, flatShading: true, metalness: 0.7 }));
  hull.scale.y = 0.45;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(14, 1.6, 8, 32), new THREE.MeshStandardMaterial({ color: 0x7f1d1d, emissive: 0x450a0a, flatShading: true }));
  ring.rotation.x = Math.PI / 2;
  const core = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xef4444).multiplyScalar(4), toneMapped: false }));
  core.position.y = -3;
  group.add(hull, ring, core);
  group.position.set(0, 4, MOTHERSHIP_START_Z);
  scene.add(group);
  return { mesh: group, ring, hp: MOTHERSHIP_HP };
}

function handleInput({ type, player, action, down }) {
  if (type === "input") getPlayer(player).keys[action] = down;
}

new EventSource("/events").onmessage = (e) => handleInput(JSON.parse(e.data));

const KEYMAP = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", " ": "fire", Shift: "shield", b: "boost", w: "win" };
addEventListener("keydown", (e) => {
  if (!KEYMAP[e.key]) return;
  e.preventDefault();
  handleInput({ type: "input", player: "keyboard", action: KEYMAP[e.key], down: true });
});
addEventListener("keyup", (e) => KEYMAP[e.key] && handleInput({ type: "input", player: "keyboard", action: KEYMAP[e.key], down: false }));

function spawnRock() {
  const size = 0.8 + Math.random() * 1.8;
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(size, 0), new THREE.MeshStandardMaterial({ color: 0xa8a29e, flatShading: true }));
  mesh.position.set((Math.random() - 0.5) * BOUNDS.x * 2, (Math.random() - 0.5) * BOUNDS.y * 2, -180);
  scene.add(mesh);
  rocks.push({ mesh, size, speed: 0.5 + Math.random() * 0.6, spin: new THREE.Vector3(Math.random(), Math.random(), 0).multiplyScalar(0.03) });
}

function explode(position, color, count = 14) {
  shake = Math.min(1.2, shake + count / 40);
  const flash = addSprite(color, count * 0.6, position, 1);
  sparks.push({ mesh: flash, v: new THREE.Vector3(), life: 12 });
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(3), toneMapped: false }));
    mesh.position.copy(position);
    scene.add(mesh);
    sparks.push({ mesh, v: new THREE.Vector3().randomDirection().multiplyScalar(0.3 + Math.random() * 0.5), life: 40 });
  }
}

// Free GPU memory for short-lived effects; sprites share one built-in geometry so only their material goes.
function removeMesh(obj) {
  scene.remove(obj.mesh);
  obj.mesh.traverse((m) => {
    m.material?.dispose();
    if (!m.isSprite) m.geometry?.dispose();
  });
  return false;
}

function updatePlayers() {
  Object.values(players).forEach((p) => {
    const { mesh, keys } = p;
    const speed = keys.boost ? SHIP_SPEED * 2 : SHIP_SPEED;
    if (keys.left) mesh.position.x -= speed;
    if (keys.right) mesh.position.x += speed;
    if (keys.up) mesh.position.y += speed;
    if (keys.down) mesh.position.y -= speed;
    mesh.position.x = THREE.MathUtils.clamp(mesh.position.x, -BOUNDS.x, BOUNDS.x);
    mesh.position.y = THREE.MathUtils.clamp(mesh.position.y, -BOUNDS.y, BOUNDS.y);
    // Bank into turns so movement reads clearly in 3D.
    mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, keys.left ? 0.5 : keys.right ? -0.5 : 0, 0.15);
    mesh.rotation.x = THREE.MathUtils.lerp(mesh.rotation.x, keys.up ? 0.25 : keys.down ? -0.25 : 0, 0.15);
    mesh.userData.flame.scale.y = keys.boost ? 2.2 : 1 + Math.sin(frame * 0.5) * 0.2;
    mesh.userData.shield.visible = !!keys.shield;
    if (frame % 2 === 0 && mesh.visible) {
      const trail = addSprite(p.color, keys.boost ? 1.6 : 1, mesh.position.clone().add(new THREE.Vector3(0, 0, 2)), 0.7);
      sparks.push({ mesh: trail, v: new THREE.Vector3(0, 0, 0.35), life: 18 });
    }
    mesh.visible = !(p.hit && Math.floor(p.hit / 5) % 2);
    if (p.cooldown > 0) p.cooldown--;
    if (p.megaCooldown > 0) p.megaCooldown--;
    if (p.hit > 0) p.hit--;
    if (keys.win && p.megaCooldown === 0 && state === "playing") fireMegaLaser(p);
    if (keys.fire && !keys.shield && p.cooldown === 0 && state === "playing") {
      const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(p.color).multiplyScalar(4), toneMapped: false }));
      bullet.scale.z = 4;
      bullet.position.copy(mesh.position).add(new THREE.Vector3(0, 0, -1.5));
      scene.add(bullet);
      bullets.push({ mesh: bullet, owner: p });
      p.cooldown = FIRE_COOLDOWN;
    }
  });
}

// The "WIN" button someone drew: a big laser beam that chunks the Mothership, on a long cooldown.
function fireMegaLaser(p) {
  p.megaCooldown = MEGA_COOLDOWN;
  const start = p.mesh.position.clone();
  const end = mothership.mesh.position.clone();
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, start.distanceTo(end), 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(p.color).multiplyScalar(5), transparent: true, opacity: 0.9, toneMapped: false }));
  shake = 1.5;
  beam.position.copy(start).lerp(end, 0.5);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.clone().sub(start).normalize());
  scene.add(beam);
  sparks.push({ mesh: beam, v: new THREE.Vector3(), life: 30 });
  mothership.hp -= MEGA_DAMAGE;
  p.score += 100;
  explode(end, 0xfacc15, 40);
}

function hitMothership(bullet) {
  const local = bullet.mesh.position.clone().sub(mothership.mesh.position);
  return Math.abs(local.z) < 4 && Math.hypot(local.x, local.y * 2) < 14;
}

function updateBullets() {
  bullets = bullets.filter((b) => {
    b.mesh.position.z -= BULLET_SPEED;
    const rock = rocks.find((r) => r.mesh.position.distanceTo(b.mesh.position) < r.size + 0.4);
    if (rock) {
      rock.dead = true;
      b.owner.score += 10;
      explode(rock.mesh.position, 0xa8a29e);
      return removeMesh(b);
    }
    if (state === "playing" && hitMothership(b)) {
      mothership.hp--;
      b.owner.score += 5;
      if (Math.random() < 0.3) explode(b.mesh.position, 0xf97316, 3);
      return removeMesh(b);
    }
    return b.mesh.position.z > -300 || removeMesh(b);
  });
}

function updateRocks() {
  rocks = rocks.filter((r) => {
    if (r.dead) return removeMesh(r);
    r.mesh.position.z += r.speed;
    r.mesh.rotation.x += r.spin.x;
    r.mesh.rotation.y += r.spin.y;
    const ship = Object.values(players).find((p) => !p.hit && p.mesh.position.distanceTo(r.mesh.position) < r.size + (p.keys.shield ? 2 : 1));
    if (ship) {
      explode(r.mesh.position, 0xa8a29e);
      if (!ship.keys.shield) {
        ship.score = Math.max(0, ship.score - 30);
        ship.hit = 60;
      }
      return removeMesh(r);
    }
    return r.mesh.position.z < 25 || removeMesh(r);
  });
  sparks = sparks.filter((s) => {
    s.mesh.position.add(s.v);
    s.mesh.scale.multiplyScalar(0.96);
    return --s.life > 0 || removeMesh(s);
  });
}

function updateMission() {
  if (state !== "playing") return;
  mothership.mesh.position.z += MOTHERSHIP_SPEED + frame / 400000;
  mothership.ring.rotation.z += 0.01;
  mothership.mesh.children[2].scale.setScalar(1 + Math.sin(frame * 0.1) * 0.15);
  const traveled = (mothership.mesh.position.z - MOTHERSHIP_START_Z) / (EARTH_Z - MOTHERSHIP_START_Z);
  document.getElementById("hp").style.width = Math.max(0, mothership.hp / MOTHERSHIP_HP) * 100 + "%";
  document.getElementById("distance").textContent = `Mothership distance to Earth: ${Math.max(0, Math.round((1 - traveled) * 100))}%`;
  if (mothership.hp <= 0) return endMission(true);
  if (traveled >= 1) endMission(false);
}

function endMission(isWin) {
  state = isWin ? "won" : "lost";
  if (isWin) {
    for (let i = 0; i < 8; i++) explode(mothership.mesh.position.clone().add(new THREE.Vector3().randomDirection().multiplyScalar(8)), i % 2 ? 0xf97316 : 0xfacc15, 30);
    scene.remove(mothership.mesh);
  }
  const mvp = Object.values(players).sort((a, b) => b.score - a.score)[0];
  document.getElementById("bannerTitle").textContent = isWin ? "🏆 MISSION COMPLETE" : "💥 EARTH IS LOST";
  document.getElementById("bannerText").textContent = (mvp ? `MVP: ${mvp.name} (${mvp.score})` : "") + " · new mission in a few seconds";
  document.getElementById("banner").style.display = "grid";
  setTimeout(startMission, RESTART_MS);
}

function startMission() {
  if (mothership) scene.remove(mothership.mesh);
  rocks.forEach(removeMesh);
  rocks = [];
  Object.values(players).forEach((p) => (p.score = 0));
  mothership = makeMothership();
  frame = 0;
  state = "playing";
  document.getElementById("banner").style.display = "none";
}

function updateHud() {
  document.getElementById("scores").innerHTML = Object.values(players).sort((a, b) => b.score - a.score)
    .map((p) => `<span style="color:#${p.color.toString(16).padStart(6, "0")}">${p.name}: ${p.score}${p.keys.win !== undefined ? (p.megaCooldown ? " ⏳" : " ⚡WIN ready") : ""}</span>`).join("");
  Object.values(players).forEach((p) => {
    const v = p.mesh.position.clone().add(new THREE.Vector3(0, -1.6, 0)).project(camera);
    p.label.style.left = ((v.x + 1) / 2) * innerWidth + "px";
    p.label.style.top = ((1 - v.y) / 2) * innerHeight + "px";
  });
}

// Stars stream toward the camera for a sense of speed, faster when anyone boosts.
function updateStars() {
  const speed = Object.values(players).some((p) => p.keys.boost) ? 3 : 1;
  for (let i = 0; i < STAR_COUNT; i++) {
    starPos[i * 3 + 2] += speed;
    if (starPos[i * 3 + 2] > 20) starPos[i * 3 + 2] -= STAR_DEPTH;
  }
  starGeo.attributes.position.needsUpdate = true;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}

function loop() {
  frame++;
  if (state === "playing" && frame % Math.max(10, 30 - Math.floor(frame / 900)) === 0) spawnRock();
  updatePlayers();
  updateBullets();
  updateRocks();
  updateMission();
  updateHud();
  earth.rotation.y += 0.001;
  clouds.rotation.y += 0.0015;
  updateStars();
  camera.position.set((Math.random() - 0.5) * shake, 5 + (Math.random() - 0.5) * shake, 20);
  shake *= 0.9;
  composer.render();
  requestAnimationFrame(loop);
}

addEventListener("resize", resize);
resize();
startMission();
loop();
</script>
</body>
</html>
